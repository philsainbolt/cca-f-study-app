les","interview-pattern","test-first","technique-matching"]},{"id":"N-3.6-02","domain":"D3","task":"3.6","scenario":"S5","type":"single","select":1,"stem":"Your CI review step runs claude -p with a review prompt, and a shell script then scrapes the text output with regular expressions to find file names, line numbers, and severities so it can post inline pull-request comments. The scraper breaks every few weeks when Claude phrases a finding differently, and comments are occasionally posted on the wrong line. Which change makes the pipeline reliable?","options":[{"id":"a","text":"Add `--output-format json` together with `--json-schema` describing each finding's file, line, severity, and message, and parse the result.","correct":true,"why":"These flags enforce structured output that conforms to a schema, so the posting script parses fields instead of guessing at prose."},{"id":"b","text":"Add a sentence to the prompt asking Claude to respond only with valid JSON.","correct":false,"why":"A prompt request is not enforcement; the output can still include prose or drift from the expected shape."},{"id":"c","text":"Run a second `claude -p` call that converts the first call's text into JSON.","correct":false,"why":"This doubles cost and adds another unenforced step; the second call can misread the first call's prose just as the regex did."},{"id":"d","text":"Add `--output-format markdown` so headings make the findings easier to scrape.","correct":false,"why":"Markdown is still free text; the pipeline needs machine-parseable fields, which is what the JSON output format with a schema provides."}],"explanation":"For CI contexts that must post findings automatically, the guide pairs --output-format json with --json-schema so Claude Code emits structured output matching a defined schema. Parsing structured fields is reliable where scraping prose is not.","tags":["ci","output-format-json","json-schema","pr-comments"]},{"id":"N-3.6-03","domain":"D3","task":"3.6","scenario":"S5","type":"multi","select":2,"stem":"Two complaints arrive about your CI integration in the same week. Reviewers say that every time a developer pushes a new commit, the review job posts the same comments it posted on the previous commit, including issues that have already been fixed. Separately, developers say the test-generation job keeps proposing test cases that already exist in the repository's test suite. Which TWO changes does the guide recommend? (Select TWO.)","options":[{"id":"a","text":"Have the posting script drop any comment whose text matches a comment already on the pull request.","correct":false,"why":"Text matching breaks when wording or line numbers shift, and it cannot tell whether an issue has actually been addressed."},{"id":"b","text":"Include the prior review's findings in the re-review context and instruct Claude to report only new or still-unaddressed issues.","correct":true,"why":"Each CI run is a fresh session; giving it the earlier findings lets it distinguish new and unresolved issues from ones already reported or fixed."},{"id":"c","text":"Run the review job only once, on the first commit of each pull request.","correct":false,"why":"Later commits would go unreviewed, which defeats the purpose of automated review."},{"id":"d","text":"Provide the existing test files in context so generated tests avoid scenarios the suite already covers.","correct":true,"why":"Claude cannot avoid duplicating tests it has never seen; supplying the existing suite is the guide's remedy."},{"id":"e","text":"Add `--json-schema` to the test-generation command so duplicate tests fail validation.","correct":false,"why":"A schema constrains output structure; it has no knowledge of which scenarios the existing suite already covers."},{"id":"f","text":"Increase the number of agentic turns so Claude has time to search the repository for existing tests on its own.","correct":false,"why":"Hoping Claude discovers the suite by itself is unreliable; the guide's approach is to provide the test files directly."}],"explanation":"Both problems come from CI sessions lacking context they need. Re-reviews should receive prior findings with an instruction to report only new or still-unaddressed issues, and test generation should receive the existing test files so it does not suggest duplicate scenarios.","tags":["ci","re-review","duplicate-comments","existing-tests"]},{"id":"N-3.6-04","domain":"D3","task":"3.6","scenario":"S5","type":"single","select":1,"stem":"Your CI test-generation job produces tests that reviewers keep rejecting: they exercise trivial getters, re-create database setup that an existing fixture already provides, and ignore the team's rule that integration tests use the factory helpers in tests/factories/. Engineers who generate tests interactively in the same repository get noticeably better results. What is the most effective fix for the CI job?","options":[{"id":"a","text":"Add a `--json-schema` to the test-generation command that requires each generated test to name a fixture.","correct":false,"why":"A schema shapes the output structure; it does not teach Claude which fixtures exist or what the team considers a valuable test."},{"id":"b","text":"Install a ~/.claude/CLAUDE.md containing the standards on the CI runner image.","correct":false,"why":"User-level memory on a runner image is invisible to the repository, drifts from what engineers use locally, and is lost when the image is rebuilt."},{"id":"c","text":"Raise the bar in the prompt by asking for only high-value tests.","correct":false,"why":"Without knowing the fixtures, factories, and the team's definition of value, the phrase gives Claude nothing concrete to act on."},{"id":"d","text":"Document the testing standards, what makes a test valuable, and the available fixtures and factories in the project CLAUDE.md so CI-invoked runs receive the same context as interactive sessions.","correct":true,"why":"CLAUDE.md is the mechanism for giving CI-invoked Claude Code project context, and the guide names testing standards and fixtures as what to document there to improve test quality."}],"explanation":"CLAUDE.md provides project context, including testing standards, fixture conventions, and review criteria, to CI-invoked Claude Code. Documenting valuable-test criteria and available fixtures there raises generation quality and reduces low-value output.","tags":["ci","claude-md","test-generation","fixtures"]},{"id":"N-3.6-05","domain":"D3","task":"3.6","scenario":"S5","type":"single","select":1,"stem":"Your pipeline has an autofix stage in which Claude Code applies lint and type fixes to a pull request, followed by a review stage. To save tokens, the review stage resumes the same session that produced the fixes and asks it to review the resulting diff. Over three months the review stage has approved every autofix, including two that broke production. What is the root cause?","options":[{"id":"a","text":"The review prompt is not strict enough; adding an instruction to be highly critical would surface the defects.","correct":false,"why":"Prompt wording does not change the fact that the reviewer is the author; it still carries the reasoning that produced the change."},{"id":"b","text":"A session reviewing changes it generated is anchored to its own reasoning and is less effective than an independent review instance with fresh context.","correct":true,"why":"The guide's point on session context isolation is that self-review by the generating session is weaker than review by an independent instance."},{"id":"c","text":"The review stage needs `--output-format json` so approvals are structured.","correct":false,"why":"Structured output changes the shape of the verdict, not the quality of the judgment behind it."},{"id":"d","text":"The same session should be reused but with a higher-tier model for the review turn.","correct":false,"why":"A stronger model still inherits the session's context and assumptions; the problem is the lack of isolation, not model capability."}],"explanation":"Session context isolation matters in CI: the session that generated code is less effective at reviewing its own changes than an independent review instance, because it shares the assumptions that produced them. Review should run in a separate instance.","tags":["ci","independent-review","session-isolation"]},{"id":"N-3.6-06","domain":"D3","task":"3.6","scenario":"S5","type":"multi","select":3,"stem":"You are writing the README section that explains how Claude Code is wired into your CI pipeline for automated review and test generation. A colleague drafted six statements for the section, and you know some of them are wrong. Which THREE statements are correct according to the guide? (Select THREE.)","options":[{"id":"a","text":"The `-p` (or `--print`) flag runs Claude Code non-interactively so the job does not wait for input.","correct":true,"why":"This is the documented flag for non-interactive mode in automated pipelines."},{"id":"b","text":"The session that generated a change is the best reviewer of that change because it retains the original intent.","correct":false,"why":"The guide states the opposite: a generating session is less effective at reviewing its own changes than an independent instance."},{"id":"c","text":"`--output-format json` combined with `--json-schema` enforces machine-parseable structured output from the run.","correct":true,"why":"These are the CLI flags the guide names for enforcing structured output in CI contexts."},{"id":"d","text":"CI runs require the `--batch` flag to suppress the interactive prompt.","correct":false,"why":"No --batch flag exists; the non-interactive flag is -p or --print."},{"id":"e","text":"The repository's CLAUDE.md supplies review criteria, testing standards, and fixture conventions to CI-invoked runs.","correct":true,"why":"CLAUDE.md is the mechanism for providing project context to Claude Code when it is invoked from CI."},{"id":"f","text":"Prior review findings should be kept out of a re-review's context so that each run is unbiased.","correct":false,"why":"The guide recommends the reverse: include prior findings and instruct Claude to report only new or still-unaddressed issues."}],"explanation":"Three facts anchor CI integration: -p or --print for non-interactive runs, --output-format json with --json-schema for structured output, and CLAUDE.md as the carrier of project context such as review criteria and fixture conventions. Self-review and withholding prior findings run against the guide.","tags":["ci","print-flag","json-schema","claude-md"]},{"id":"N-4.1-01","domain":"D4","task":"4.1","scenario":"S5","type":"single","select":1,"stem":"Your CI review prompt was updated last sprint to say \"be conservative and only report findings you are highly confident about.\" Before the change, 38% of posted findings were dismissed by developers as not real problems; after the change the dismissal rate is 35%, and the volume of genuine bug findings dropped noticeably. What is the most effective next step to improve precision?","options":[{"id":"a","text":"Strengthen the instruction further by asking the model to attach a 0-100 confidence score to every finding and suppress anything below 85.","correct":false,"why":"This is still confidence-based filtering; the guide states that general instructions about confidence fail to improve precision compared to specific categorical criteria."},{"id":"b","text":"Replace the confidence instruction with explicit categorical criteria that name which issue types to report (logic bugs, security flaws) and which to skip (style preferences, patterns local to the file).","correct":true,"why":"Explicit criteria defining what to report versus skip is what improves precision; vague instructions like \"be conservative\" barely move the false positive rate and suppress real findings."},{"id":"c","text":"Enable extended thinking for the review request so the model deliberates longer before deciding whether a finding is worth reporting.","correct":false,"why":"Longer deliberation does not change the underlying criteria for what counts as a reportable issue, so the model still lacks a definition of a real problem."},{"id":"d","text":"Move the review to a higher-tier model so its confidence judgments are better calibrated.","correct":false,"why":"The problem is the absence of explicit criteria, not model capability; a stronger model given the same vague instruction faces the same ambiguity."}],"explanation":"General instructions such as \"be conservative\" or \"only report high-confidence findings\" do not meaningfully reduce false positives, because they leave the definition of a real issue up to the model. Specific categorical criteria that spell out which issues to report and which to skip give the model something concrete to apply and are the recommended fix.","tags":["false-positives","explicit-criteria","confidence-filtering"]},{"id":"N-4.1-02","domain":"D4","task":"4.1","scenario":"S5","type":"single","select":1,"stem":"Your automated PR reviewer posts findings in four categories. Measured over 300 PRs, security findings are 94% accurate and logic-bug findings 90% accurate, while the \"naming and readability\" category is wrong 58% of the time. In a survey, 70% of developers say they now skim past all review comments, and two confirmed SQL injection findings were merged unaddressed last month. What is the most likely explanation for the security findings being ignored?","options":[{"id":"a","text":"The high false positive rate in the readability category has undermined developer trust in the entire report, including the accurate security and bug categories.","correct":true,"why":"The guide states that high false positive categories undermine confidence in accurate categories; once developers learn that findings are often wrong, they stop reading all of them."},{"id":"b","text":"Security findings are not marked with a distinct severity, so developers cannot tell them apart from readability suggestions.","correct":false,"why":"Severity labeling can help prioritization, but the survey indicates developers are not reading the comments at all, which is a trust problem rather than a labeling problem."},{"id":"c","text":"Security findings are phrased too technically for most developers to act on without additional context.","correct":false,"why":"Nothing in the data points to phrasing; the accurate categories were fine until developers stopped reading the report as a whole."},{"id":"d","text":"The reviewer produces too many findings per PR, and developers only read the first few comments.","correct":false,"why":"Volume is not the measured problem; the survey shows developers skipping all comments because they have learned the report contains unreliable findings."}],"explanation":"False positives do not stay contained within their own category. When one category is frequently wrong, developers learn to distrust the reviewer as a whole and begin ignoring accurate findings too, which is why a noisy low-stakes category can cause real security findings to be missed.","tags":["developer-trust","false-positives","review-categories"]},{"id":"N-4.1-03","domain":"D4","task":"4.1","scenario":"S5","type":"multi","select":2,"stem":"Your PR reviewer's \"potential performance issue\" category is wrong roughly 60% of the time; its other three categories are above 90% accurate. Developers have begun approving PRs without reading any of the review output. Your team lead wants trust restored within this sprint, and a proper rewrite of the performance prompt will take two more weeks. Which two actions align with the guidance for this situation? (Select TWO.)","options":[{"id":"a","text":"Temporarily disable the performance category so the report contains only the three reliable categories while the performance prompt is being rewritten.","correct":true,"why":"The guide recommends temporarily disabling high false-positive categories to restore developer trust while the prompts for those categories are improved."},{"id":"b","text":"Add \"only report performance issues when you are confident\" to the prompt as a stopgap until the rewrite is done.","correct":false,"why":"Confidence-based instructions do not meaningfully improve precision; the category would keep producing false positives and keep eroding trust."},{"id":"c","text":"Rewrite the performance category with explicit criteria that define which constructs to flag (for example, an unbounded query inside a loop) and which to skip.","correct":true,"why":"Replacing vague instructions with explicit categorical criteria is the durable fix for a high false-positive category."},{"id":"d","text":"Keep all four categories but add a banner to the report explaining that performance findings are experimental.","correct":false,"why":"The unreliable findings still appear alongside the good ones, so developers continue to encounter false positives and the trust problem persists."},{"id":"e","text":"Switch the reviewer to a larger model with a bigger context window so performance findings become more accurate.","correct":false,"why":"The performance category fails because its criteria are vague, not because of model capacity; a larger model given the same prompt has the same problem."},{"id":"f","text":"Require developers to acknowledge each finding with a click before the PR can be merged.","correct":false,"why":"Forcing interaction with unreliable findings increases friction and resentment; it does nothing to reduce the false positives that caused the trust loss."}],"explanation":"When one category's false positives are undermining trust in the whole report, the guide's approach is twofold: remove the unreliable category from the report immediately so developers can trust what remains, and fix that category's prompt with explicit criteria before re-enabling it. Confidence instructions and disclaimers leave the false positives in front of developers.","tags":["disable-category","developer-trust","explicit-criteria"]},{"id":"N-4.1-04","domain":"D4","task":"4.1","scenario":"S5","type":"single","select":1,"stem":"Your reviewer labels each finding critical, major, or minor, and the pipeline blocks merges on critical. Over the last month an unchecked null dereference in a request handler was labeled critical in one PR and minor in another, and a hard-coded test credential was labeled major once and minor twice. Developers now dispute about 30% of severity labels. The prompt currently says \"assign severity based on impact.\" What change would most improve classification consistency?","options":[{"id":"a","text":"Add a sentence asking the model to be consistent and to consider previous PRs when assigning severity.","correct":false,"why":"The model has no memory of previous PRs, and a general appeal to consistency leaves the definition of each level just as vague as before."},{"id":"b","text":"Reduce the scale to two levels, blocking and non-blocking, so there are fewer boundaries to get wrong.","correct":false,"why":"Fewer levels do not define where the boundary lies; the same null dereference could still land on either side depending on the run."},{"id":"c","text":"Run a second independent instance to re-rate every finding's severity and post the average of the two ratings.","correct":false,"why":"Averaging two runs of an undefined rubric produces a smoother but still arbitrary result and doubles the cost of every review."},{"id":"d","text":"Define explicit criteria for each severity level and include a concrete code example of a critical, a major, and a minor finding in the prompt.","correct":true,"why":"The guide's approach to consistent classification is explicit severity criteria with concrete code examples for each level, so the model can match new findings against defined anchors."}],"explanation":"Inconsistent severity assignment is a symptom of an undefined rubric. Defining explicit criteria for each severity level and anchoring each level with a concrete code example gives the model a reference point, which is what produces consistent classification across PRs.","tags":["severity-criteria","consistency","code-examples"]},{"id":"N-4.1-05","domain":"D4","task":"4.1","scenario":"S5","type":"single","select":1,"stem":"Your review prompt includes the line \"check that error handling is adequate.\" That category generates roughly a third of all findings, and developers dismiss 65% of them: most flag try/except blocks that intentionally ignore expected errors such as a missing optional config file. You want to keep catching the real problem, exceptions that are swallowed without any log entry or re-raise. What is the most effective prompt change?","options":[{"id":"a","text":"Replace the line with an explicit criterion: flag an except block only when it catches an exception and neither logs it, re-raises it, nor returns an explicit error value.","correct":true,"why":"This turns a vague quality judgment into an explicit, checkable criterion that describes the actual defect, which is the guide's recommended way to improve precision."},{"id":"b","text":"Keep the line but add \"be conservative and report only high-confidence error-handling findings.\"","correct":false,"why":"The guide notes that instructions like \"be conservative\" fail to improve precision because they never tell the model what a real finding looks like."},{"id":"c","text":"Ask the model to write a two-sentence justification for each error-handling finding so developers can triage faster.","correct":false,"why":"Justifications make each false positive longer to read; they do not change which blocks get flagged in the first place."},{"id":"d","text":"Move error-handling review into its own dedicated pass so the category gets more of the model's attention.","correct":false,"why":"Attention is not the issue; the model is applying a vague instruction, and a dedicated pass would apply the same vague instruction more thoroughly."}],"explanation":"Vague instructions such as \"check that X is adequate\" invite the model to flag anything that looks imperfect. Restating the category as an explicit criterion that names the specific behavior to flag, and by implication what not to flag, is the change that reduces false positives without losing genuine findings.","tags":["explicit-criteria","vague-instructions","error-handling"]},{"id":"N-4.1-06","domain":"D4","task":"4.1","scenario":"S5","type":"multi","select":3,"stem":"You are rewriting the criteria section of your CI code-review prompt from scratch. The current version says \"report problems you find in the diff\" and developers dismiss about 45% of findings, mostly stylistic nitpicks and objections to conventions the rest of the file already follows. Which three lines belong in the new criteria section according to the guidance on explicit review criteria? (Select THREE.)","options":[{"id":"a","text":"Report logic errors that produce incorrect results, such as an off-by-one loop bound or a comparison against the wrong variable.","correct":true,"why":"Explicit criteria name which issue types to report; bugs that produce incorrect behavior are a core reportable category."},{"id":"b","text":"Report only findings you are more than 70% confident about.","correct":false,"why":"This is confidence-based filtering, which the guide says fails to improve precision compared to categorical criteria."},{"id":"c","text":"Report security issues such as SQL built by string concatenation with user input or secrets committed in code.","correct":true,"why":"Security is explicitly named as a category to report, and concrete examples make the criterion actionable."},{"id":"d","text":"Do not report style or naming preferences, or patterns that are already used consistently elsewhere in the same file.","correct":true,"why":"Explicit criteria also define what to skip; minor style and local patterns are the guide's examples of issues to exclude."},{"id":"e","text":"Be conservative when reporting style issues.","correct":false,"why":"\"Be conservative\" is exactly the kind of general instruction the guide says does not reduce false positives; the style category should be excluded explicitly instead."},{"id":"f","text":"Report every finding and rely on severity labels so developers can filter out the minor ones themselves.","correct":false,"why":"Pushing all findings through and expecting developers to filter reproduces the false positive load that is eroding trust."}],"explanation":"Effective review criteria explicitly define both sides: the categories to report (bugs that produce incorrect behavior, security flaws) and the categories to skip (style preferences, patterns consistent within the file). Confidence thresholds and \"be conservative\" instructions leave the decision undefined and do not improve precision.","tags":["review-criteria","report-vs-skip","false-positives"]},{"id":"N-4.2-01","domain":"D4","task":"4.2","scenario":"S5","type":"single","select":1,"stem":"Your CI stage generates unit tests for changed functions. Coverage reports show the generated tests exercise the main path but skip the else branch of guard clauses and early-return error paths in about 40% of functions. The prompt already contains three paragraphs of instructions including \"cover every conditional branch, including error paths,\" but results remain inconsistent from run to run. What is the most effective change?","options":[{"id":"a","text":"Expand the instructions into a checklist that enumerates every kind of branch construct (if/else, early return, switch default, try/except) the tests must cover.","correct":false,"why":"The prompt already contains detailed instructions that are producing inconsistent results; adding more instruction text is the approach that has failed."},{"id":"b","text":"Add few-shot examples that show a function with an untested guard-clause branch alongside the specific test case that targets that branch.","correct":true,"why":"Few-shot examples demonstrating ambiguous-case handling, such as branch-level coverage gaps, are the guide's recommended technique when detailed instructions alone produce inconsistent output."},{"id":"c","text":"Raise max_tokens for the generation request so the model has room to write tests for every branch.","correct":false,"why":"The generated output is not being truncated; the model is choosing not to target the secondary branches, so a larger output budget changes nothing."},{"id":"d","text":"Run the coverage tool after generation and retry the request with the instruction \"improve coverage\" until the branch percentage exceeds 90%.","correct":false,"why":"Retrying with a general instruction does not show the model what a branch-level gap looks like, so each retry is as inconsistent as the first attempt."}],"explanation":"When detailed instructions already exist and output is still inconsistent, few-shot examples are the most effective lever. Examples that demonstrate the ambiguous case, here a branch-level coverage gap and the test that closes it, communicate the expected judgment more reliably than additional instruction text.","tags":["few-shot","test-generation","branch-coverage"]},{"id":"N-4.2-02","domain":"D4","task":"4.2","scenario":"S5","type":"single","select":1,"stem":"Your PR reviewer must choose between two actions for each finding: \"request changes,\" which blocks the merge, or \"comment,\" which does not. On borderline findings such as a missing input validation on an internal-only endpoint, it blocks the merge in some runs and merely comments in others. You have decided to add few-shot examples to settle this. How should the examples be constructed?","options":[{"id":"a","text":"Replace examples with a decision table in the prompt that maps each finding category and severity combination to an action.","correct":false,"why":"A lookup table is more instruction text, not few-shot; it cannot anticipate the borderline cases that fall between its rows."},{"id":"b","text":"Add one canonical example of a clear \"request changes\" case and one of a clear \"comment\" case so the model has an anchor for each action.","correct":false,"why":"Clear-cut cases are not where the inconsistency occurs; examples need to target the borderline scenarios and show why one action wins."},{"id":"c","text":"Add 15 to 20 examples covering every finding category the reviewer supports, each labeled with the correct action.","correct":false,"why":"Volume without reasoning teaches the model to pattern-match categories rather than exercise judgment, and it adds substantial token overhead."},{"id":"d","text":"Add 2 to 4 targeted examples of borderline findings, each showing the reasoning for why one action was chosen over the plausible alternative.","correct":true,"why":"The guide specifies 2-4 targeted examples for ambiguous scenarios that show the reasoning behind the choice, which is what lets the model generalize the judgment."}],"explanation":"For ambiguous decisions, the guide recommends a small number of targeted few-shot examples, 2 to 4, that focus on the borderline cases and make the reasoning explicit. Showing why one action was chosen over a plausible alternative is what enables consistent judgment on new borderline cases.","tags":["few-shot","ambiguous-cases","reasoning-examples"]},{"id":"N-4.2-03","domain":"D4","task":"4.2","scenario":"S5","type":"single","select":1,"stem":"To cut false positives, you propose adding three few-shot examples that each contrast an accepted repository pattern (such as an early-return guard clause that skips validation for internal callers) with a genuine defect that looks similar. A senior engineer objects that the codebase has at least 40 distinct accepted patterns, so three examples cannot possibly cover them, and proposes an exhaustive regex allowlist instead. How should you respond?","options":[{"id":"a","text":"Explain that well-chosen examples teach the model the judgment behind the distinction, so it generalizes to accepted patterns it has never seen rather than matching only the cases shown.","correct":true,"why":"The guide states that few-shot examples enable the model to generalize judgment to novel patterns instead of matching only pre-specified cases."},{"id":"b","text":"Compromise by adding one example for each of the 40 patterns so coverage is complete.","correct":false,"why":"Forty examples add heavy token overhead and still only cover known patterns; the value of few-shot comes from a few targeted examples that convey reasoning."},{"id":"c","text":"Drop the examples and instead instruct the model to \"use engineering judgment about whether a pattern is intentional.\"","correct":false,"why":"A general instruction gives the model nothing concrete to calibrate against, which is the vagueness that produced the false positives in the first place."},{"id":"d","text":"Agree, and build the regex allowlist so every accepted pattern is suppressed deterministically before findings are posted.","correct":false,"why":"A pattern allowlist only matches what was pre-specified and must be maintained forever; it cannot handle a new variation the model has not been told about."}],"explanation":"The point of few-shot examples is not coverage of every case but demonstration of the judgment involved. A few examples that contrast acceptable patterns with genuine issues let the model generalize that distinction to patterns it has not seen, which a static allowlist cannot do.","tags":["few-shot","generalization","false-positives"]},{"id":"N-4.2-04","domain":"D4","task":"4.2","scenario":"S5","type":"multi","select":2,"stem":"Your PR review output has two separate problems. First, about 30% of findings flag repository conventions the team accepts, such as re-exporting modules through an index file. Second, findings arrive in inconsistent shapes: some as paragraphs with no file reference, some as bullet lists without a severity, so the script that posts inline comments fails on roughly one in five. Detailed formatting instructions are already in the prompt. Which two additions to the prompt address these problems? (Select TWO.)","options":[{"id":"a","text":"A few-shot example that shows an accepted convention left unflagged next to a genuinely defective variant that is flagged, with the reasoning for the difference.","correct":true,"why":"Examples that distinguish acceptable code patterns from genuine issues reduce false positives while letting the model generalize the distinction."},{"id":"b","text":"An instruction to \"report only high-confidence findings and skip anything that might be a convention.\"","correct":false,"why":"Confidence-based instructions do not improve precision; the model still has no concrete picture of which conventions are accepted."},{"id":"c","text":"A few-shot example that demonstrates the exact output shape for a finding: file and line location, the issue, a severity label, and a suggested fix.","correct":true,"why":"Few-shot examples demonstrating the specific desired output format are the guide's technique for achieving consistency when instructions alone have failed."},{"id":"d","text":"Twenty examples, one for each accepted convention in the repository, each labeled \"do not flag.\"","correct":false,"why":"A long list of labeled cases invites pattern matching and adds token overhead; a few contrasting examples with reasoning generalize better."},{"id":"e","text":"A second instruction block repeating the required output fields in a numbered list with stronger wording.","correct":false,"why":"Detailed formatting instructions are already present and producing inconsistent results; restating them is the approach that has not worked."},{"id":"f","text":"A request to switch to a model with a larger context window so the whole style guide can be included.","correct":false,"why":"Neither the false positives nor the format drift is caused by context limits; more reference material does not demonstrate the desired output."}],"explanation":"Both problems are solved with few-shot examples rather than more instruction text. A contrasting example (accepted pattern versus genuine issue, with reasoning) reduces false positives while preserving generalization, and an example of the exact finding format (location, issue, severity, suggested fix) produces consistent, machine-postable output.","tags":["few-shot","output-format","acceptable-patterns"]},{"id":"N-4.2-05","domain":"D4","task":"4.2","scenario":"S6","type":"single","select":1,"stem":"Your extraction system processes supplier delivery notes into a quantity and unit per line item. Many notes use informal measurements such as \"about a dozen pallets,\" \"roughly two tons,\" or \"a half-day of labor.\" The model converts these into exact-looking values (12, 2000 kg, 4 hours) with no indication they were approximate, and in 8% of cases invents a unit that the note never stated. Which change most directly addresses this hallucination?","options":[{"id":"a","text":"Make quantity a required numeric field with a minimum of zero so the schema rejects non-numeric values.","correct":false,"why":"A stricter numeric constraint pushes the model harder toward inventing a precise number; it does not teach how informal measurements should be represented."},{"id":"b","text":"Add a retry loop that resubmits the note with the validation error whenever a unit fails schema validation.","correct":false,"why":"The fabricated units pass schema validation, and retry-with-feedback corrects format errors rather than teaching how to handle approximate language."},{"id":"c","text":"Add few-shot examples showing informal measurements extracted correctly, for instance \"about a dozen pallets\" recorded as an approximate quantity with the stated unit and no invented precision.","correct":true,"why":"The guide names few-shot examples as effective for reducing hallucination in extraction tasks, specifically including the handling of informal measurements."},{"id":"d","text":"Add the instruction \"never guess; do not add units that are not in the document\" to the system prompt.","correct":false,"why":"A general prohibition does not show the model what correct handling of an informal measurement looks like, so behavior stays inconsistent."}],"explanation":"Hallucination in extraction, such as inventing precision or units for informal measurements, is reduced most effectively by few-shot examples that demonstrate the correct representation. Examples show the model concretely what to do with approximate language, which prohibitions and tighter schemas cannot.","tags":["few-shot","hallucination","informal-measurements"]},{"id":"N-4.2-06","domain":"D4","task":"4.2","scenario":"S6","type":"multi","select":2,"stem":"Your research-paper extraction pipeline requires a methodology field and a cited_works list. Validation shows methodology comes back null on 27% of papers, and cited_works is empty on 19%. Manual inspection finds the information is present in every failing paper: the null methodology cases describe their methods inside the Results section instead of a dedicated Methodology section, and the empty cited_works cases use inline citations rather than a bibliography block. Which two prompt changes address these failures? (Select TWO.)","options":[{"id":"a","text":"Make methodology and cited_works nullable so the pipeline stops failing validation on those papers.","correct":false,"why":"Nullable fields are for information that genuinely may be absent; here the information exists, so nullability would silently accept incomplete extractions."},{"id":"b","text":"Add a few-shot example of a paper whose methods are described inside the Results section, with the methodology field correctly populated from that embedded text.","correct":true,"why":"Few-shot examples demonstrating varied document structures, such as methodology sections versus embedded details, are the guide's fix for null extraction of present fields."},{"id":"c","text":"Add a retry that resubmits the paper with the message \"methodology must not be null\" appended.","correct":false,"why":"A retry with a bare error does not show the model where methodology lives in a differently structured paper, so the same miss recurs."},{"id":"d","text":"Add a few-shot example that shows citations gathered from inline references in the body text, alongside one gathered from a bibliography block, both producing the same cited_works structure.","correct":true,"why":"Examples covering inline citations versus bibliographies demonstrate correct handling of structural variety and address empty extraction of a required field."},{"id":"e","text":"Raise max_tokens so the model can read further into long papers before answering.","correct":false,"why":"max_tokens limits output length, not how much of the input is read; the failures are about document structure, not truncation."},{"id":"f","text":"Set tool_choice to \"any\" so the extraction tool is always called.","correct":false,"why":"The tool is already being called; the fields are null or empty inside a valid tool call, which tool_choice cannot change."}],"explanation":"When required fields come back empty even though the source contains the information, the usual cause is structural variety the model was not shown. Few-shot examples covering each variant, methodology embedded in results and citations given inline rather than in a bibliography, teach the model where to look, whereas nullability or retries would mask or repeat the failure.","tags":["few-shot","document-structure","null-fields"]},{"id":"N-4.3-01","domain":"D4","task":"4.3","scenario":"S6","type":"single","select":1,"stem":"Your invoice pipeline currently instructs the model to \"respond only with JSON matching this schema\" and parses the text reply. About 2.4% of responses fail to parse because of trailing commas, unescaped quotes inside vendor names, or a sentence of commentary before the JSON. You are moving the pipeline to tool use. Which implementation correctly applies the approach?","options":[{"id":"a","text":"Define an extract_invoice tool whose input_schema is the target schema, and then parse the JSON from the text content block the model writes after calling the tool.","correct":false,"why":"The structured data lives in the tool_use block's input, not in a subsequent text block; parsing text reintroduces the syntax failures tool use is meant to eliminate."},{"id":"b","text":"Define an extract_invoice tool whose input_schema is the target schema, and read the structured object directly from the input of the tool_use content block in the response.","correct":true,"why":"This is the guide's pattern: the extraction schema is the tool's input parameters, and the schema-compliant data is taken from the tool_use response, eliminating JSON syntax errors."},{"id":"c","text":"Keep the JSON-in-text prompt but validate the reply with Pydantic and retry up to three times on parse failure.","correct":false,"why":"Retrying reduces the failure count but does not eliminate the class of syntax failures; tool use guarantees schema-compliant structure without a retry."},{"id":"d","text":"Wrap the schema in a fenced code block in the prompt and set tool_choice to \"auto\" so the model may either reply in text or call a tool.","correct":false,"why":"With \"auto\" the model may still answer in free text, and the fenced schema does nothing to constrain the output structure."}],"explanation":"Tool use with a JSON schema is the most reliable route to schema-compliant structured output. The extraction schema becomes the tool's input_schema, and the pipeline reads the structured data from the tool_use content block's input, which removes the JSON syntax failures that come from parsing free-form text.","tags":["tool-use","json-schema","structured-output"]},{"id":"N-4.3-02","domain":"D4","task":"4.3","scenario":"S6","type":"single","select":1,"stem":"Your contract extraction service defines a single extract_contract tool and sends each document with tool_choice set to \"auto\". In production, about 6% of responses contain no tool_use block at all; instead the model returns a text message such as \"This document appears to be a cover letter rather than a contract.\" The downstream code assumes a tool call and crashes on these responses. What is the most likely cause?","options":[{"id":"a","text":"The documents exceed the model's context window, so the tool definitions are dropped from the request.","correct":false,"why":"Oversized requests fail with an error rather than silently discarding tools, and the text responses show the model read the document."},{"id":"b","text":"The tool's input_schema has too many required fields, so the model gives up and explains instead of calling the tool.","correct":false,"why":"Required fields influence what the model puts in the call, not whether it calls the tool; the behavior here is governed by tool_choice."},{"id":"c","text":"max_tokens is too low for these documents, so the response is cut off before the tool call is generated.","correct":false,"why":"A truncated response would not contain a complete, well-formed explanation; the model is deliberately choosing to reply in text."},{"id":"d","text":"With tool_choice \"auto\" the model may return text instead of calling a tool, so it does exactly that whenever a document does not look like a contract.","correct":true,"why":"The guide defines \"auto\" as allowing the model to respond with text rather than a tool call; guaranteeing a call requires \"any\" or a forced tool selection."}],"explanation":"tool_choice \"auto\" leaves the model free to answer in plain text when it judges that no tool applies. A pipeline that needs a structured response every time must use \"any\", which requires some tool call, or force a specific tool by name.","tags":["tool-choice","auto","structured-output"]},{"id":"N-4.3-03","domain":"D4","task":"4.3","scenario":"S6","type":"single","select":1,"stem":"Your pipeline gives the model three tools on the first request for each document: extract_metadata, enrich_vendor, and classify_risk. The design requires extract_metadata to run first because the two enrichment tools consume its output. Logs show that on about 9% of documents the model calls enrich_vendor first with guessed vendor details, producing incorrect enrichment. The system prompt already says \"always call extract_metadata first.\" What configuration change most directly enforces the required order?","options":[{"id":"a","text":"Set tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} on the first request so that specific tool must be called before any enrichment step.","correct":true,"why":"Forced tool selection requires the model to call the named tool, which is the guide's mechanism for ensuring a particular extraction runs before enrichment."},{"id":"b","text":"List extract_metadata first in the tools array so the model treats it as the default choice.","correct":false,"why":"Tool ordering in the request is not an enforcement mechanism; the model remains free to call any listed tool."},{"id":"c","text":"Add few-shot examples of correct call sequences to the system prompt to reinforce the ordering instruction.","correct":false,"why":"Examples raise the probability of compliance but cannot guarantee it, whereas forced tool selection makes the first call deterministic."},{"id":"d","text":"Set tool_choice to \"any\" on the first request so the model is required to make a tool call before responding.","correct":false,"why":"\"any\" guarantees some tool is called but lets the model choose which one, so enrich_vendor can still be selected first."}],"explanation":"When a specific extraction must happen before other tools run, forcing that tool with tool_choice {\"type\": \"tool\", \"name\": \"extract_metadata\"} guarantees it on the first request. \"any\" only guarantees that some tool is called, and prompt instructions or tool ordering are probabilistic.","tags":["tool-choice","forced-tool","extraction-order"]},{"id":"N-4.3-04","domain":"D4","task":"4.3","scenario":"S6","type":"single","select":1,"stem":"After migrating invoice extraction to tool use with a strict JSON schema, parse failures dropped to zero. Downstream reconciliation now reports a different problem on 4% of invoices: the tax amount appears in the shipping_fee field, or the line_items amounts do not add up to the total field, even though every response validates against the schema. A teammate proposes tightening the schema further with additionalProperties false and numeric ranges on every field. How should you evaluate the proposal?","options":[{"id":"a","text":"Support it, but also force the tool with tool_choice so the model cannot skip the schema.","correct":false,"why":"The tool is already being called on every document; forcing it changes nothing about the correctness of the values inside the call."},{"id":"b","text":"Reject it and move to a higher-tier model, since a more capable model will not confuse tax with shipping.","correct":false,"why":"Model capability may reduce the rate but leaves the pipeline with no way to detect the semantic errors that still occur; validation is the systematic fix."},{"id":"c","text":"Support it; a sufficiently strict schema constrains the values enough that misplaced amounts and sum mismatches cannot occur.","correct":false,"why":"A schema validates structure and types; it cannot know that a number belongs in tax rather than shipping_fee or that line items must sum to the total."},{"id":"d","text":"Reject it; the remaining failures are semantic errors that strict schemas cannot prevent, so the fix is semantic validation of the extracted values with a retry loop.","correct":true,"why":"The guide states that strict schemas via tool use eliminate syntax errors but not semantic errors such as items that do not sum to the total or values in the wrong field."}],"explanation":"Tool use with a strict schema guarantees well-formed, schema-compliant output, but it does not check meaning. Values placed in the wrong field or line items that fail to sum are semantic errors, which require validation logic on the extracted values and a feedback loop rather than a tighter schema.","tags":["semantic-errors","strict-schema","validation"]},{"id":"N-4.3-05","domain":"D4","task":"4.3","scenario":"S6","type":"multi","select":3,"stem":"You are designing the JSON schema for a contract extraction tool. Review of a 500-document sample shows: 22% of contracts state no termination_date and the model has been inventing dates for them; contract_type has six known values but about 5% of documents are types you have never seen; and in roughly 3% of documents the governing_law clause is ambiguous between two jurisdictions. Which three schema design choices address these observations? (Select THREE.)","options":[{"id":"a","text":"Keep termination_date required but add a field description saying \"use your best estimate if not stated.\"","correct":false,"why":"A required field with an estimate instruction still forces the model to produce a value, which is precisely how the invented dates arise."},{"id":"b","text":"Make termination_date optional (nullable) so the model can legitimately return null when the contract does not state one.","correct":true,"why":"Designing fields as nullable when the source may lack the information prevents the model from fabricating values to satisfy a required field."},{"id":"c","text":"Give contract_type an \"other\" enum value paired with a free-text detail field for the specific type observed.","correct":true,"why":"The \"other\" plus detail string pattern is the guide's design for extensible categorization when new categories appear."},{"id":"d","text":"Replace the contract_type enum with an unconstrained string so any document type can be recorded.","correct":false,"why":"Dropping the enum loses the consistency of known categories and produces spelling variants that downstream systems cannot group."},{"id":"e","text":"Add an \"unclear\" enum value to governing_law for cases where the clause does not resolve to a single jurisdiction.","correct":true,"why":"The guide recommends enum values like \"unclear\" for ambiguous cases so the model is not forced to pick one arbitrarily."},{"id":"f","text":"Set tool_choice to \"any\" so the model must always call the extraction tool.","correct":false,"why":"tool_choice governs whether a tool is called, not how missing, novel, or ambiguous values are represented within the schema."}],"explanation":"Schema design handles three distinct situations: information that may be absent belongs in optional (nullable) fields so nothing is fabricated; categories that keep growing use an enum with an \"other\" value plus a detail string; and genuinely ambiguous cases get an explicit \"unclear\" value instead of a forced choice.","tags":["schema-design","nullable","enum-other","unclear"]},{"id":"N-4.3-06","domain":"D4","task":"4.3","scenario":"S6","type":"multi","select":2,"stem":"Your intake queue mixes invoices, receipts, and bank statements with no reliable way to know the type before processing, and you have a separate extraction tool with its own schema for each. Source documents write dates as 03/04/2024, 4 March 2024, or 2024-03-04, and amounts as \"USD 1,200.00\", \"$1200\", or \"1.200,00\". Your schemas require ISO 8601 dates and plain numeric amounts. Which two configuration choices give you guaranteed structured output that downstream systems can consume? (Select TWO.)","options":[{"id":"a","text":"Set tool_choice to \"any\" so the model must call one of the three extraction tools and selects the one matching the document.","correct":true,"why":"The guide prescribes \"any\" when multiple extraction schemas exist and the document type is unknown: structured output is guaranteed and the model picks the fitting tool."},{"id":"b","text":"Set tool_choice to \"auto\" and add \"you must always call a tool\" to the system prompt.","correct":false,"why":"\"auto\" permits a text-only reply regardless of prompt wording, so structured output is not guaranteed."},{"id":"c","text":"Include explicit format normalization rules in the prompt, such as converting all dates to ISO 8601 and stripping currency symbols and thousands separators from amounts, alongside the strict schemas.","correct":true,"why":"The guide recommends pairing strict output schemas with normalization rules in the prompt to handle inconsistent source formatting."},{"id":"d","text":"Force the extract_invoice tool by name, since invoices make up about 70% of the volume.","correct":false,"why":"Forcing one tool sends every receipt and statement through the wrong schema; forced selection is for when a specific tool must run."},{"id":"e","text":"Change every date and amount field in the schemas to an unconstrained string so any source format passes validation.","correct":false,"why":"Loosening the schema pushes the formatting problem onto downstream systems and abandons the consistency that structured output is meant to provide."}],"explanation":"Two independent mechanisms are needed. tool_choice \"any\" guarantees a tool call while letting the model choose the schema that fits an unknown document type. Format normalization rules in the prompt, combined with the strict schema, get inconsistent source dates and amounts into the canonical form downstream systems require.","tags":["tool-choice","any","format-normalization"]},{"id":"N-4.3-07","domain":"D4","task":"4.3","scenario":"S6","type":"single","select":1,"stem":"Your invoice schema marks payment_terms as a required string. An audit of 400 processed invoices finds that 18% of the source documents never mention payment terms at all, yet the extracted records for those invoices contain values such as \"Net 30\" or \"Due on receipt.\" Accounts payable has begun paying some of these invoices on invented schedules. Which schema change most directly addresses the fabrication?","options":[{"id":"a","text":"Add a regular expression pattern to payment_terms so only recognized term formats are accepted.","correct":false,"why":"\"Net 30\" already matches any reasonable pattern; a format constraint does nothing to stop the model from producing a plausible value that the document never stated."},{"id":"b","text":"Add a confidence_score field beside payment_terms and discard values below 0.7.","correct":false,"why":"This filters after the fact and depends on calibrated confidence; the schema still requires a value, so the model still fabricates one."},{"id":"c","text":"Make payment_terms optional (nullable) so the model can return null when the invoice does not state terms.","correct":true,"why":"The guide's remedy for fabricated values is to design the field as optional when the source may lack the information, removing the pressure to fill a required field."},{"id":"d","text":"Keep the field required and add \"do not guess payment terms\" to the field's description.","correct":false,"why":"A required field must still be populated to satisfy the schema, so the instruction conflicts with the structural requirement and fabrication continues."}],"explanation":"A required field tells the model that a value must exist, and when the document has none, the model satisfies the schema by inventing one. Making the field nullable removes that pressure and lets the extraction honestly report that the information is absent.","tags":["nullable","fabrication","required-fields"]},{"id":"N-4.4-01","domain":"D4","task":"4.4","scenario":"S6","type":"single","select":1,"stem":"Your extraction pipeline validates each tool_use result with Pydantic. When validation fails, the current retry logic resends the document with the note \"Your previous extraction was invalid; please try again.\" Only 55% of retries succeed, and the failures are mostly format problems such as dates in the wrong format or a currency amount returned as a string with a symbol. What change to the retry request would most improve the success rate?","options":[{"id":"a","text":"Route every failed document straight to a higher-tier model on the retry.","correct":false,"why":"A stronger model given the same uninformative retry message still has to guess what was wrong; the missing ingredient is the specific error feedback."},{"id":"b","text":"Resend only the validation error messages, without the document, so the model focuses on the correction.","correct":false,"why":"Without the original document the model cannot re-extract the correct value; it can only guess at what the field should contain."},{"id":"c","text":"Resend the document three times in a row and accept the first result that validates.","correct":false,"why":"Repeating the same request without feedback leaves the model with no information about what went wrong, so the failure rate stays similar on each attempt."},{"id":"d","text":"Include in the follow-up request the original document, the failed extraction, and the specific validation errors, so the model can correct exactly what failed.","correct":true,"why":"This is the guide's retry-with-error-feedback pattern: document plus failed output plus specific errors gives the model everything it needs for self-correction."}],"explanation":"Retry-with-error-feedback works because the follow-up request contains the original document, the failed extraction, and the specific validation errors. Format mismatches and structural errors are exactly the class of failure this corrects, and a retry without that feedback gives the model nothing to act on.","tags":["retry","error-feedback","validation"]},{"id":"N-4.4-02","domain":"D4","task":"4.4","scenario":"S6","type":"multi","select":2,"stem":"Your contract pipeline logs every validation failure and the retry outcome. You are triaging four recurring failure types to decide which should stay in the automatic retry-with-feedback loop and which should be routed elsewhere. Which two failures are the ones a retry that includes the document, the failed extraction, and the validation error is likely to fix? (Select TWO.)","options":[{"id":"a","text":"effective_date returned as \"March 4, 2024\" when the schema requires an ISO 8601 date string.","correct":true,"why":"This is a format mismatch; the information is present and the error message tells the model exactly how to reformat it."},{"id":"b","text":"contract_value returned as null because the value is stated only in a pricing appendix that is not part of the request.","correct":false,"why":"Retries cannot recover information that is absent from the provided source; the fix is to supply the appendix, not to retry."},{"id":"c","text":"parties returned as a single comma-separated string when the schema requires an array of objects with name and role.","correct":true,"why":"This is a structural output error; with the error and the document in the retry, the model can restructure the same information correctly."},{"id":"d","text":"signatory_title returned as null because the cover letter in the request never mentions any titles.","correct":false,"why":"The information is genuinely absent from the source, so no number of retries can produce it; the field should be nullable or the missing pages supplied."},{"id":"e","text":"governing_law returned as null because the contract's governing-law clause references \"the jurisdiction specified in the master agreement,\" which was not provided.","correct":false,"why":"The value exists only in an external document not included in the request, which is the guide's example of a retry that will not succeed."}],"explanation":"Retry-with-feedback succeeds on format mismatches and structural output errors, because the correct information is in the document and the error tells the model how to fix its representation. It fails when the required information is absent from the provided source, such as a value that lives only in an appendix or master agreement that was not sent.","tags":["retry-limits","absent-information","format-mismatch"]},{"id":"N-4.4-03","domain":"D4","task":"4.4","scenario":"S5","type":"single","select":1,"stem":"Developers dismiss about 40% of the findings your CI reviewer posts, using a \"not an issue\" button. Each finding is stored as a structured object with file, line, severity, and description. When you try to analyze the dismissals to improve the prompt, you cannot group them meaningfully: the free-text descriptions vary too much to tell which kinds of code the reviewer is misjudging. What is the best first step to enable systematic analysis?","options":[{"id":"a","text":"Add a detected_pattern field to each finding that names the code construct that triggered it, such as \"unchecked-optional-access\" or \"broad-except.\"","correct":true,"why":"The guide's feedback-loop design tracks which code constructs trigger findings via a detected_pattern field so dismissals can be grouped and false positive patterns identified."},{"id":"b","text":"Log the full prompt and model response for each finding so analysts can reconstruct the reasoning later.","correct":false,"why":"Raw transcripts preserve detail but still lack a categorical key to group dismissals by, so the analysis remains manual."},{"id":"c","text":"Run a second independent instance on each dismissed finding to decide whether the dismissal was justified.","correct":false,"why":"This adds cost and a second opinion but still does not tell you which constructs are systematically misjudged."},{"id":"d","text":"Require developers to type a short reason whenever they dismiss a finding.","correct":false,"why":"Free-text reasons are as hard to aggregate as the descriptions, and adding friction to dismissal further erodes goodwill."}],"explanation":"To learn from dismissals, each finding needs a categorical field that records what pattern in the code triggered it. A detected_pattern field lets you aggregate dismissals by construct, see which patterns are producing false positives, and target prompt improvements at them.","tags":["detected-pattern","feedback-loop","dismissal-analysis"]},{"id":"N-4.4-04","domain":"D4","task":"4.4","scenario":"S6","type":"multi","select":2,"stem":"Your purchase-order extraction feeds an ERP system. Two problems have surfaced. In some orders the stated total on the document does not equal the sum of the line items, and the ERP silently ingests the stated figure. In other orders the quantity in the item table says 500 while the narrative paragraph says 5,000, and the model picks one without any indication that the document disagrees with itself. Which two extraction design changes surface these problems to downstream systems? (Select TWO.)","options":[{"id":"a","text":"Extract a calculated_total computed from the line items alongside the stated_total, and flag orders where the two differ.","correct":true,"why":"The guide's self-correction flow extracts calculated_total with stated_total so discrepancies become a visible field rather than a silent ingestion."},{"id":"b","text":"Instruct the model to correct the total to match the line items whenever they disagree.","correct":false,"why":"Silently altering a source value hides the discrepancy and may propagate the wrong figure if the line items rather than the total are in error."},{"id":"c","text":"Add a conflict_detected boolean that the model sets when the document gives inconsistent values for the same fact, with both values captured.","correct":true,"why":"A conflict_detected flag is the guide's design for inconsistent source data, letting downstream systems route the order for review instead of trusting an arbitrary pick."},{"id":"d","text":"Make the quantity and total fields nullable so the model can leave them empty when unsure.","correct":false,"why":"Nullable fields are for absent information; here the information is present but inconsistent, and a null hides the conflict just as an arbitrary choice does."},{"id":"e","text":"Add a retry-with-feedback loop that resubmits the order whenever the stated total and line items disagree.","correct":false,"why":"The disagreement is in the source document itself, not in the extraction, so a retry re-extracts the same conflicting values."},{"id":"f","text":"Enable JSON schema strict mode on the extraction tool so invalid totals are rejected.","correct":false,"why":"Strict schemas eliminate syntax errors; they cannot evaluate whether numbers sum correctly or whether two parts of a document agree."}],"explanation":"Semantic inconsistencies in the source need to be surfaced rather than silently resolved. Extracting calculated_total next to stated_total exposes arithmetic discrepancies, and a conflict_detected boolean with both values captured exposes internal contradictions, so downstream systems can route the document for review.","tags":["calculated-total","conflict-detected","semantic-validation"]},{"id":"N-4.4-05","domain":"D4","task":"4.4","scenario":"S6","type":"single","select":1,"stem":"After moving invoice extraction to tool use, your validation failure rate fell from 5% to 2%. The remaining 2% are all of two kinds: line item amounts that do not add up to the total, and the discount amount appearing in the tax field. Your validation layer currently consists only of the JSON schema attached to the tool. Which addition to the pipeline is needed to catch these remaining failures and feed them into your retry loop?","options":[{"id":"a","text":"Enable strict mode on the tool's JSON schema so the model cannot emit values that violate the field definitions.","correct":false,"why":"Strict schema enforcement is already what eliminated the syntax failures; the remaining errors are valid per the schema and invisible to it."},{"id":"b","text":"Semantic validation of the extracted values, such as Pydantic validators that check the line items sum to the total and that cross-field relationships hold, with failures fed back on retry.","correct":true,"why":"Sum mismatches and misplaced values are semantic errors; catching them requires validators that reason about the values themselves, and those specific errors are what the retry loop needs as feedback."},{"id":"c","text":"Force the extraction tool with tool_choice so every response goes through the schema.","correct":false,"why":"Every response already goes through the schema; the failures are semantic, and forcing the tool does not add any check on the values."},{"id":"d","text":"A regular expression pass over the raw response text to detect malformed numbers before parsing.","correct":false,"why":"Tool use already guarantees well-formed numbers; the problem is which field the numbers are in and whether they sum, which a regex cannot judge."}],"explanation":"Tool use with a JSON schema removes syntax errors, but semantic errors such as line items that do not sum to the total or a value placed in the wrong field pass schema validation untouched. Catching them requires a separate semantic validation layer, for example Pydantic validators over the extracted values, whose specific errors then drive the retry-with-feedback loop.","tags":["semantic-validation","pydantic","syntax-vs-semantic"]},{"id":"N-4.4-06","domain":"D4","task":"4.4","scenario":"S6","type":"single","select":1,"stem":"Your lease extraction pipeline retries up to three times with the document, the failed output, and the validation error. After three retries, 12% of leases still fail on the required renewal_terms field. Reviewing the failures, you find every one of them is a lease whose renewal terms are defined in a separate rider referenced as \"Schedule B,\" and Schedule B is not included in the request. What is the best first step?","options":[{"id":"a","text":"Raise the retry limit to five and make the error message more emphatic about the field being required.","correct":false,"why":"The information is absent from the request, so additional retries with stronger wording cannot produce it and only add cost."},{"id":"b","text":"Stop retrying these documents and instead include Schedule B in the request or, where it is unavailable, allow renewal_terms to be null and route the lease for review.","correct":true,"why":"The guide identifies retries as ineffective when the information exists only in an external document not provided; the remedy is to supply the source or accept absence explicitly."},{"id":"c","text":"Switch the retry to a higher-tier model that is better at inferring terms from context.","correct":false,"why":"No model can extract a value the request does not contain; inference here would simply be fabrication."},{"id":"d","text":"Add few-shot examples showing renewal terms extracted from leases with varied structures.","correct":false,"why":"Few-shot helps when the information is present but structured differently; here the terms are not in the document at all."}],"explanation":"Retry-with-feedback corrects format and structural mistakes, not missing inputs. When the required information lives in a document that was never provided, the effective response is to supply that document or to make the field nullable and route the case for human handling, rather than to keep retrying.","tags":["retry-limits","absent-information","external-document"]},{"id":"N-4.5-01","domain":"D4","task":"4.5","scenario":"S6","type":"single","select":1,"stem":"Your contract extraction service receives documents continuously throughout the day. The customer SLA requires every document to be fully processed within 30 hours of arrival. You want to use the Message Batches API for the 50% cost savings, and you know a batch can take up to 24 hours to complete. How often should you submit batches to guarantee the SLA?","options":[{"id":"a","text":"Once daily at midnight, since a 24-hour processing window fits inside a 30-hour SLA.","correct":false,"why":"A document arriving just after midnight waits nearly 24 hours to be submitted and then up to 24 more to process, roughly 48 hours in the worst case."},{"id":"b","text":"Every 12 hours, so no document waits more than half a day before submission.","correct":false,"why":"Worst case is 12 hours of waiting plus 24 hours of processing, or 36 hours, which breaches the 30-hour SLA."},{"id":"c","text":"Once daily, with a request for priority processing on the batch so it completes within six hours.","correct":false,"why":"The Batches API has no guaranteed latency SLA and no priority tier; you must plan around the full 24-hour window."},{"id":"d","text":"Every 4 hours, so the worst case of 4 hours waiting plus 24 hours processing stays within 30 hours.","correct":true,"why":"This matches the guide's calculation: 4-hour submission windows plus the 24-hour batch window guarantee a 30-hour SLA with margin."}],"explanation":"Batch submission frequency is derived from the SLA minus the maximum batch processing time. With a 24-hour processing window and a 30-hour SLA, submitting every 4 hours bounds the worst case at 28 hours; longer submission intervals push the worst case past the SLA, and no priority tier exists to shorten batch latency.","tags":["batch-api","sla","submission-frequency"]},{"id":"N-4.5-02","domain":"D4","task":"4.5","scenario":"S5","type":"single","select":1,"stem":"You moved nightly test generation to the Message Batches API. Each request gives the model a read_file tool so it can fetch the modules a target function imports before writing tests. The batch completes, but most results end with stop_reason \"tool_use\" and a read_file call and contain no generated tests. The same requests work correctly through the synchronous API. What is the most likely cause?","options":[{"id":"a","text":"max_tokens is too low for the batch requests, so generation stops right after the tool call.","correct":false,"why":"A stop_reason of \"tool_use\" indicates the model paused for a tool result, not that it ran out of output tokens."},{"id":"b","text":"Batch requests need tool_choice set to \"any\" for tools to function; without it the call is ignored.","correct":false,"why":"The tool call was made, so tool selection is not the problem; the issue is that nothing can answer the call inside a batch."},{"id":"c","text":"The batch API does not support multi-turn tool calling within a single request, so the tool call cannot be executed and returned mid-request.","correct":true,"why":"The guide states this limitation directly: a batch request cannot execute tools mid-request and feed results back, so the request ends at the first tool call."},{"id":"d","text":"The custom_id values collided, so the tool results were attached to the wrong requests.","correct":false,"why":"custom_id correlates requests with responses; it has nothing to do with executing tools during processing."}],"explanation":"The Message Batches API processes each request as a single model turn. If the model decides to call a tool, there is no mechanism to run the tool and return its result within that request, so the response ends at the tool call. Workloads that need tool results must gather them before submission or use the synchronous API.","tags":["batch-api","tool-calling","limitations"]},{"id":"N-4.5-03","domain":"D4","task":"4.5","scenario":"S5","type":"multi","select":2,"stem":"Your platform team runs four Claude-powered workflows and wants to move as many as possible to the Message Batches API to capture the 50% cost savings: a security gate that must pass before a PR can be merged; a weekly audit of dependency licenses across all repositories; a nightly job that generates tests for modules added that day; and an interactive assistant that answers reviewer questions in PR comment threads. Which two workflows are appropriate for batch processing? (Select TWO.)","options":[{"id":"a","text":"The pre-merge security gate, because batches often complete within an hour in practice.","correct":false,"why":"Typical completion times are not a guarantee; the Batches API has no latency SLA, and a blocking pre-merge check cannot wait up to 24 hours."},{"id":"b","text":"The weekly dependency license audit.","correct":true,"why":"A weekly audit is non-blocking and latency-tolerant; a result that arrives within 24 hours is entirely acceptable."},{"id":"c","text":"The interactive PR comment assistant.","correct":false,"why":"Reviewers are waiting for a reply in the thread, so this is a blocking, latency-sensitive workflow unsuited to a 24-hour window."},{"id":"d","text":"The nightly test generation job for newly added modules.","correct":true,"why":"Nightly test generation is explicitly cited by the guide as a latency-tolerant workload appropriate for batch processing."},{"id":"e","text":"The pre-merge security gate, provided it falls back to the synchronous API when the batch has not returned within 30 minutes.","correct":false,"why":"A fallback adds complexity and still pays for the batch; the workflow is blocking by nature and belongs on the synchronous API from the start."}],"explanation":"Batch processing suits non-blocking, latency-tolerant jobs such as weekly audits and nightly test generation, where a result within 24 hours is fine. Blocking workflows, whether a pre-merge gate or an interactive assistant, need the synchronous API because the Batches API offers no guaranteed latency.","tags":["batch-api","workflow-selection","latency"]},{"id":"N-4.5-04","domain":"D4","task":"4.5","scenario":"S6","type":"single","select":1,"stem":"You submitted a batch of 1,000 invoices for extraction, each request tagged with a custom_id equal to the invoice number. When the batch completes, 962 succeeded, 30 failed with errors indicating the request exceeded the context length, and 8 failed with transient server errors. The 962 results have already been loaded into the finance system. What is the most efficient way to complete the job?","options":[{"id":"a","text":"Resubmit the entire 1,000-invoice batch so the results arrive as one consistent set.","correct":false,"why":"Reprocessing 962 successful invoices doubles the cost and time for no benefit; the custom_id already identifies which ones need work."},{"id":"b","text":"Use the custom_id values to identify the 38 failed invoices, chunk the 30 oversized ones into smaller requests, and resubmit only those 38.","correct":true,"why":"The guide's failure-handling pattern is to resubmit only the failed documents identified by custom_id, with modifications such as chunking for documents that exceeded context limits."},{"id":"c","text":"Resubmit the 38 failed invoices unchanged in a new batch, since transient errors usually clear on retry.","correct":false,"why":"The 8 transient failures may clear, but the 30 oversized invoices will exceed the context limit again unless they are chunked."},{"id":"d","text":"Send the 38 failed invoices through the synchronous API with a higher max_tokens value.","correct":false,"why":"max_tokens controls output length and does nothing about input exceeding the context window; the oversized documents still need to be split."}],"explanation":"Batch failures are handled selectively. The custom_id on each request identifies exactly which documents failed, so only those are resubmitted, and each is modified according to its failure: oversized documents are chunked to fit the context limit, while transient failures can simply be retried.","tags":["batch-api","custom-id","failure-handling","chunking"]},{"id":"N-4.5-05","domain":"D4","task":"4.5","scenario":"S6","type":"single","select":1,"stem":"Your team is about to migrate a backlog of 50,000 archived invoices through the Message Batches API using a new extraction prompt written last week. The prompt has been tested on 15 hand-picked invoices. Finance wants the whole archive submitted tonight. Each resubmission cycle for failed documents takes up to a day. What is the best step to take before submitting the full volume?","options":[{"id":"a","text":"Submit the first 10,000 through the synchronous API tonight so results arrive faster, then batch the rest.","correct":false,"why":"Faster results at full price for a fifth of the archive does nothing to validate the prompt across the variety of invoices in the archive."},{"id":"b","text":"Submit all 50,000 tonight and handle whatever fails by resubmitting those documents with fixes tomorrow.","correct":false,"why":"Any prompt defect is multiplied across 50,000 documents, and each fix-and-resubmit cycle costs another day and another round of processing charges."},{"id":"c","text":"Split the archive into five batches of 10,000 so a defect affects at most one fifth of the volume.","correct":false,"why":"Splitting limits blast radius but does not find the defects; all five batches would run with the same untested prompt."},{"id":"d","text":"Run the prompt on a representative sample of a few hundred invoices, measure first-pass validation success, and refine the prompt until that rate is high before submitting the archive.","correct":true,"why":"The guide recommends prompt refinement on a sample set before large batches to maximize first-pass success and avoid costly iterative resubmission."}],"explanation":"Because batch results take up to a day, every prompt defect discovered after a large submission costs a full resubmission cycle. Refining the prompt on a representative sample first, until first-pass success is high, is far cheaper than iterating at full volume.","tags":["batch-api","sample-set","prompt-refinement"]},{"id":"N-4.5-06","domain":"D4","task":"4.5","scenario":"S6","type":"multi","select":2,"stem":"Your operations lead is reviewing the design for moving the nightly document extraction job to the Message Batches API and asks you to confirm the constraints the design must respect. The job submits about 8,000 documents each evening and loads results into a data warehouse before the morning reports run. Which two statements about the Batches API are accurate and must shape the design? (Select TWO.)","options":[{"id":"a","text":"Each request shoul
