function renderQuestion(){
  const id = sess.items[sess.i]; const q = QBY[id];
  const mock = sess.mode==='mock';
  const chosen = new Set(sess.answers[id]||[]);
  const checked = !!sess.checked[id];
  const order = sess.order[id];
  const g = checked ? grade(q, [...chosen]) : null;
  const prevId = sess.i>0 ? sess.items[sess.i-1] : null;
  const showScen = mock && (!prevId || QBY[prevId].scenario!==q.scenario);
  const hideOpts = !mock && S.settings.hideOpts && !checked && !sess.revealed[id];
  const t = TASKS[q.task];
  let opts = '';
  order.forEach((oid, k) => {
    const o = q.options.find(x=>x.id===oid);
    let cls = 'opt' + (q.type==='multi'?' multi':'');
    if(!checked && chosen.has(oid)) cls += ' sel';
    if(checked){ if(o.correct && chosen.has(oid)) cls+=' correct'; else if(!o.correct && chosen.has(oid)) cls+=' wrong'; else if(o.correct) cls+=' missed'; }
    const why = checked && o.why ? `<span class="why"><b>${o.correct?'Correct.':'Not this.'}</b> ${esc(o.why)}</span>` : '';
    opts += `<button class="${cls}" data-opt="${oid}" ${checked?'disabled':''} role="${q.type==='multi'?'checkbox':'radio'}" aria-checked="${chosen.has(oid)}"><span class="k">${LETTERS[k]}</span><span style="min-width:0;flex:1"><span>${esc(o.text)}</span>${why}</span></button>`;
  });

    const cls = g.exact ? 'ok' : (g.score>0 ? 'part' : 'no');
    const txt = g.exact ? 'Correct' : g.score>0 ? `Partially correct (${Math.round(g.score*100)}% credit)` : (q.type==='multi' ? `Not quite: ${g.hits} of ${need} correct picks${g.wrongPicks? ', '+g.wrongPicks+' wrong pick'+(g.wrongPicks>1?'s':'') : ''}` : 'Incorrect');

  }
  const chips = `<span class="chip mono">${sess.i+1}/${sess.items.length}</span><span class="chip">${esc(domName(q.domain))}</span>${!mock||checked? `<span class="chip mono">${q.task}</span>`:''}<span class="chip ${q.type==='multi'?'multi':''}">${q.type==='multi'?'Multiple response':'Single answer'}</span>${sess.flags[id]?'<span class="chip warn">flagged</span>':''}${(sess.run||0)>=2?`<span class="chip good">${sess.run} in a row</span>`:''}`;
  let foot = '';
  if(mock){
    const answered = Object.keys(sess.answers).filter(k=>(sess.answers[k]||[]).length).length;
    foot = `<button class="btn secondary sm" id="prevQ" ${sess.i===0?'disabled':''}>← Prev</button>
      <button class="btn secondary sm" id="flagQ" aria-pressed="${!!sess.flags[id]}">${sess.flags[id]?'Unflag':'Flag'}</button>

      <button class="btn secondary sm" id="reviewQ">Review all</button>

  } else if(!checked){
    foot = `<button class="btn secondary sm" id="quitQ">End session</button><span class="spacer"></span><span class="hint">${q.type==='multi'?'Pick exactly '+need:'Pick one'} · <kbd>Enter</kbd> to check</span><button class="btn sm" id="checkQ" ${(q.type==='multi'? chosen.size===need : chosen.size===1)?'':'disabled'}>Check</button>`;
  } else {
    foot = `<button class="btn secondary sm" id="quitQ">End session</button><span class="spacer"></span><button class="btn sm" id="nextQ">${sess.i===sess.items.length-1?'Finish':'Next →'}</button>`;
  }
  return `
  <div class="card" id="qcard" tabindex="-1">
    <div class="qhead">${chips}<span class="prog">${sess.mode==='mock'?'Mock':sess.mode==='review'?'Spaced review':sess.mode==='retired'?'Retired bank':'Drill'}</span></div>
    ${showScen && SCEN[q.scenario] ? `<div class="scen"><b>Scenario · ${esc(SCEN[q.scenario].title)}</b></div>` : ''}
    <p class="stem">${esc(q.stem)}</p>

    ${hideOpts ? `<div class="hidden-opts">Decide on your answer first, then <button class="btn secondary sm" id="revealQ">reveal the options</button></div>` : `<div class="opts" role="${q.type==='multi'?'group':'radiogroup'}">${opts}</div>`}

  </div>
  ${sess.note && sess.i===0 ? `<p class="small muted" style="margin-top:10px">${esc(sess.note)}</p>` : ''}`;

function leaveItem(){ if(!sess) return; const id=sess.items[sess.i]; sess.spent=sess.spent||{}; sess.spent[id]=(sess.spent[id]||0)+(Date.now()-(sess.qStart||Date.now())); sess.qStart=Date.now(); }
function choose(oid){
  const id = sess.items[sess.i]; const q = QBY[id];
  if(sess.checked[id]) return;
  let a = sess.answers[id] ? sess.answers[id].slice() : [];
  if(q.type==='single') a = [oid];
  else { const k=a.indexOf(oid); if(k>=0) a.splice(k,1); else { if(a.length>=q.select) a.shift(); a.push(oid); } }
  sess.answers[id] = a;
  if(sess.mode==='mock' && sess.feedback && a.length===(q.type==='multi'? q.select : 1)){
    sess.checked[id] = true; focusSel = '#nextQ';
    const g = grade(q, a); bumpRun(g.exact); announce(g.exact ? 'Correct.' : 'Incorrect. ' + q.explanation);
  }
  if(sess.mode==='mock') { S.session=sess; save(); }
  render();
}
function checkCurrent(){
  const id = sess.items[sess.i]; const q = QBY[id];
  const a = sess.answers[id]||[];
  if(sess.checked[id]) return;
  if(q.type==='multi' ? a.length!==q.select : a.length!==1) return;
  const ms = Date.now()-(sess.qStart||Date.now());
  const g = record(q, a, ms, sess.mode); sess.checked[id]=true; save();
  bumpRun(g.exact);
  if(g.mastered){ sess.mastered=(sess.mastered||[]).concat(id); toast('Mastered · out of spaced review · '+masteredCount()+' of '+BANK.length+' mastered'); }
  focusSel = '#nextQ';
  render(); announce((g.exact ? 'Correct.' : 'Incorrect. ' + q.explanation) + (g.mastered ? ' Mastered.' : ''));
}
function nextQ(){
  if(sess.mode==='mock'){
    leaveItem();
    if(sess.i < sess.items.length-1){ sess.i++; S.session=sess; save(); focusSel='#qcard'; render(); }
    else { sess.reviewing=true; render(); }
    return;
  }
  if(!sess.checked[sess.items[sess.i]]) return;
  if(sess.i < sess.items.length-1){ sess.i++; sess.qStart=Date.now(); focusSel='#qcard'; render(); }
  else finishPractice();
}
function finishPractice(){
  const ids = sess.items.filter(id=>sess.checked[id]);
  const per = {}; let score=0; ids.forEach(id=>{ per[id]=grade(QBY[id], sess.answers[id]||[]); score+=per[id].score; });
  sess.submitted=true; sess.results={ score, n: ids.length, pct: ids.length? Math.round(100*score/ids.length):0, secs: Math.round((Date.now()-sess.startedAt)/1000), perItem: per, items: ids, filter:'all', practice:true, mastered:(sess.mastered||[]).length, bestRun: sess.bestRun||0 };
  render();
}

/* ---------- results ---------- */
function renderResults(){
  const R = sess.results; const items = R.items || sess.items;
  const mock = sess.mode==='mock';
  const P = mock ? R.prev : null;
  const delta = (now, then) => { const x = now-then; return `<span style="color:${x>0?'var(--good)':x<0?'var(--bad)':'var(--faint)'}">${x>0?'+':''}${x}</span>`; };
  const byDom = mock ? DORDER.filter(d=>R.byDomain[d]).map(d=>{ const b=R.byDomain[d]; const p=pct(b.c,b.n); const pb=P&&P.byDomain[d]; return `<tr><td>${esc(domName(d))}</td><td><div class="bar"><span class="${barClass(p)}" style="width:${p}%"></span></div></td><td class="num">${p}% <span class="faint">(${Math.round(b.c*10)/10}/${b.n})</span></td>${P?`<td class="num">${pb? delta(p, pct(pb.c,pb.n)) : '<span class="faint">—</span>'}</td>`:''}</tr>`; }).join('') : '';
  const f = R.filter||'all';
  const shown = items.filter(id => f==='all' ? true : f==='wrong' ? !R.perItem[id].exact : f==='flagged' ? sess.flags[id] : true);
  const list = shown.map(id => {
    const q=QBY[id]; const g=R.perItem[id]; const chosen=new Set(sess.answers[id]||[]);
    const opts = sess.order[id].map((oid,k)=>{ const o=q.options.find(x=>x.id===oid); let cls='opt'; if(o.correct&&chosen.has(oid)) cls+=' correct'; else if(!o.correct&&chosen.has(oid)) cls+=' wrong'; else if(o.correct) cls+=' missed';
      return `<div class="${cls}" style="cursor:default"><span class="k">${LETTERS[k]}</span><span style="min-width:0;flex:1"><span>${esc(o.text)}</span>${o.why?`<span class="why"><b>${o.correct?'Correct.':'Not this.'}</b> ${esc(o.why)}</span>`:''}</span></div>`; }).join('');
    return `<details class="item"><summary><span class="chip ${g.exact?'good':(g.score>0?'warn':'bad')}">${g.exact?'✓':(g.score>0?'½':'✗')}</span><span class="chip mono">${items.indexOf(id)+1}</span>${sess.flags[id]?'<span class="chip warn">flagged</span>':''}<span class="st">${esc(q.stem.slice(0,140))}${q.stem.length>140?'…':''}</span></summary>
      <p class="small muted" style="margin-bottom:8px">${esc(domName(q.domain))} · ${q.task} · ${q.type==='multi'?'multiple response':'single answer'}${chosen.size?'':' · <b>unanswered</b>'}</p>
      <div class="opts">${opts}</div><div class="expl">${esc(q.explanation)}<span class="ref">${esc(q.guideRef||'')} · <a href="#" data-bp="${q.task}">Blueprint ${q.task}</a></span></div></details>`;
  }).join('');
  const wrongN = items.filter(id=>!R.perItem[id].exact).length; const flagN = items.filter(id=>sess.flags[id]).length;
  return `
  <h1>${mock?'Mock results':'Session results'}</h1>
  <div class="card">
    <div class="score"><b>${R.pct}%</b><div><div class="pass" style="color:${R.pct>=72?'var(--good)':'var(--bad)'}">${R.pct>=72 ? 'Above a 72% raw line' : 'Below a 72% raw line'}</div><div class="small muted">${Math.round(R.score*10)/10} of ${R.n} · ${fmtTime(R.secs*1000)}${R.auto?' · submitted automatically at time-out':''}${R.n? ' · '+Math.round(R.secs/R.n)+'s per item' : ''}</div></div></div>
    ${P ? `<div class="row" style="margin-top:12px"><span class="chip ${R.pct>P.pct?'good':R.pct<P.pct?'bad':''}">${R.pct-P.pct>0?'+':''}${R.pct-P.pct} vs last mock${P.n!==R.n?` (${P.n} items)`:''}</span>${R.pct>P.best?'<span class="chip good">New personal best</span>':''}</div>` : ''}
    ${R.bestRun>=2 || R.mastered ? `<div class="row" style="margin-top:12px">${R.bestRun>=2?`<span class="chip good">Best run · ${R.bestRun} in a row</span>`:''}${R.mastered?`<span class="chip good">${R.mastered} newly mastered · ${masteredCount()} of ${BANK.length} total</span>`:''}</div>` : ''}
    <p class="small muted" style="margin-top:10px">The real exam reports a scaled score (100–1,000, pass at 720), which is not a fixed percentage. Treat 72% raw as a rough floor, not the pass mark.</p>
    ${mock ? `<hr class="sep"><table class="dom"><thead><tr><th>Domain</th><th>Accuracy</th><th></th>${P?'<th>vs last</th>':''}</tr></thead><tbody>${byDom}</tbody></table>` : ''}
    <div class="qfoot"><button class="btn" id="doneQ">Back to dashboard</button><button class="btn secondary" id="againQ">${mock?'New mock':'Run again'}</button></div>
  </div>
  <div class="card">
    <div class="row"><h2 style="margin:0">Review</h2><span class="spacer" style="flex:1"></span>
      <button class="btn secondary sm" data-filter="all" ${f==='all'?'disabled':''}>All ${items.length}</button>
      <button class="btn secondary sm" data-filter="wrong" ${f==='wrong'?'disabled':''}>Missed ${wrongN}</button>
      ${mock? `<button class="btn secondary sm" data-filter="flagged" ${f==='flagged'?'disabled':''}>Flagged ${flagN}</button>`:''}</div>
    ${list || '<p class="muted small" style="margin-top:10px">Nothing to show.</p>'}
  </div>`;
}

/* ---------- blueprint ---------- */
function renderBlueprint(){
  const tasksHtml = DORDER.map(d => `<div class="card"><h2>${esc(domName(d))} <span class="chip mono">${BP.domains[d].weight}%</span></h2>` + BP.tasks.filter(t=>t.domain===d).map(t => {
    const tq = BANK.filter(q=>q.task===t.id); const n = tq.length; const a = accByLatest(tq.map(q=>q.id)); const m = tq.filter(q=>(S.q[q.id]||{}).box>=5).length;
    return `<div class="task" id="task-${t.id}" tabindex="-1"><div class="tsum"><span class="id">${t.id}</span><span class="tt">${esc(t.title)}</span><span class="cnt">${m}/${n} mastered · ${fmtPct(a.acc)}</span><button class="btn secondary sm" data-drilltask="${t.id}">Drill</button></div></div>`;
  }).join('') + `</div>`).join('');
  return `
  <h1>Blueprint</h1>
  <p class="lede">The exam's task statements, by ID and title. The knowledge and skills under each task, the scenarios and the exam logistics are in Anthropic's official guide.</p>
  <div class="card"><div class="row"><div style="flex:1;min-width:12em"><b>Official exam guide</b><div class="small muted">Published by Anthropic on the Anthropic Partner Academy</div></div><a class="btn secondary" href="${GUIDE_URL}" target="_blank" rel="noopener">Open the official guide</a></div></div>
  ${tasksHtml}`;
}

/* ---------- settings ---------- */
function renderSettings(){
  const exportJson = JSON.stringify(Object.assign({}, S, { session: null }));
  return `
  <h1>Settings</h1>
  <div class="card">
    <label class="toggle"><input type="checkbox" id="setPartial" ${S.settings.partial?'checked':''}> Partial credit on multiple-response items (the fraction of required picks that were correct)</label>
    <p class="small muted" style="margin:4px 0 14px 24px">Off by default: the guide does not describe partial credit, so all-or-nothing is the safer assumption.</p>
    <label class="toggle"><input type="checkbox" id="setHide" ${S.settings.hideOpts?'checked':''}> Hide options first in drills and spaced review</label>
  </div>
  <div class="card"><h2>Progress data</h2><p class="lede">Copy this to move progress to another browser, or paste a copy back in.</p>
    <textarea id="exportBox" readonly>${esc(exportJson)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn secondary sm" id="copyExport">Copy</button><textarea id="importBox" placeholder="Paste exported JSON here" style="min-height:60px"></textarea><button class="btn secondary sm" id="doImport">Import</button></div>
  </div>
  <div class="card"><h2>Reset</h2><p class="lede">Clears every answer, mock, box and checklist tick in this browser.</p><div class="row" style="margin-top:10px"><button class="btn danger" id="resetAll">${armed==='reset'?'Confirm reset':'Reset all progress'}</button>${armed==='reset'?'<span class="armed">This cannot be undone.</span>':''}</div></div>
  <div class="card flat"><p class="small muted">Bank: ${BANK.length} new items (${BANK.filter(q=>q.type==='multi').length} multiple-response) · built ${esc(DATA.builtAt)}</p></div>`;
}

/* ---------- wiring ---------- */
function wire(){
  const $ = s => document.querySelector(s);
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => choose(b.dataset.opt));
  document.querySelectorAll('[data-bp]').forEach(a => a.onclick = e => { e.preventDefault(); openBlueprint(a.dataset.bp); });
  document.querySelectorAll('[data-drilltask]').forEach(b => b.onclick = () => { drillF = { domain:'D'+b.dataset.drilltask[0], task:b.dataset.drilltask, type:'all', scenario:'all', only:'all', n:'all' }; endSession(); view='drill'; render(); });
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { sess.i=+b.dataset.goto; sess.reviewing=false; sess.qStart=Date.now(); render(); });
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { sess.results.filter=b.dataset.filter; render(); });
  document.querySelectorAll('[data-check]').forEach(c => c.onchange = () => { S.check[c.dataset.check]=c.checked; save(); render(); });
  if($('#checkQ')) $('#checkQ').onclick = checkCurrent;
  if($('#nextQ')) $('#nextQ').onclick = nextQ;
  if($('#prevQ')) $('#prevQ').onclick = () => { if(sess.i>0){ leaveItem(); sess.i--; render(); } };
  if($('#flagQ')) $('#flagQ').onclick = () => { const id=sess.items[sess.i]; sess.flags[id]=!sess.flags[id]; S.session=sess; save(); render(); };
  if($('#reviewQ')) $('#reviewQ').onclick = () => { leaveItem(); sess.reviewing=true; render(); };
  if($('#backToQ')) $('#backToQ').onclick = () => { armed=null; sess.reviewing=false; render(); };
  if($('#submitMock')) $('#submitMock').onclick = () => { const un=sess.items.filter(id=>!(sess.answers[id]||[]).length).length; if(!un) submitMock(false); else twoStep('submit', () => submitMock(false)); };
  if($('#revealQ')) $('#revealQ').onclick = () => { sess.revealed[sess.items[sess.i]]=true; sess.qStart=Date.now(); render(); };
  if($('#quitQ')) $('#quitQ').onclick = () => { if(Object.keys(sess.checked).length) finishPractice(); else { const m=sess.mode; endSession(); view = m==='retired'?'retired':m==='review'?'review':'drill'; render(); } };
  if($('#doneQ')) $('#doneQ').onclick = () => { endSession(); view='home'; render(); };
  if($('#againQ')) $('#againQ').onclick = () => { const m=sess.mode; endSession(); view = m==='mock'?'mock':m==='retired'?'retired':m==='review'?'review':'drill'; render(); };
  if($('#startMock')) $('#startMock').onclick = () => { const n=+$('#mockLen').value; buildMock(n, n*2); sess.feedback=!!S.settings.mockFeedback; S.session=sess; save(); focusSel='#qcard'; render(); startTimer(); };
  if($('#resumeMock')) $('#resumeMock').onclick = () => { sess=S.session; render(); startTimer(); };
  if($('#discardMock')) $('#discardMock').onclick = () => { twoStep('discard', () => { S.session=null; save(); render(); }); };
  ['fDomain','fTask','fType','fScen','fOnly','fN'].forEach(id => { const el=$('#'+id); if(el) el.onchange = () => { const map={fDomain:'domain',fTask:'task',fType:'type',fScen:'scenario',fOnly:'only',fN:'n'}; drillF[map[id]]=el.value; if(id==='fDomain') drillF.task='all'; render(); }; });
  ['fHide','fHide2'].forEach(id => { const el=$('#'+id); if(el) el.onchange = () => { S.settings.hideOpts=el.checked; save(); }; });
  if($('#startDrill')) $('#startDrill').onclick = () => { let pool=drillPool(drillF); if(drillF.n!=='all') pool=pool.slice(0,+drillF.n); newSession('drill', pool.map(q=>q.id)); focusSel='#qcard'; render(); };
  if($('#startDue')) $('#startDue').onclick = () => { const ids=shuffle(dueIds()); newSession('review', ids); focusSel='#qcard'; render(); };
  if($('#startNew')) $('#startNew').onclick = () => { const ids=shuffle(BANK.filter(q=>!(S.q[q.id]||{}).seen).map(q=>q.id)).slice(0,10); newSession('review', ids); focusSel='#qcard'; render(); };
  if(false && $('#startRetired')) $('#startRetired').onclick = () => { let pool=drillPool({ retired:true, domain:$('#rDomain').value }); const n=$('#rN').value; if(n!=='all') pool=pool.slice(0,+n); newSession('retired', pool.map(q=>q.id)); focusSel='#qcard'; render(); };
  if($('#setMockFb')) $('#setMockFb').onchange = e => { S.settings.mockFeedback=e.target.checked; save(); };
  if($('#setPartial')) $('#setPartial').onchange = e => { S.settings.partial=e.target.checked; save(); };
  if($('#setHide')) $('#setHide').onchange = e => { S.settings.hideOpts=e.target.checked; save(); };
  if($('#copyExport')) $('#copyExport').onclick = () => { const b=$('#exportBox'); b.select(); try{ navigator.clipboard.writeText(b.value); }catch(e){ document.execCommand('copy'); } announce('Copied'); };
  if($('#doImport')) $('#doImport').onclick = () => { try{ const o=JSON.parse($('#importBox').value); if(!o.q) throw new Error('no q'); S=Object.assign(blank(), o); S.session=null; save(); render(); toast('Progress imported'); }catch(e){ toast('That is not exported progress JSON. Paste the full text from the Progress data box.'); } };
  if($('#resetAll')) $('#resetAll').onclick = () => { twoStep('reset', () => { const theme=S.settings.theme; S=blank(); S.settings.theme=theme; save(); sess=null; view='home'; render(); toast('Progress reset'); }); };
}
function openBlueprint(taskId){ endSession(); view='blueprint'; render(); const el=document.getElementById('task-'+taskId); if(el){ el.scrollIntoView({block:'start'}); el.focus({preventScroll:true}); } }

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  armed=null;
  if(sess && sess.mode==='mock' && !sess.submitted){ sess=null; stopTimer(); toast('Mock saved. Resume it from the Mock exam tab.'); }
  else if(sess && !sess.submitted && Object.keys(sess.checked||{}).length===0){ sess=null; }
  else if(sess && !sess.submitted){ sess=null; }
  else sess=null;
  view=b.dataset.view; render(); window.scrollTo({top:0});
});

/* keyboard */
document.addEventListener('keydown', e => {
  if(!sess || sess.submitted) return;
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
  if(sess.reviewing) return;
  const id=sess.items[sess.i]; const q=QBY[id];
  if(/^[1-6]$/.test(e.key)){ const k=+e.key-1; if(k<sess.order[id].length && !sess.checked[id] && !(S.settings.hideOpts && sess.mode!=='mock' && !sess.revealed[id])) { choose(sess.order[id][k]); e.preventDefault(); } }
  else if(e.key==='Enter'){ if(sess.mode==='mock') nextQ(); else if(sess.checked[id]) nextQ(); else checkCurrent(); e.preventDefault(); }
  else if(sess.mode==='mock' && e.key==='ArrowRight'){ if(sess.i<sess.items.length-1){ leaveItem(); sess.i++; render(); } }
  else if(sess.mode==='mock' && e.key==='ArrowLeft'){ if(sess.i>0){ leaveItem(); sess.i--; render(); } }
  else if(sess.mode==='mock' && (e.key==='f'||e.key==='F')){ sess.flags[id]=!sess.flags[id]; S.session=sess; save(); render(); }
});

/* theme */
function paintTheme(){
  const t=S.settings.theme; const root=document.documentElement;
  if(t==='dark'||t==='light') root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
  const dark = t==='dark' || (t!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const b=document.getElementById('themeBtn'); b.textContent = dark ? 'Light theme' : 'Dark theme'; b.setAttribute('aria-pressed', String(dark));
}
document.getElementById('themeBtn').onclick = () => { const dark = document.documentElement.getAttribute('data-theme')==='dark' || (document.documentElement.getAttribute('data-theme')!=='light' && matchMedia('(prefers-color-scheme: dark)').matches); S.settings.theme = dark?'light':'dark'; save(); paintTheme(); };

/* boot */
load(); paintTheme();
if(S.session && !S.session.submitted){ view='mock'; }
render();
</script>
</body>
</html>
