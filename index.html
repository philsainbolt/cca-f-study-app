ore work seems needed.","correct":false,"why":"stop_reason is set by the API to reflect the model's response; hooks do not alter loop control signals."},{"id":"d","text":"A hook that re-ranks the available tools each turn to improve tool selection accuracy.","correct":false,"why":"Tool selection is driven by descriptions and the model's reasoning; no hook pattern re-ranks tools."},{"id":"e","text":"A hook that runs /compact automatically when the context window passes a token threshold.","correct":false,"why":"Compaction is a context-management operation, not one of the hook patterns the guide describes for tool calls and results."}],"explanation":"The guide describes two hook patterns: PostToolUse hooks that intercept and transform tool results before the model processes them, and hooks that intercept outgoing tool calls to enforce compliance rules.","tags":["hook-patterns","PostToolUse","interception"]},{"id":"N-1.5-04","domain":"D1","task":"1.5","scenario":"S4","type":"single","select":1,"stem":"Your developer-productivity agent must never modify files under infra/prod/. The rule has lived in CLAUDE.md for two months, yet an audit found three Write calls and one Bash sed command that touched that directory. The agent is otherwise expected to edit files freely elsewhere. Which approach gives the strongest guarantee?","options":[{"id":"a","text":"Move the rule to the first line of the system prompt so it receives more attention.","correct":false,"why":"Placement changes probability, not certainty; the rule stays a prompt instruction with a non-zero failure rate."},{"id":"b","text":"Add a tool-call interception hook that blocks Write, Edit, and Bash calls whose target path falls under infra/prod/.","correct":true,"why":"Guaranteed compliance with a business rule calls for a hook that intercepts the call before it executes."},{"id":"c","text":"Run the agent on a git branch and review the diff before merging.","correct":false,"why":"Review catches violations after they happen; it does not prevent the agent from making the change."},{"id":"d","text":"Add an instruction requiring the agent to ask for confirmation before any write.","correct":false,"why":"Confirmation prompts are still prompt-based, slow down every legitimate edit, and were not honored in the observed cases."}],"explanation":"When a business rule requires guaranteed compliance, the guide directs you to hooks that intercept the tool call rather than prompt-based enforcement, which is probabilistic.","tags":["interception-hook","guaranteed-compliance","path-restriction"]},{"id":"N-1.5-05","domain":"D1","task":"1.5","scenario":"S1","type":"single","select":1,"stem":"Your support agent's behavior spec lists four rules. You have budget to implement one of them as a hook and the rest as prompt instructions. Which rule should be enforced by a hook rather than by the system prompt?","options":[{"id":"a","text":"Responses should acknowledge the customer's frustration before explaining next steps.","correct":false,"why":"Tone is a probabilistic quality where prompt guidance is appropriate; occasional lapses are not compliance failures."},{"id":"b","text":"When a customer supplies an order number, prefer lookup_order before get_customer.","correct":false,"why":"This is a soft ordering preference with no harm when the model deviates, so prompt guidance suffices."},{"id":"c","text":"Closing messages should be under 200 words.","correct":false,"why":"Length is a stylistic preference; a rare long message is not a policy violation worth a hook."},{"id":"d","text":"Refunds above $500 must not be issued by the agent and must go to a human.","correct":true,"why":"A financial threshold is a business rule requiring guaranteed compliance; only a hook gives deterministic enforcement."}],"explanation":"Hooks provide deterministic guarantees and should be reserved for rules where a violation is unacceptable, such as financial thresholds. Stylistic and soft-ordering preferences are appropriate for prompt-based, probabilistic compliance.","tags":["hooks-vs-prompt","deterministic","business-rule"]},{"id":"N-1.5-06","domain":"D1","task":"1.5","scenario":"S1","type":"multi","select":2,"stem":"You are implementing a single PostToolUse hook for the support agent. lookup_order returns {\"shipped_at\": 1719792000, \"status\": 3}, get_customer returns {\"created\": \"2024-06-30T00:00:00Z\", \"tier\": \"gold\"}, and the shipping server returns {\"eta\": \"2024-07-02\"}. Which two transformations belong in this PostToolUse hook? (Select TWO.)","options":[{"id":"a","text":"Convert the Unix timestamp and the ISO 8601 strings into one consistent date representation before the model sees them.","correct":true,"why":"Normalizing timestamp formats from different tools is the guide's primary example of PostToolUse transformation."},{"id":"b","text":"Map the numeric status code 3 to a named status such as \"shipped\".","correct":true,"why":"Numeric status codes are explicitly named as data the hook should normalize so the agent reasons over meaningful values."},{"id":"c","text":"Reject the upcoming process_refund call if its amount exceeds $500.","correct":false,"why":"Blocking an outgoing call is the job of a tool-call interception hook that runs before execution, not a PostToolUse result transform."},{"id":"d","text":"Decide whether the agentic loop should terminate based on the result contents.","correct":false,"why":"Loop termination is driven by stop_reason in the loop itself; result hooks transform data, they do not control the loop."},{"id":"e","text":"Rewrite the customer's original message to include the fetched order details.","correct":false,"why":"Hooks transform tool results; altering user messages is not their role and would corrupt the conversation record."}],"explanation":"PostToolUse hooks normalize heterogeneous tool results such as Unix timestamps, ISO 8601 dates, and numeric status codes into consistent forms. Blocking policy-violating calls belongs to interception hooks, and loop control belongs to stop_reason handling.","tags":["PostToolUse","status-codes","timestamps"]},{"id":"N-1.5-07","domain":"D1","task":"1.5","scenario":"S3","type":"single","select":1,"stem":"Legal requires that your research system never fetch content from a list of 40 blocked domains. The web search subagent's prompt includes the list, but audit logs show fetches to blocked domains in about 2% of runs, usually when a blocked page appears high in results. You need the fetches themselves to stop, not just the citations. Which mechanism is correct?","options":[{"id":"a","text":"A PostToolUse hook that strips results from blocked domains after the fetch returns.","correct":false,"why":"By the time a result hook runs, the fetch has already happened; this filters output but does not prevent the prohibited access."},{"id":"b","text":"A tool-call interception hook that inspects each outgoing fetch call and blocks it when the URL matches a blocked domain, returning a structured explanation.","correct":true,"why":"Intercepting the outgoing call before execution is the only point at which the fetch can be prevented deterministically."},{"id":"c","text":"Add the blocked-domain list to the fetch tool's description so the model sees it at selection time.","correct":false,"why":"Descriptions guide the model's choices but remain probabilistic; the 2% leakage would persist."},{"id":"d","text":"Have the coordinator review each subagent's URLs and re-run the search if any are blocked.","correct":false,"why":"The coordinator sees results only after the subagent has fetched them; re-running does not undo the prohibited access."}],"explanation":"Preventing an action requires intercepting the outgoing tool call before it executes. PostToolUse hooks act on results after the tool has run, so they cannot stop a prohibited fetch, only hide it.","tags":["interception-hook","pre-execution","compliance"]},{"id":"N-1.6-01","domain":"D1","task":"1.6","scenario":"S5","type":"single","select":1,"stem":"Your CI system runs two Claude Code workflows. Workflow A reviews every pull request for the same three concerns: security, style, and test coverage. Workflow B is triggered by an engineer's request such as \"figure out why the nightly integration suite fails intermittently,\" where the cause could be anywhere in the repo or its infrastructure. Which decomposition strategy fits each workflow?","options":[{"id":"a","text":"Dynamic decomposition for both, so each workflow can adapt to the specific pull request or failure.","correct":false,"why":"Workflow A's aspects are fixed and known in advance; letting the model decide which to run invites inconsistent coverage."},{"id":"b","text":"Prompt chaining for both, with a fixed step list written for each.","correct":false,"why":"Workflow B's steps cannot be enumerated up front because each finding changes what to look at next."},{"id":"c","text":"Prompt chaining for Workflow A, with one focused pass per concern; dynamic decomposition for Workflow B, generating subtasks from what each step discovers.","correct":true,"why":"Predictable multi-aspect reviews suit fixed sequential pipelines, while open-ended investigation needs an adaptive plan."},{"id":"d","text":"Dynamic decomposition for Workflow A and prompt chaining for Workflow B.","correct":false,"why":"This inverts the guide's mapping: the fixed review gets an unpredictable plan while the open-ended investigation is locked into steps."}],"explanation":"Select the decomposition pattern by workflow shape: prompt chaining for predictable multi-aspect reviews where the passes are known in advance, dynamic decomposition for open-ended investigations whose subtasks depend on intermediate findings.","tags":["prompt-chaining","dynamic-decomposition","pattern-selection"]},{"id":"N-1.6-02","domain":"D1","task":"1.6","scenario":"S5","type":"single","select":1,"stem":"After splitting your automated review into a per-file pass, the quality of local findings improved and reviewers are satisfied with file-level feedback. However, a 22-file pull request shipped with a bug the review missed: one file changed a function's return type while a caller in another file still expected the old shape. Each file looked correct on its own. What is missing from the review design?","options":[{"id":"a","text":"Run the per-file pass twice and merge the findings so intermittent misses are caught.","correct":false,"why":"Repeating a local pass cannot surface a defect that only exists in the relationship between two files."},{"id":"b","text":"A separate cross-file integration pass that examines data flow and interfaces between the changed files.","correct":true,"why":"The guide's chaining pattern pairs per-file local analysis with a distinct integration pass precisely for cross-file issues."},{"id":"c","text":"Increase the depth of the per-file pass by asking for more detail on every function.","correct":false,"why":"More detail on each file in isolation still lacks the other file's context; the mismatch is invisible from either side alone."},{"id":"d","text":"Return to reviewing all 22 files in one pass with a larger-context model so relationships are visible.","correct":false,"why":"A single large pass reintroduces the attention dilution the per-file split was adopted to avoid."}],"explanation":"Large code reviews are decomposed into per-file local passes plus a separate cross-file integration pass. Local passes catch file-level issues; only the integration pass can catch interface and data-flow mismatches between files.","tags":["integration-pass","per-file-review","cross-file"]},{"id":"N-1.6-03","domain":"D1","task":"1.6","scenario":"S4","type":"single","select":1,"stem":"An engineer asked the productivity agent to \"add comprehensive tests to this legacy codebase.\" The agent immediately began writing tests, working through files alphabetically. Three hours later it had thorough tests for string helpers and a date-formatting utility, nothing for the payments or order-fulfillment modules, and its context was exhausted. What should the agent have done first?","options":[{"id":"a","text":"Spawned one subagent per file so all files were tested in parallel before context ran out.","correct":false,"why":"Parallelism without prioritization spends effort uniformly across trivial and critical code, and the coverage gap on high-impact modules would persist."},{"id":"b","text":"Asked the engineer for an ordered list of files to test and followed it exactly.","correct":false,"why":"This turns an open-ended task into a fixed pipeline and assumes the engineer already knows the structure, which is what the agent is meant to discover."},{"id":"c","text":"Requested a larger context window so it could finish the alphabetical pass.","correct":false,"why":"More context does not fix the absence of prioritization; the highest-value modules would still be reached last, if at all."},{"id":"d","text":"Mapped the codebase structure, identified high-impact areas such as payments and fulfillment, and produced a prioritized plan that adapts as dependencies are discovered.","correct":true,"why":"The guide's approach to open-ended tasks is map first, prioritize by impact, then plan adaptively rather than start executing in arbitrary order."}],"explanation":"Open-ended tasks should be decomposed by first mapping structure, then identifying high-impact areas, then creating a prioritized plan that adapts as dependencies surface, rather than executing in an arbitrary fixed order.","tags":["open-ended-task","prioritization","legacy-tests"]},{"id":"N-1.6-04","domain":"D1","task":"1.6","scenario":"S4","type":"multi","select":2,"stem":"While investigating \"how does billing reconciliation work in this legacy system,\" the agent's third step uncovers an undocumented cron job that rewrites ledger rows nightly. Its original plan had two remaining steps: summarize the API handlers and document the database schema. Which two behaviors reflect the adaptive investigation approach the guide describes? (Select TWO.)","options":[{"id":"a","text":"Generate new subtasks from the discovery, such as tracing which tables the cron job writes and which handlers read them.","correct":true,"why":"Adaptive plans create subtasks based on what is discovered at each step rather than only executing the original list."},{"id":"b","text":"Revise the priority of the remaining steps now that the cron job may explain behaviors the schema alone would not.","correct":true,"why":"The value of an adaptive plan is that later steps are re-prioritized as dependencies come to light."},{"id":"c","text":"Finish the two planned steps unchanged and mention the cron job in a footnote of the final summary.","correct":false,"why":"Ignoring a discovery that changes the picture is the fixed-pipeline failure mode the adaptive approach exists to avoid."},{"id":"d","text":"Discard the current investigation and restart with a new fixed step list that includes the cron job.","correct":false,"why":"Restarting throws away valid findings; adaptation means extending the plan in place, not resetting it."},{"id":"e","text":"Switch to a per-file pass followed by a cross-file integration pass over the whole repository.","correct":false,"why":"That chaining pattern suits predictable code reviews; it does not follow the trail of an open-ended investigation."}],"explanation":"Adaptive investigation plans generate new subtasks and re-prioritize remaining work based on what each step reveals, which is why they suit open-ended exploration where the important questions are not known up front.","tags":["adaptive-plan","investigation","subtask-generation"]},{"id":"N-1.6-05","domain":"D1","task":"1.6","scenario":"S5","type":"single","select":1,"stem":"A team let the model plan its own review for each pull request: it reads the diff and decides which checks to run. Over a month, the security check was skipped on 30% of PRs, style feedback varied in depth, and two PRs with missing tests were approved. Every PR is expected to receive the same four checks. What is the best change?","options":[{"id":"a","text":"Add \"always include the security check\" to the planning prompt.","correct":false,"why":"This patches one of several inconsistencies while leaving the review plan model-driven and variable."},{"id":"b","text":"Run the dynamic review three times per PR and take the union of findings.","correct":false,"why":"Tripling cost to compensate for an unpredictable plan is wasteful, and a check can still be skipped by all three runs."},{"id":"c","text":"Replace the dynamic plan with a fixed prompt chain that runs each of the four checks as its own focused pass on every PR.","correct":true,"why":"When the aspects to review are known and constant, a fixed sequential pipeline gives consistent coverage that a dynamic plan does not."},{"id":"d","text":"Move to a larger model so it plans reviews more reliably.","correct":false,"why":"The problem is choosing an adaptive pattern for a predictable task, not model capability."}],"explanation":"Dynamic decomposition suits open-ended work; for predictable multi-aspect reviews where the same checks must run every time, a fixed sequential pipeline (prompt chaining) delivers the consistency the workflow requires.","tags":["prompt-chaining","consistency","review-pipeline"]},{"id":"N-1.6-06","domain":"D1","task":"1.6","scenario":"S5","type":"multi","select":3,"stem":"You are documenting the prompt-chaining design your CI review will use for pull requests of 10 to 30 files. A new team member asks what specifically makes it prompt chaining rather than a single review prompt. Which three characteristics describe the chaining pattern the guide outlines for reviews? (Select THREE.)","options":[{"id":"a","text":"Each changed file is analyzed individually in its own focused pass for local issues.","correct":true,"why":"Per-file local analysis is the first stage of the guide's review chain."},{"id":"b","text":"A separate pass then examines cross-file integration, such as data flow between the changed files.","correct":true,"why":"The distinct integration pass is the second stage and is what catches issues invisible at file level."},{"id":"c","text":"The passes run in a fixed sequence, with each later pass building on the output of earlier ones.","correct":true,"why":"Prompt chaining is a sequential decomposition into focused steps whose outputs feed forward."},{"id":"d","text":"All files are placed in a single prompt so the model has the complete picture at once.","correct":false,"why":"A single all-files prompt is the attention-diluted approach chaining replaces."},{"id":"e","text":"The model decides at runtime which files deserve review and which can be skipped.","correct":false,"why":"Runtime selection of steps is dynamic decomposition, not a fixed chain, and undermines consistent coverage."},{"id":"f","text":"Independent subagents each review a random subset of files with no combining pass.","correct":false,"why":"Random partitioning without an integration pass loses cross-file analysis and has no sequential structure."}],"explanation":"Prompt chaining for reviews breaks the work into a fixed sequence of focused passes: per-file local analysis, then a separate cross-file integration pass, with each step's output feeding the next.","tags":["prompt-chaining","sequential-passes","review-design"]},{"id":"N-1.6-07","domain":"D1","task":"1.6","scenario":"S3","type":"single","select":1,"stem":"Your research coordinator follows a fixed pipeline: search, then analyze a predetermined document list, then synthesize. On the topic \"impact of the 2025 chip export rules on Taiwanese fabs,\" the search subagent surfaced that the decisive material is a set of regulatory filings, but the pipeline still analyzed the original list of trade-press articles and the report never examined the filings. Which change addresses this?","options":[{"id":"a","text":"Have the coordinator generate the document analysis subtasks from what the search step actually found, rather than from a predetermined list.","correct":true,"why":"Open-ended research needs dynamic decomposition where intermediate findings determine the next subtasks."},{"id":"b","text":"Add a fourth fixed step that always analyzes regulatory filings after the trade press.","correct":false,"why":"Hard-coding one more step fixes this topic only; the next topic will hinge on some other source the fixed list does not include."},{"id":"c","text":"Increase the number of initial search queries so the predetermined list is more likely to be right.","correct":false,"why":"A better initial guess still leaves the pipeline unable to react when the search reveals something the list omitted."},{"id":"d","text":"Skip document analysis and let synthesis work directly from the search results.","correct":false,"why":"Dropping analysis removes the stage that would have read the filings; the problem is rigidity, not the existence of the step."}],"explanation":"When intermediate findings should change what happens next, a fixed sequential pipeline is the wrong pattern. Dynamic adaptive decomposition lets the coordinator derive subsequent subtasks from what earlier steps discovered.","tags":["dynamic-decomposition","intermediate-findings","research-pipeline"]},{"id":"N-1.7-01","domain":"D1","task":"1.7","scenario":"S2","type":"single","select":1,"stem":"An engineer runs two long-lived Claude Code investigations in the same repository: one into an authentication bug, one into a query-performance regression. Each morning she resumes \"the last session\" and about half the time lands in the wrong investigation, then spends fifteen minutes re-establishing context. What is the recommended way to continue a specific investigation across days?","options":[{"id":"a","text":"Give each investigation a session name and continue it with --resume <session-name>.","correct":true,"why":"Named session resumption is the guide's mechanism for continuing a specific prior conversation rather than whichever was most recent."},{"id":"b","text":"Keep both investigations in one session so there is only one thing to resume.","correct":false,"why":"Merging unrelated investigations pollutes each with the other's tool results and makes the shared context harder to reason over."},{"id":"c","text":"Record each investigation's findings in CLAUDE.md so any new session starts with them.","correct":false,"why":"CLAUDE.md holds durable project instructions, not the transient working state of an investigation; this also loses the detailed context a resumed session retains."},{"id":"d","text":"Fork the most recent session each morning and steer it toward the right investigation.","correct":false,"why":"Forking creates branches from a baseline; it does not select which prior conversation to continue."}],"explanation":"Named sessions let you continue a specific prior conversation with --resume <session-name>, which matters when several investigations run in parallel and 'most recent' is ambiguous.","tags":["resume","named-session","investigation"]},{"id":"N-1.7-02","domain":"D1","task":"1.7","scenario":"S2","type":"single","select":1,"stem":"After Claude Code finished a detailed analysis of your test infrastructure, you asked it to design a property-based testing strategy, then in the same session asked for an example-based strategy so you could compare. The second design keeps referring back to decisions from the first, reuses its fixtures, and the comparison is no longer independent. How should you have set up the comparison?","options":[{"id":"a","text":"Ask the model to disregard the first strategy before designing the second.","correct":false,"why":"The first design remains in context and continues to influence the second regardless of the instruction."},{"id":"b","text":"Use fork_session after the analysis to create two independent branches, one per strategy, from the shared baseline.","correct":true,"why":"fork_session exists for exploring divergent approaches from a common analysis without cross-contamination."},{"id":"c","text":"Run /compact between the two designs so the first is summarized away.","correct":false,"why":"Compaction reduces volume but preserves the substance of the first design in summarized form; it does not isolate the branches."},{"id":"d","text":"Start a new session for the second strategy and let it re-analyze the test infrastructure from scratch.","correct":false,"why":"This isolates the branches but discards a valid baseline and repeats the analysis cost, which forking avoids."}],"explanation":"fork_session creates parallel exploration branches from a shared analysis baseline, so alternative strategies can be developed and compared independently without re-running the analysis or contaminating each other.","tags":["fork-session","testing-strategies","independent-branches"]},{"id":"N-1.7-03","domain":"D1","task":"1.7","scenario":"S4","type":"single","select":1,"stem":"This morning your productivity agent spent an hour exploring the notifications service: it read 30 files, mapped the event flow, and identified two candidate refactors. You stepped away for lunch; no commits or edits have happened since. You now want to continue toward implementing the first refactor. How should you proceed?","options":[{"id":"a","text":"Start a fresh session and paste in a structured summary of the morning's findings.","correct":false,"why":"A summary is the right move when tool results are stale; here they are current, and a summary would discard useful detail the session still holds."},{"id":"b","text":"Fork the session so the implementation does not disturb the exploration branch.","correct":false,"why":"Forking is for pursuing divergent approaches in parallel; a single continuation does not need a branch."},{"id":"c","text":"Resume the morning session, since its context and tool results are still valid.","correct":true,"why":"Resumption is the right choice when prior context is mostly valid, which is the case when nothing has changed."},{"id":"d","text":"Start a fresh session and have the agent re-read the 30 files to be safe.","correct":false,"why":"Full re-exploration wastes an hour of valid work for no reliability gain."}],"explanation":"Choose session resumption when the prior context and tool results are still valid. Fresh sessions with injected summaries are for when the earlier results have gone stale.","tags":["resume","valid-context","session-choice"]},{"id":"N-1.7-04","domain":"D1","task":"1.7","scenario":"S2","type":"single","select":1,"stem":"Yesterday's session analyzed your payment module in depth. Overnight, a teammate merged changes to three files: PaymentGateway.ts, RetryPolicy.ts, and their shared types file. You resume the session and ask it to implement the retry improvement it proposed; its first edit targets a function signature that no longer exists. Most of yesterday's analysis is still accurate. What is the most efficient corrective step?","options":[{"id":"a","text":"Tell the resumed session which three files changed and what changed, and ask it to re-read those before continuing.","correct":true,"why":"Informing a resumed session about specific file changes enables targeted re-analysis instead of a full restart."},{"id":"b","text":"Abandon the session and start a new one that re-explores the entire module.","correct":false,"why":"Most of the analysis remains valid; full re-exploration is the expensive outcome the guide says to avoid."},{"id":"c","text":"Rely on the agent to detect the changed files automatically when it resumes.","correct":false,"why":"A resumed session carries yesterday's tool results as-is; nothing refreshes them unless the agent is told to re-read."},{"id":"d","text":"Run /compact so the outdated file contents are summarized away.","correct":false,"why":"Compaction shrinks the context but does not know which facts are stale; the summarized analysis would still describe the old signature."}],"explanation":"When resuming after limited code modifications, inform the session about the specific files that changed so it re-analyzes only those, rather than either trusting stale results or re-exploring everything.","tags":["resume","changed-files","targeted-reanalysis"]},{"id":"N-1.7-05","domain":"D1","task":"1.7","scenario":"S4","type":"multi","select":3,"stem":"Your team is writing internal guidance on when to resume a Claude Code session, when to fork it, and when to start over, for investigations that span days in a codebase with frequent commits. Which three practices are consistent with the guide? (Select THREE.)","options":[{"id":"a","text":"Resume a named session with --resume when the prior context is still mostly valid.","correct":true,"why":"Resumption is appropriate when earlier tool results and reasoning still reflect the current code."},{"id":"b","text":"Start a fresh session seeded with a structured summary when the earlier tool results have become stale.","correct":true,"why":"A fresh session with a summary is more reliable than resuming with outdated tool results the model may keep relying on."},{"id":"c","text":"When resuming after a handful of file edits, tell the session which files changed so it re-analyzes only those.","correct":true,"why":"Targeted re-analysis of named files avoids both stale reasoning and full re-exploration."},{"id":"d","text":"Always start fresh to be safe, regardless of what has changed.","correct":false,"why":"Discarding valid context on every restart repeats exploration work and loses detail a summary cannot fully capture."},{"id":"e","text":"Resume the stale session and run /compact to remove outdated tool results.","correct":false,"why":"Compaction cannot distinguish stale facts from current ones; it condenses them together."},{"id":"f","text":"Fork the stale session so the outdated results stay available for comparison.","correct":false,"why":"Forking is for pursuing divergent approaches from a valid baseline; it does not address staleness."}],"explanation":"Session strategy depends on the validity of prior context: resume when it is mostly valid, tell a resumed session about specific changed files for targeted re-analysis, and start fresh with a structured summary when tool results are stale.","tags":["session-strategy","resume","fresh-summary"]},{"id":"N-1.7-06","domain":"D1","task":"1.7","scenario":"S4","type":"multi","select":2,"stem":"The productivity agent has completed a shared analysis of a monolith's service boundaries. Three engineers each want to attempt a different extraction approach, strangler pattern, module-first, and database-first, concurrently and without any one attempt influencing the others, then present all three for comparison. Which two statements describe how fork_session supports this? (Select TWO.)","options":[{"id":"a","text":"fork_session creates independent branches that each start from the completed analysis as a shared baseline.","correct":true,"why":"That is the defined purpose of fork_session: divergent exploration from a common analysis without repeating it."},{"id":"b","text":"Each forked branch's subsequent context stays isolated, so one engineer's design decisions do not appear in another's branch.","correct":true,"why":"Independence of branches is what makes the comparison fair and is why forking beats sequential attempts in one session."},{"id":"c","text":"All three engineers should --resume the same named session simultaneously and work in it together.","correct":false,"why":"Sharing one session mixes the three approaches into one context, destroying the independence the comparison requires."},{"id":"d","text":"Each engineer should start a fresh session and redo the boundary analysis before attempting their approach.","correct":false,"why":"Re-running a valid analysis three times wastes effort that forking from the baseline avoids."},{"id":"e","text":"Forked branches automatically merge their conclusions back into the original session when they finish.","correct":false,"why":"No automatic merge exists; the branches are independent and comparison happens outside the sessions."}],"explanation":"fork_session produces independent branches from a shared analysis baseline. Each branch proceeds in isolation, which is what allows divergent approaches to be explored concurrently and compared without contamination or re-exploration.","tags":["fork-session","shared-baseline","parallel-exploration"]},{"id":"N-1.7-07","domain":"D1","task":"1.7","scenario":"S2","type":"single","select":1,"stem":"You resume a two-week-old session in which Claude Code had explored your billing module. Since then the module was refactored: files were renamed, a helper was inlined, and error handling was rewritten. The resumed agent confidently proposes edits to functions that no longer exist and cites file contents that are gone. What is the most likely root cause of this behavior?","options":[{"id":"a","text":"The session name collided with another session and the wrong conversation was loaded.","correct":false,"why":"The session clearly contains the billing exploration; the problem is that its contents describe an old version of the code."},{"id":"b","text":"The model's training cutoff predates the refactor, so it cannot know about the new code.","correct":false,"why":"The agent learns about your code through tool results, not training data; the stale results in context are what mislead it."},{"id":"c","text":"Session resumption loads only the user messages and drops the assistant's prior analysis.","correct":false,"why":"The opposite is happening: the prior analysis and tool results are fully present, and that is the source of the outdated claims."},{"id":"d","text":"The resumed history contains stale tool results, and the model keeps reasoning from those file reads as if they were current.","correct":true,"why":"Resuming carries every earlier Read and Grep result forward unchanged; the model has no signal that they no longer match the repository."}],"explanation":"A resumed session includes all earlier tool results verbatim. After substantial code changes those results are stale but still authoritative-looking to the model, which is why starting fresh with a structured summary of still-valid findings is more reliable in this situation.","tags":["stale-tool-results","resume","root-cause"]},{"id":"N-1.7-08","domain":"D1","task":"1.7","scenario":"S2","type":"multi","select":2,"stem":"You maintain a checklist that developers consult before continuing a prior Claude Code session on a codebase. Which two situations are ones where resuming the existing session is the right call, rather than forking it or starting fresh? (Select TWO.)","options":[{"id":"a","text":"The session ended an hour ago and no code has changed since; you want to continue the same task.","correct":true,"why":"Prior context is fully valid, which is the condition under which resumption is preferred."},{"id":"b","text":"Two specific files changed since the session; you plan to name them so the agent re-reads just those before continuing.","correct":true,"why":"Limited, known changes are handled by informing the resumed session for targeted re-analysis rather than restarting."},{"id":"c","text":"The module the session analyzed was rewritten over the past sprint and most of its file reads no longer match.","correct":false,"why":"Widespread staleness calls for a fresh session seeded with a structured summary, not resumption."},{"id":"d","text":"You want to try two alternative refactoring designs from the same analysis and compare them side by side.","correct":false,"why":"Divergent exploration from a shared baseline is the use case for fork_session, not plain resumption."},{"id":"e","text":"The prior session investigated a different subsystem and you are starting an unrelated task in the same repository.","correct":false,"why":"Unrelated work should not inherit another investigation's context; start a new session or resume the correct named one."}],"explanation":"Resume when prior context is valid or when only a few known files changed and you can point the session at them. Widespread staleness calls for a fresh session with a summary, and divergent exploration calls for fork_session.","tags":["resume","session-choice","changed-files"]},{"id":"N-2.1-01","domain":"D2","task":"2.1","scenario":"S3","type":"single","select":1,"stem":"Your research system's web search subagent and document analysis subagent share two MCP tools: analyze_content (\"Analyzes content and returns key findings\") and analyze_document (\"Analyzes a document and returns key findings\"). Across the last 500 runs, the web search subagent passed fetched HTML pages to analyze_document 41% of the time, and the document analysis subagent sent PDFs to analyze_content 37% of the time, producing findings that lack the page structure or citation metadata each tool was built to capture. Which change most directly eliminates the misrouting?","options":[{"id":"a","text":"Add a rule to each subagent's system prompt stating which tool to use for HTML inputs versus PDF inputs.","correct":false,"why":"A prompt-only fix leaves the two near-identical descriptions in place; descriptions are the primary selection mechanism, so selection stays unreliable."},{"id":"b","text":"Rename analyze_content to extract_web_results and rewrite its description to be web-specific (HTML pages and search result snippets), leaving analyze_document scoped to files.","correct":true,"why":"The guide's remedy for functional overlap is to rename the tool and give it a purpose-specific description so the two tools no longer look interchangeable."},{"id":"c","text":"Merge both tools into a single analyze_input tool that inspects the payload and selects the right parser internally.","correct":false,"why":"Consolidation hides a distinction the agent needs and is a larger redesign than a naming and description fix warrants."},{"id":"d","text":"Insert a routing layer that inspects each payload's MIME type and rewrites the tool call before it reaches the MCP server.","correct":false,"why":"This is over-engineered and bypasses the model's tool selection instead of fixing the overlapping descriptions that cause it."}],"explanation":"Ambiguous or overlapping tool descriptions cause misrouting between similar tools. The targeted fix is to eliminate the overlap at its source: rename the tool so the name signals its purpose and rewrite the description so the two tools clearly differ. Prompt rules, consolidation, and routing layers all work around the overlap rather than removing it.","tags":["tool-descriptions","renaming","overlap","misrouting"]},{"id":"N-2.1-03","domain":"D2","task":"2.1","scenario":"S1","type":"single","select":1,"stem":"After you rewrote all four MCP tool descriptions for the support agent with input formats, examples, and boundaries, tool selection on order questions rose to 96% accuracy. However, logs show lookup_order is still called on 58% of account-access requests such as \"I can't log in,\" where no order is involved. The system prompt begins: \"You are an order support specialist. Check the customer's order before helping with anything.\" What is the most likely root cause?","options":[{"id":"a","text":"The lookup_order description still overlaps with get_customer and needs another revision.","correct":false,"why":"Order routing is now 96% accurate, so the descriptions differentiate well; the misuse happens on requests that have nothing to do with orders."},{"id":"b","text":"tool_choice is set to \"any\", forcing the model to call a tool even when none applies.","correct":false,"why":"\"any\" would force some tool call, but it does not explain why lookup_order specifically is chosen on login requests; the prompt wording does."},{"id":"c","text":"The system prompt's instruction to check the customer's order before helping with anything creates a keyword-driven association that overrides the tool descriptions.","correct":true,"why":"Keyword-sensitive system prompt instructions can create unintended tool associations that well-written descriptions cannot counteract."},{"id":"d","text":"The agent has too many tools available, which degrades selection reliability.","correct":false,"why":"Four tools is within the recommended range; tool count is not what drives lookup_order calls on login requests."}],"explanation":"System prompt wording affects tool selection independently of descriptions. An instruction phrased around a keyword (\"check the customer's order before helping with anything\") creates an association that pulls the model toward lookup_order regardless of the request. When descriptions are already good and misuse persists on a specific request type, review the system prompt for keyword-sensitive instructions.","tags":["system-prompt","keyword-sensitive","tool-selection","root-cause"]},{"id":"N-2.1-04","domain":"D2","task":"2.1","scenario":"S3","type":"single","select":1,"stem":"The document analysis subagent exposes one MCP tool, analyze_document, with a mode parameter accepting \"extract\", \"summarize\", or \"verify\". Evaluations show 31% of calls use the wrong mode, verification calls frequently return a summary instead of a supported-or-unsupported judgment, and the synthesis subagent cannot rely on the output shape because all three modes return free-form text. Which redesign does the guide recommend?","options":[{"id":"a","text":"Keep analyze_document and add a lookup table to the subagent's system prompt mapping each research task type to the correct mode value.","correct":false,"why":"A prompt table leaves one generic tool with one undifferentiated output contract; the synthesis subagent still cannot rely on the shape."},{"id":"b","text":"Use forced tool_choice {\"type\": \"tool\", \"name\": \"analyze_document\"} so the model always calls the tool and only has to choose the mode.","correct":false,"why":"Forced selection guarantees that the tool is called, not that the right mode is chosen or that outputs have a stable shape; it is a real mechanism applied to the wrong problem."},{"id":"c","text":"Add a second generic tool, analyze_content, that handles verification while analyze_document keeps the other two modes.","correct":false,"why":"Two generic tools with near-identical descriptions recreate the overlapping-description problem the guide warns about."},{"id":"d","text":"Split analyze_document into extract_data_points, summarize_content, and verify_claim_against_source, each with its own description and a defined input/output contract.","correct":true,"why":"The guide's recommendation for a generic tool doing unrelated jobs is to split it into purpose-specific tools with defined contracts."}],"explanation":"A single generic tool with a mode switch forces the model to make two decisions and gives downstream consumers no stable output contract. Splitting it into purpose-specific tools, each with a clear description and defined input/output contract, makes selection unambiguous and outputs predictable.","tags":["tool-splitting","purpose-specific","output-contract"]},{"id":"N-2.1-05","domain":"D2","task":"2.1","scenario":"S1","type":"single","select":1,"stem":"You are drafting the description for process_refund in the support agent. The model must choose correctly among process_refund, lookup_order, and escalate_to_human. Business rules: refunds above $500 require a human, and the tool needs a verified order ID obtained from lookup_order. Which description best follows the guidance for writing tool descriptions that differentiate similar tools?","options":[{"id":"a","text":"\"Processes a refund for a customer.\"","correct":false,"why":"A minimal description gives no inputs, outputs, or boundaries, which is precisely what leads to unreliable selection among similar tools."},{"id":"b","text":"\"Issues a refund for one order. Input: order_id (format ORD-######, obtained from lookup_order) and amount in USD. Returns a refund confirmation ID. Use only for amounts up to $500; for larger amounts or disputed charges use escalate_to_human. Do not use to check refund status; use lookup_order for that.\"","correct":true,"why":"It states purpose, expected inputs with format, output, and explicit boundaries naming when to use the sibling tools instead."},{"id":"c","text":"\"Processes refunds. Always be polite, confirm the amount with the customer first, and remember the policy: 30-day window, original payment method, exceptions for damaged goods.\"","correct":false,"why":"This mixes conversational guidance and policy into the description but never states the input format, the output, or when to use lookup_order or escalate_to_human instead."},{"id":"d","text":"\"Calls the /v2/refunds endpoint of the billing service with retry on 5xx responses and returns the raw JSON body.\"","correct":false,"why":"Implementation details describe how the tool works internally, not what inputs it expects or when it should be chosen over its siblings."}],"explanation":"A description that supports reliable selection states the tool's purpose, its expected inputs and their formats, what it returns, and the boundaries that say when a similar tool should be used instead. Minimal descriptions, conversational policy text, and implementation details all fail to give the model that differentiation.","tags":["tool-descriptions","differentiation","process-refund"]},{"id":"N-2.1-06","domain":"D2","task":"2.1","scenario":"S4","type":"multi","select":2,"stem":"Your developer productivity agent has two MCP tools: run_tests (\"Runs tests\") and execute_command (\"Runs a command\"). Over two weeks, 35% of test executions went through execute_command with hand-typed pytest invocations, bypassing the coverage collection and result parsing that run_tests provides. The agent still needs execute_command for builds and maintenance scripts. Which TWO changes best address the misrouting? (Select TWO.)","options":[{"id":"a","text":"Expand the run_tests description to state the inputs it accepts (test path, marker filters), give example requests, and say explicitly that test execution should use this tool rather than a shell command.","correct":true,"why":"Input formats, example queries, and an explicit boundary are the description elements that let the model distinguish run_tests from a generic command runner."},{"id":"b","text":"Add \"always run tests before responding\" to the agent's system prompt.","correct":false,"why":"This keyword-sensitive wording creates an association with testing on every request without differentiating the two tools, and can trigger unnecessary runs."},{"id":"c","text":"Rename execute_command to run_build_or_script and give it a description scoped to non-test shell tasks.","correct":true,"why":"Renaming the generic tool and narrowing its description removes the functional overlap that lets test runs slip through it."},{"id":"d","text":"Set tool_choice to {\"type\": \"tool\", \"name\": \"run_tests\"} for the agent.","correct":false,"why":"Forced selection would make every request call run_tests, including builds and scripts; it is a real mechanism aimed at the wrong problem."},{"id":"e","text":"Remove execute_command entirely and add a generic shell fallback inside run_tests.","correct":false,"why":"The agent still needs builds and scripts, and folding shell execution into run_tests turns it back into a generic overlapping tool."},{"id":"f","text":"Add a routing layer that scans each command string for \"pytest\" and redirects the call to run_tests.","correct":false,"why":"This patches the symptom with extra infrastructure instead of fixing the descriptions that cause the overlap."}],"explanation":"Two tools with minimal, overlapping descriptions get confused. The guide's fixes are to enrich the description of the specific tool with inputs, examples, and boundaries, and to rename and re-scope the generic tool so the overlap disappears. Prompt keywords, forced tool_choice, and routing layers do not remove the overlap.","tags":["tool-descriptions","renaming","overlap","run-tests"]},{"id":"N-2.2-01","domain":"D2","task":"2.2","scenario":"S1","type":"single","select":1,"stem":"A customer requests an $840 refund. Logs show process_refund returned isError: true with the text \"Error: permission denied,\" and the support agent retried the identical call three more times, adding 14 seconds before telling the customer to try again later. In your backend, refunds above $500 require supervisor approval. Which change to the tool response most effectively prevents the wasted retries?","options":[{"id":"a","text":"Return structured metadata with the error: errorCategory \"permission\", isRetryable false, and a description stating that refunds above $500 need supervisor approval through escalate_to_human.","correct":true,"why":"Structured metadata tells the agent the error is non-retryable and what to do instead, which is how the guide prevents wasted retry attempts."},{"id":"b","text":"Add \"never retry a failed refund\" to the system prompt.","correct":false,"why":"This is prompt-only and over-broad: transient failures of process_refund should be retried, and the agent still would not know to escalate."},{"id":"c","text":"Configure the agentic loop to allow at most one call per tool per turn.","correct":false,"why":"A mechanical cap blocks legitimate retries of transient errors and gives the agent no information about why the call failed."},{"id":"d","text":"Have process_refund return a successful result with an empty confirmation whenever the amount exceeds $500.","correct":false,"why":"Reporting a failure as success hides the problem; the agent may tell the customer the refund went through."}],"explanation":"Retryable and non-retryable errors need to be distinguishable from the tool response itself. A permission error with isRetryable false and a human-readable next step lets the agent stop retrying and escalate, whereas a bare error string forces it to guess.","tags":["error-metadata","isRetryable","permission-error","retries"]},{"id":"N-2.2-02","domain":"D2","task":"2.2","scenario":"S3","type":"multi","select":2,"stem":"You are classifying failures observed in the web search subagent so its MCP tools can return accurate errorCategory and isRetryable values. Over one week the search tool logged the outcomes listed below. Which TWO outcomes are transient errors that the subagent should retry locally before involving the coordinator? (Select TWO.)","options":[{"id":"a","text":"The search API returned HTTP 503 Service Unavailable during a provider incident.","correct":true,"why":"Service unavailability is a transient error; the same request can succeed once the provider recovers."},{"id":"b","text":"The query string exceeded the API's 512-character limit.","correct":false,"why":"This is a validation error; repeating the identical request fails every time until the input is changed."},{"id":"c","text":"The request timed out after 30 seconds with no response.","correct":true,"why":"Timeouts are transient errors and are a reasonable candidate for a local retry."},{"id":"d","text":"The API key lacks the scope required for the news archive endpoint.","correct":false,"why":"This is a permission error; retrying cannot grant the missing scope and the issue must be escalated or reconfigured."},{"id":"e","text":"The target domain is on the organization's blocked-source list.","correct":false,"why":"This is a business or policy error; the outcome will not change on retry and the agent should explain or route around it."},{"id":"f","text":"The query executed successfully and matched zero documents.","correct":false,"why":"A successful query with no matches is a valid empty result, not an error, and should not be retried."}],"explanation":"The error taxonomy separates transient errors (timeouts, service unavailability) from validation errors (bad input), business errors (policy), and permission errors. Only transient errors justify retrying the same request. A successful query with no matches is not an error at all.","tags":["error-taxonomy","transient","validation","permission"]},{"id":"N-2.2-03","domain":"D2","task":"2.2","scenario":"S1","type":"single","select":1,"stem":"Your lookup_order MCP tool currently throws an unhandled exception when the order service times out. The MCP server logs the crash, the SDK receives a protocol-level failure, and the support agent's turn ends with no response to the customer. You want the agent to see the failure and decide what to do, such as retrying or telling the customer there is a delay. Which change follows the MCP pattern for communicating tool failures?","options":[{"id":"a","text":"Catch the exception and return a normal result whose text is \"No order found.\"","correct":false,"why":"This reports an access failure as a valid empty result, so the agent will tell the customer the order does not exist."},{"id":"b","text":"Set an isRetryable property on the tool's input schema so the SDK retries automatically before surfacing anything.","correct":false,"why":"There is no such input-schema property; retry metadata belongs in the error response the agent receives."},{"id":"c","text":"Catch the exception and return a tool result with isError set to true and content describing the timeout, so the failure reaches the agent as a result it can reason about.","correct":true,"why":"The isError flag is the MCP mechanism for returning a failure to the agent as a tool result instead of a crash."},{"id":"d","text":"Let the exception propagate and configure the agentic loop to restart the conversation from the last user message.","correct":false,"why":"Restarting discards context and the agent never learns what failed, so it cannot make a recovery decision."}],"explanation":"MCP tools communicate failures by returning a result flagged with isError and content describing the problem. That keeps the failure inside the agent's loop where it can retry, explain, or escalate. Crashing the handler or disguising the failure as an empty result both remove the agent's ability to respond appropriately.","tags":["isError","mcp","tool-failure","lookup-order"]},{"id":"N-2.2-04","domain":"D2","task":"2.2","scenario":"S3","type":"multi","select":3,"stem":"The document analysis subagent processes a batch of six documents per assignment. When the fetch for the fourth document times out, it currently aborts and returns \"analysis failed\" to the coordinator, which restarts the entire assignment; a single timeout roughly doubles cost. Which THREE behaviors should the subagent implement instead, following the guide's error recovery guidance? (Select THREE.)","options":[{"id":"a","text":"Retry the timed-out fetch locally with backoff, since a timeout is a transient error.","correct":true,"why":"Transient failures should be recovered locally inside the subagent before anything is propagated."},{"id":"b","text":"Propagate the first timeout to the coordinator immediately with full context so it can choose a recovery strategy.","correct":false,"why":"This escalates before attempting local recovery; only errors that cannot be resolved locally should reach the coordinator."},{"id":"c","text":"Continue analyzing the remaining documents so the assignment yields partial results rather than nothing.","correct":true,"why":"Continuing with the rest of the batch preserves the work already possible and produces partial results to hand back."},{"id":"d","text":"Record the failed document as an empty analysis marked successful so the coordinator sees six completed items.","correct":false,"why":"Marking a failure as success hides a coverage gap and prevents the coordinator from deciding how to handle it."},{"id":"e","text":"If retries are exhausted, return the five completed analyses together with a structured note of what was attempted and why the fourth failed.","correct":true,"why":"Unresolved errors are propagated with partial results and a record of what was tried, which is the guide's propagation pattern."},{"id":"f","text":"Restart the whole six-document assignment from scratch inside the subagent whenever any error occurs.","correct":false,"why":"This moves the same waste inside the subagent instead of retrying only the failed step."}],"explanation":"Subagents should recover transient failures locally, keep working on what they can, and propagate to the coordinator only what could not be resolved, together with partial results and what was attempted. Escalating immediately, masking the failure, or restarting everything all waste work or hide information.","tags":["local-recovery","partial-results","propagation","subagent"]},{"id":"N-2.2-05","domain":"D2","task":"2.2","scenario":"S1","type":"single","select":1,"stem":"A customer asks the support agent to refund a final-sale item. process_refund returns isError: true with the content \"BUSINESS_RULE_VIOLATION 4012\". Transcripts show the agent replying \"Something went wrong on our end, please try again later,\" then calling process_refund twice more for the same order. Which change to the tool response best fixes both the wasted retries and the misleading customer message?","options":[{"id":"a","text":"Keep the numeric code and add a table to the system prompt mapping each code to a customer message and a retry rule.","correct":false,"why":"This moves the tool's responsibility into a prompt lookup that drifts out of sync with the backend; the tool should return the explanation itself."},{"id":"b","text":"Return errorCategory \"validation\" with isRetryable false so the agent stops retrying.","correct":false,"why":"The category is wrong (the input was valid; policy blocked it), the agent may try reformatting the request, and there is still no customer-facing explanation."},{"id":"c","text":"Have process_refund call escalate_to_human internally whenever a business rule blocks the refund.","correct":false,"why":"Escalation is the agent's decision; hiding it inside the tool removes the option of offering an alternative such as store credit."},{"id":"d","text":"Return a retriable: false flag with a customer-friendly explanation such as \"Final-sale items are not eligible for refunds; store credit may be offered instead.\"","correct":true,"why":"The guide's pattern for business rule violations is a non-retriable flag plus an explanation the agent can relay to the customer."}],"explanation":"Business rule violations are not retryable and need to be explained to the customer. Returning retriable: false together with a customer-friendly explanation lets the agent stop retrying and communicate the policy accurately, rather than blaming a system error.","tags":["business-error","retriable-false","customer-explanation"]},{"id":"N-2.2-06","domain":"D2","task":"2.2","scenario":"S3","type":"single","select":1,"stem":"In 8% of research runs, the final report states that no literature exists on the topic. Investigation shows the web search MCP tool returns {\"results\": []} both when a query genuinely matches nothing and when the search provider rejects the request because of an expired key or throttling. The coordinator treats both cases identically and moves on. Which change best resolves the problem?","options":[{"id":"a","text":"Have the coordinator treat every empty result as a failure and re-run the query up to three times.","correct":false,"why":"This wastes retries on genuine empty results and cannot fix an expired key; the coordinator still cannot tell the cases apart."},{"id":"b","text":"Return provider rejections as errors with isError true and an errorCategory (permission or transient), and reserve the empty results array for successful queries that matched nothing.","correct":true,"why":"Separating access failures from valid empty results gives the coordinator the retry-or-escalate decision it needs while preserving genuine no-match answers."},{"id":"c","text":"Add \"if you receive no results, rephrase the query and search again\" to the web search subagent's prompt.","correct":false,"why":"Rephrasing cannot fix an authentication or throttling failure, and the response still does not distinguish the two cases."},{"id":"d","text":"Include a count field in every response so the agent can see that zero results were returned.","correct":false,"why":"A count of zero is identical for an access failure and a real no-match query, so nothing is disambiguated."}],"explanation":"An access failure needs a retry or escalation decision, while a valid empty result is a successful query with no matches. Encoding both as an empty array hides the difference; access failures should be returned as errors with a category, and empty results reserved for genuine no-match queries.","tags":["empty-result","access-failure","isError","web-search"]},{"id":"N-2.2-07","domain":"D2","task":"2.2","scenario":"S1","type":"multi","select":3,"stem":"Today get_customer, lookup_order, process_refund, and escalate_to_human all report every failure the same way: isError true with the text \"Operation failed.\" Transcripts show the support agent retrying permission denials, apologizing for policy rejections as if they were outages, and giving up on timeouts that a second attempt would have resolved. You are replacing the uniform response with a shared error contract. Which THREE elements should every error response include so the agent can make the right recovery decision? (Select THREE.)","options":[{"id":"a","text":"An errorCategory value such as transient, validation, or permission.","correct":true,"why":"The category tells the agent what kind of failure occurred and therefore which recovery path applies."},{"id":"b","text":"The raw backend stack trace, so the agent can diagnose the failure itself.","correct":false,"why":"Stack traces are noise for the agent, leak internals, and do not state whether retrying could help."},{"id":"c","text":"An isRetryable boolean stating whether repeating the same call could succeed.","correct":true,"why":"The retryable flag is what stops the agent from wasting attempts on errors that cannot change."},{"id":"d","text":"A retryAfterTurns integer that the Agent SDK loop enforces automatically.","correct":false,"why":"No such SDK-enforced field exists; retry decisions are made by the agent from the metadata it receives."},{"id":"e","text":"A human-readable description of what went wrong that the agent can act on or relay.","correct":true,"why":"A readable description lets the agent explain the outcome to the customer or choose a sensible next step."},{"id":"f","text":"Only an HTTP-style numeric status code, with meanings documented in the system prompt.","correct":false,"why":"An opaque code is a uniform error response in disguise; the agent has to guess and the prompt lookup drifts from the backend."}],"explanation":"A uniform error response such as a generic \"Operation failed\" gives the agent no basis for choosing between retrying, explaining, and escalating. Structured error responses carry an errorCategory, an isRetryable boolean, and a human-readable description, and together these make the recovery decision possible. Stack traces and bare status codes give the agent nothing to act on, and the SDK does not enforce retry timing on the agent's behalf.","tags":["error-contract","uniform-errors","errorCategory","isRetryable","description"]},{"id":"N-2.3-01","domain":"D2","task":"2.3","scenario":"S3","type":"single","select":1,"stem":"To give the coordinator \"more flexibility,\" your team added 13 tools to it, bringing its total to 18. Each new tool has a detailed description with no functional overlap with the others. Evaluations run before and after the change show the coordinator's tool-selection accuracy fell from 94% to 71%, and it now frequently calls a document parsing tool itself when it should delegate to the document analysis subagent. What is the most likely root cause?","options":[{"id":"a","text":"The new tool descriptions overlap with the existing ones and need to be differentiated.","correct":false,"why":"The descriptions were written without overlap; the accuracy change tracks the tool count, not description quality."},{"id":"b","text":"tool_choice defaults to \"auto\", which lets the model skip tools it should call.","correct":false,"why":"\"auto\" was already in effect before the change and does not explain the coordinator choosing the wrong tool."},{"id":"c","text":"The 13 additional tool schemas consumed so much context that the coordinator lost track of its instructions.","correct":false,"why":"Tool schemas are small relative to the context window; the guide attributes the degradation to decision complexity, not context exhaustion."},{"id":"d","text":"Giving an agent 18 tools instead of 4-5 raises decision complexity, which degrades selection reliability even when descriptions are good.","correct":true,"why":"The guide states that too many tools degrade tool selection reliability by increasing decision complexity."}],"explanation":"Tool selection reliability degrades as the number of available tools grows, because every decision has more candidates to weigh. Well-written descriptions do not compensate. Agents should receive only the handful of tools their role requires.","tags":["too-many-tools","decision-complexity","coordinator"]},{"id":"N-2.3-02","domain":"D2","task":"2.3","scenario":"S3","type":"single","select":1,"stem":"The synthesis subagent was given the search_web tool \"in case it needs more context.\" Traces from 200 runs show it spends 40% of its turns issuing new searches on tangents, its output cites sources the web search subagent never vetted, and reports increasingly diverge from the findings the coordinator passed in. The coordinator already handles requests for additional research. What is the most effective fix?","options":[{"id":"a","text":"Remove search_web from the synthesis subagent's tool set so it works from the findings it receives, routing any need for more research back through the coordinator.","correct":true,"why":"Agents with tools outside their specialization tend to misuse them; restricting the synthesis subagent to its role's tools removes the misuse at its source."},{"id":"b","text":"Add \"only search when strictly necessary\" to the synthesis subagent's system prompt.","correct":false,"why":"A prompt caveat leaves the out-of-role tool available, and the tendency to misuse it is exactly what the guide warns about."},{"id":"c","text":"Also give the synthesis subagent the document analysis tools so it can validate the sources it finds.","correct":false,"why":"Adding more out-of-role tools increases both the misuse and the decision complexity."},{"id":"d","text":"Lower the synthesis subagent's maximum turn count so it has fewer opportunities to search.","correct":false,"why":"A turn cap also cuts legitimate synthesis work and does not address why the agent searches at all."}],"explanation":"A synthesis agent holding a web search tool tends to use it, drifting away from the vetted findings it was given. The guide's answer is scoped tool access: restrict each subagent to the tools its role needs and route other needs through the coordinator.","tags":["scoped-tools","synthesis-agent","cross-specialization"]},{"id":"N-2.3-03","domain":"D2","task":"2.3","scenario":"S3","type":"single","select":1,"stem":"The document analysis subagent has a generic fetch_url tool. An audit of 1,000 calls found that 22% fetched search-result pages, login screens, or navigation-heavy HTML that produced no usable findings, and two calls retrieved internal admin pages. The subagent's job is to analyze papers, reports, and PDFs from approved repositories. Which change does the guide recommend?","options":[{"id":"a","text":"Add rules to the subagent's prompt listing the approved repositories and forbidden URL paths.","correct":false,"why":"Prompt rules are advisory; the generic tool still accepts any URL, so the same fetches remain possible."},{"id":"b","text":"Add a PostToolUse hook that strips navigation HTML from fetch_url results before the model sees them.","correct":false,"why":"Cleaning the output treats the symptom; it neither prevents wasted fetches nor blocks admin pages."},{"id":"c","text":"Replace fetch_url with a constrained load_document tool that validates the URL is a document from an approved source and returns parsed document text.","correct":true,"why":"Replacing a generic tool with a constrained alternative that validates its input is the guide's named remedy."},{"id":"d","text":"Move fetch_url to the coordinator and have the subagent request every document through it.","correct":false,"why":"The generic tool keeps the same problems at the coordinator level and adds a round trip for every document."}],"explanation":"A generic tool invites misuse that no prompt can fully prevent. Replacing it with a purpose-built, constrained alternative that validates its input (load_document instead of fetch_url) removes the failure modes structurally rather than relying on the model to avoid them.","tags":["constrained-tools","fetch-url","load-document"]},{"id":"N-2.3-04","domain":"D2","task":"2.3","scenario":"S6","type":"single","select":1,"stem":"Your extraction pipeline defines classify_document plus four extraction tools (extract_invoice, extract_contract, extract_receipt, extract_statement). Classification must happen first because it determines which extraction schema applies. With tool_choice set to \"any\", 18% of first-turn responses call an extraction tool directly and choose the wrong schema. Which change guarantees that classification runs first?","options":[{"id":"a","text":"Keep \"any\" but list classify_document first in the tools array.","correct":false,"why":"Order in the tools array does not constrain selection; \"any\" still lets the model pick any tool."},{"id":"b","text":"Set tool_choice to {\"type\": \"tool\", \"name\": \"classify_document\"} on the first request, then return the classification result and use \"auto\" or \"any\" in the follow-up turn for extraction.","correct":true,"why":"Forced tool selection guarantees the named tool is called first; subsequent steps are processed in follow-up turns with a different tool_choice."},{"id":"c","text":"Set tool_choice to {\"type\": \"required\", \"name\": \"classify_document\"}.","correct":false,"why":"This is not a valid tool_choice form; forced selection uses type \"tool\" with the tool's name."},{"id":"d","text":"Switch to \"auto\" and add \"always classify before extracting\" to the system prompt.","correct":false,"why":"This is probabilistic, and \"auto\" additionally allows the model to answer with text and call no tool at all."}],"explanation":"When one tool must run before others, forced tool selection with {\"type\": \"tool\", \"name\": \"...\"} guarantees it on that request. The result is then fed back and later steps use a less restrictive tool_choice in follow-up turns. \"any\" only guarantees that some tool is called.","tags":["tool-choice","forced-selection","classification-first"]},{"id":"N-2.3-05","domain":"D2","task":"2.3","scenario":"S1","type":"single","select":1,"stem":"Before the support agent handles a message, a separate intake request must produce a structured result by calling one of three tools: classify_intent, flag_abuse, or request_clarification. In 9% of intake calls the model instead replies with conversational text such as \"Sure, I can help with that,\" which breaks the downstream parser because no tool_use block is present. Which tool_choice setting fixes this while still letting the model pick the appropriate intake tool?","options":[{"id":"a","text":"tool_choice: \"auto\", with the system prompt stating that a tool must always be called.","correct":false,"why":"\"auto\" permits a text-only response, and the prompt instruction is exactly the probabilistic behavior that is failing 9% of the time."},{"id":"b","text":"tool_choice: {\"type\": \"tool\", \"name\": \"classify_intent\"}","correct":false,"why":"Forced selection would call classify_intent every time, so flag_abuse and request_clarification could never be chosen."},{"id":"c","text":"tool_choice: \"required\"","correct":false,"why":"\"required\" is not one of the tool_choice modes; the options are \"auto\", \"any\", and forced selection of a named tool."},{"id":"d","text":"tool_choice: \"any\"","correct":true,"why":"\"any\" guarantees the model calls a tool rather than returning text, while leaving the choice of which tool to the model."}],"explanation":"tool_choice \"any\" guarantees a tool call without dictating which tool, which is the right setting when the model must choose among several tools but must never answer with plain text. Forced selection names one tool, and \"auto\" allows text responses.","tags":["tool-choice","any","structured-intake"]},{"id":"N-2.3-07","domain":"D2","task":"2.3","scenario":"S6","type":"multi","select":2,"stem":"A teammate is configuring tool_choice for the extraction service, which defines several extraction tools, and has written notes on how each mode behaves. You are reviewing the notes before the settings go to production. Which TWO statements about tool_choice are accurate? (Select TWO.)","options":[{"id":"a","text":"With \"auto\", the model decides whether to call a tool or respond with text.","correct":true,"why":"\"auto\" leaves the decision to the model, which is why it cannot guarantee structured output."},{"id":"b","text":"With \"any\", the model must call some tool, but it chooses which of the defined tools to call.","correct":true,"why":"\"any\" guarantees a tool call without naming the tool; that is the distinction from forced selection."},{"id":"c","text":"Forced selection with {\"type\": \"tool\", \"name\": \"...\"} stays in effect for every later turn of the conversation until it is changed.","correct":false,"why":"tool_choice is set per request; subsequent steps are handled in follow-up turns with whatever tool_choice those requests specify."},{"id":"d","text":"Setting \"any\" causes the model to call every defined tool once.","correct":false,"why":"\"any\" requires that a tool be called; it does not enumerate all tools."},{"id":"e","text":"Forced selection also enables stricter validation of the tool's input against its JSON schema.","correct":false,"why":"Forced selection controls which tool is called; it does not change how inputs are validated."},{"id":"f","text":"\"auto\" is mandatory whenever more than one tool is defined.","correct":false,"why":"\"any\" and forced selection are both valid with multiple tools defined."}],"explanation":"The three tool_choice modes are \"auto\" (model decides whether to use a tool), \"any\" (a tool must be called, model picks which), and forced selection of a named tool. Each applies to the request it is sent with; multi-step sequences are handled across follow-up turns.","tags":["tool-choice","auto","any","forced"]},{"id":"N-2.4-01","domain":"D2","task":"2.4","scenario":"S2","type":"single","select":1,"stem":"A developer on your team is prototyping an MCP server that wraps a personal note-taking app. After they added it to the repository's .mcp.json and pushed, three teammates reported Claude Code startup errors because the server's binary is not installed on their machines, and one asked why unfamiliar note tools appeared in their sessions. Where should this server be configured?","options":[{"id":"a","text":"In the project .mcp.json, with the entry marked \"scope\": \"user\" so only the author loads it.","correct":false,"why":"There is no per-entry scope flag; .mcp.json is project-scoped and applies to everyone who has the repository."},{"id":"b","text":"In the developer's user-scoped ~/.claude.json, which is not committed and applies only to their own sessions.","correct":true,"why":"Personal and experimental servers belong in the user-scoped ~/.claude.json, which never enters the repository."},{"id":"c","text":"In the project's CLAUDE.md, describing the server so Claude loads it only when relevant.","correct":false,"why":"CLAUDE.md holds instructions and context; it is not a mechanism for configuring MCP servers."},{"id":"d","text":"In the project .mcp.json, with a README note asking teammates to delete the entry locally after pulling.","correct":false,"why":"This keeps a personal server in the shared scope and every pull reintroduces the problem."}],"explanation":"Project-scoped .mcp.json is for tooling the whole team shares. Personal or experimental servers belong in the user-scoped ~/.claude.json so they load only for that developer and never reach the repository.","tags":["mcp-scope","user-scope","claude-json"]},{"id":"N-2.4-02","domain":"D2","task":"2.4","scenario":"S4","type":"single","select":1,"stem":"Security review flagged your project's committed .mcp.json because the Jira server entry contains \"env\": {\"JIRA_API_TOKEN\": \"atl-9f3...\"}, a live credential. The developer productivity agent depends on this server for issue lookups, and it must remain available to every engineer who clones the repository. Which change satisfies both the security finding and the sharing requirement?","options":[{"id":"a","text":"Move the Jira server entry to each engineer's ~/.claude.json so the token never enters the repository.","correct":false,"why":"This removes the shared configuration the team depends on; every engineer would have to maintain their own copy."},{"id":"b","text":"Encrypt the token value inside .mcp.json and have Claude Code prompt for a passphrase at startup.","correct":false,"why":"No such encryption or passphrase mechanism exists for .mcp.json."},{"id":"c","text":"Replace the literal value with \"${JIRA_API_TOKEN}\" in .mcp.json and have each engineer set that variable in their environment.","correct":true,"why":"Environment variable expansion keeps the shared server definition in the repository while the secret stays out of it."},{"id":"d","text":"Keep the token in .mcp.json but add the file to .gitignore.","correct":false,"why":"Ignoring the file means the server configuration is no longer shared, defeating the requirement."}],"explanation":"The project-scoped .mcp.json should reference credentials through environment variable expansion such as ${GITHUB_TOKEN} or ${JIRA_API_TOKEN}. The server definition stays shared and version-controlled while each engineer supplies the secret locally.","tags":["mcp-json","env-expansion","credentials"]},{"id":"N-2.4-03","domain":"D2","task":"2.4","scenario":"S4","type":"multi","select":2,"stem":"Your project's .mcp.json defines a GitHub MCP server for the whole team. One engineer has also configured a personal profiling MCP server in ~/.claude.json. They ask whether the developer productivity agent can use tools from both servers in the same session, or whether they must switch between servers. Which TWO statements are correct? (Select TWO.)","options":[{"id":"a","text":"Tools from both servers are discovered when Claude connects to them and are available simultaneously in the session.","correct":true,"why":"Tools from all configured MCP servers are discovered at connection time and are available at the same time."},{"id":"b","text":"Only the project-scoped server loads while working inside a repository; user-scoped servers are ignored there.","correct":false,"why":"User-scoped and project-scoped servers load together; neither scope suppresses the other."},{"id":"c","text":"The personal server does not appear for teammates because ~/.claude.json is user-scoped and not part of the repository.","correct":true,"why":"User-scoped configuration lives outside the repository and applies only to that developer's sessions."},{"id":"d","text":"The engineer must run a switch command to activate one server at a time.","correct":false,"why":"There is no active-server switching; all configured servers are connected and their tools are available together."},{"id":"e",
