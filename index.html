"text":"The user-scoped server replaces the project's servers for that engineer.","correct":false,"why":"Scopes are additive; a personal server does not override or replace the project's shared servers."},{"id":"f","text":"The project .mcp.json must also list the personal server before its tools can load.","correct":false,"why":"A user-scoped server loads from ~/.claude.json on its own; listing it in the project file would make it shared."}],"explanation":"All configured MCP servers, whether project-scoped in .mcp.json or user-scoped in ~/.claude.json, are connected and their tools discovered together, so the agent can use tools from every server in one session. User scope keeps a personal server private to that developer.","tags":["mcp-discovery","simultaneous","mcp-scope"]},{"id":"N-2.4-04","domain":"D2","task":"2.4","scenario":"S4","type":"single","select":1,"stem":"Your team built an MCP server exposing semantic_search, which indexes the codebase and answers conceptual queries such as \"where is authorization enforced?\" across languages. Its description reads \"Search code.\" Traces show the developer productivity agent uses the built-in Grep for 91% of such questions and returns literal string matches that miss the relevant modules. What is the most likely reason the agent prefers Grep?","options":[{"id":"a","text":"The MCP tool's description does not explain its capabilities or outputs, so the well-understood Grep looks like the better match for any code search.","correct":true,"why":"Underspecified MCP tool descriptions cause the agent to prefer built-in tools; enriching the description is the guide's fix."},{"id":"b","text":"Built-in tools always take precedence over MCP tools when both could apply.","correct":false,"why":"There is no precedence rule; selection is driven by how well each tool's description matches the task."},{"id":"c","text":"Grep appears earlier in the tool list, and the model favors tools listed first.","correct":false,"why":"Tool ordering is not a selection mechanism; descriptions are."},{"id":"d","text":"MCP server tools are only consulted after a built-in tool has failed.","correct":false,"why":"MCP tools are discovered at connection time and available alongside built-in tools from the start."}],"explanation":"When an MCP tool's description is minimal, the agent cannot see why it would beat a familiar built-in tool like Grep. The remedy is to describe the MCP tool's capabilities and outputs in detail so it is clearly the better match for the queries it was built for.","tags":["mcp-descriptions","grep","tool-preference"]},{"id":"N-2.4-05","domain":"D2","task":"2.4","scenario":"S4","type":"multi","select":2,"stem":"Your developer productivity agent needs two new integrations: GitHub (issues, pull requests, and reviews) and an internal feature-flag rollout service used only inside your organization. An engineer proposes writing custom MCP servers for both so that tool names match the team's vocabulary. Which TWO decisions follow the guidance on choosing between community and custom MCP servers? (Select TWO.)","options":[{"id":"a","text":"Use an existing community MCP server for GitHub.","correct":true,"why":"GitHub is a standard integration, and the guide prefers existing community servers for standard integrations."},{"id":"b","text":"Build a custom GitHub server so that the tool names match the team's vocabulary.","correct":false,"why":"Reimplementing a standard integration for naming preferences is the reinvention the guide steers away from."},{"id":"c","text":"Build a custom MCP server for the feature-flag rollout service.","correct":true,"why":"Custom servers are reserved for team-specific workflows, which an internal-only service is."},{"id":"d","text":"Search for a community server for the feature-flag service and defer the integration until one is published.","correct":false,"why":"An internal-only service will never have a community server; this is exactly the case for a custom implementation."},{"id":"e","text":"Build one custom server that exposes both GitHub and feature-flag tools so the configuration has a single entry.","correct":false,"why":"This reimplements the standard GitHub integration and couples it to internal tooling; multiple servers can be configured side by side."},{"id":"f","text":"Skip MCP for the flag service and have the agent call its REST API through Bash with curl.","correct":false,"why":"Ad hoc shell calls give the agent no tool description or contract, which is what an MCP tool exists to provide."}],"explanation":"Standard integrations such as GitHub or Jira should use existing community MCP servers; custom servers are reserved for workflows specific to the team. Multiple servers can coexist, so there is no need to merge them or defer an internal integration.","tags":["community-servers","custom-servers","github"]},{"id":"N-2.4-06","domain":"D2","task":"2.4","scenario":"S3","type":"single","select":1,"stem":"At the start of every research run, the document analysis subagent calls list_collections, then list_documents for each of 14 collections, spending roughly 30 tool calls and 4,000 tokens before it analyzes anything. The collection contents change only weekly. Which MCP mechanism does the guide recommend for giving the agent this visibility without the exploratory calls?","options":[{"id":"a","text":"Consolidate the listing calls into a single list_everything tool.","correct":false,"why":"This still costs an exploratory tool call on every run and returns one large payload the agent must page through."},{"id":"b","text":"Paste the current catalog into the subagent's system prompt and update it by hand each week.","correct":false,"why":"A hand-maintained prompt goes stale and is not an MCP mechanism for exposing content."},{"id":"c","text":"Use Glob to enumerate the collections by path pattern.","correct":false,"why":"Glob matches file paths on a filesystem; it cannot enumerate an MCP server's document collections."},{"id":"d","text":"Expose the collections and their document summaries as MCP resources so the agent can see what is available without calling tools to discover it.","correct":true,"why":"MCP resources exist to expose content catalogs and reduce exploratory tool calls."}],"explanation":"MCP resources expose content catalogs such as document hierarchies, issue summaries, or database schemas so an agent can see what data exists without spending tool calls to discover it. Tools remain for actions; resources describe available content.","tags":["mcp-resources","content-catalog","exploratory-calls"]},{"id":"N-2.4-07","domain":"D2","task":"2.4","scenario":"S4","type":"multi","select":3,"stem":"You are designing the MCP server for your developer productivity agent and deciding which capabilities to expose as resources and which as tools. Early sessions show the agent spending its first several turns calling discovery tools to learn what issues, docs, and tables exist. Which THREE capabilities are appropriate to expose as MCP resources rather than tools? (Select THREE.)","options":[{"id":"a","text":"A summary list of open issues in the tracker, with IDs and titles.","correct":true,"why":"Issue summaries are a content catalog, which is what resources are for."},{"id":"b","text":"Creating a new issue in the tracker.","correct":false,"why":"Creating an issue is an action with side effects, which belongs in a tool."},{"id":"c","text":"The documentation hierarchy for the internal platform.","correct":true,"why":"A documentation hierarchy is a catalog of available content that the agent can browse without exploratory calls."},{"id":"d","text":"Running a database migration against the staging environment.","correct":false,"why":"A migration is an action that changes state; it must be a tool, not a resource."},{"id":"e","text":"The schema of the analytics database, listing tables and columns.","correct":true,"why":"A database schema is a catalog the guide names explicitly as a resource candidate."},{"id":"f","text":"Posting a review comment on a pull request.","correct":false,"why":"Posting a comment is an action, so it is exposed as a tool."}],"explanation":"MCP resources expose content catalogs (issue summaries, documentation hierarchies, database schemas) so the agent knows what exists without exploratory calls. Anything that performs an action or changes state is exposed as a tool.","tags":["mcp-resources","resources-vs-tools","content-catalog"]},{"id":"N-2.5-01","domain":"D2","task":"2.5","scenario":"S4","type":"single","select":1,"stem":"An engineer asks the developer productivity agent to list every Cypress end-to-end spec in the repository so they can estimate migration effort. Specs are identified by the .cy.ts suffix and live in several directories. The agent ran Grep for \"describe(\" and returned 300 files, most of them unit tests. Which tool selection answers the request correctly?","options":[{"id":"a","text":"Grep for \"cy.visit(\" and treat every matching file as a spec.","correct":false,"why":"This is another content search; it misses specs that never call cy.visit and includes helper files that do."},{"id":"b","text":"Read each directory that might contain tests and inspect the listing.","correct":false,"why":"Read loads file contents; it is not a way to search for paths across the repository."},{"id":"c","text":"Glob with the pattern **/*.cy.ts.","correct":true,"why":"Glob matches file paths by name or extension pattern, which is exactly what identifying files by suffix requires."},{"id":"d","text":"Grep with the pattern \"\\.cy\\.ts$\" so only file names ending in the suffix are matched.","correct":false,"why":"Grep searches file contents for the pattern, not file names, so it would find only files that mention the suffix in their text."}],"explanation":"Glob is for finding files by path or name pattern, such as **/*.cy.ts; Grep is for searching file contents. A request defined by a file suffix is a path-pattern problem, so Glob is the right tool.","tags":["glob","grep","file-patterns"]},{"id":"N-2.5-02","domain":"D2","task":"2.5","scenario":"S2","type":"single","select":1,"stem":"A user report quotes the message \"Payment gateway unavailable, please retry.\" An engineer asks Claude Code where that message originates. Claude runs Glob for src/payments/**/*.ts, then Reads all 28 matching files, consuming about 60,000 tokens, and still misses the source because the string is defined in a shared errors module elsewhere in the repository. What should the first step have been?","options":[{"id":"a","text":"Grep the codebase for the literal string \"Payment gateway unavailable\" to locate its definition and the code that references it.","correct":true,"why":"Grep is the content-search tool; a known literal error message is found directly wherever it lives."},{"id":"b","text":"Glob for **/*unavailable* to find files whose names mention the message.","correct":false,"why":"Glob matches paths, and file names are unlikely to contain the error text."},{"id":"c","text":"Read the application's main entry file and follow imports until the message appears.","correct":false,"why":"Following imports is for tracing flows; for a known literal string, a content search is direct and cheap."},{"id":"d","text":"Run the application under Bash to reproduce the error and capture a stack trace.","correct":false,"why":"Reproducing the failure is slow and may not succeed, when the string can be located immediately by searching contents."}],"explanation":"Grep searches file contents for patterns such as error messages, function names, or import statements. When the target is a known literal string, Grep locates it in one step regardless of directory, whereas Glob only matches paths and bulk reading wastes context.","tags":["grep","error-message","content-search"]},{"id":"N-2.5-03","domain":"D2","task":"2.5","scenario":"S2","type":"single","select":1,"stem":"Claude Code was asked to change a single timeout constant in a 1,200-line service file. It Read the file and then used Write to emit the whole file with the new value; the resulting diff shows the constant changed but 40 lines near the end of the file were dropped. The constant's declaration line appears exactly once in the file. Which tool usage should have been applied?","options":[{"id":"a","text":"Read the file, then Write it again with an added instruction to preserve every line.","correct":false,"why":"This repeats the full-file rewrite that caused the loss; Write is for full file operations, not a one-line change."},{"id":"b","text":"Grep for the constant, then Write only the changed line to the file.","correct":false,"why":"Write replaces the entire file, so the file would contain only that single line."},{"id":"c","text":"Split the file into smaller modules first so each Write carries less content.","correct":false,"why":"Restructuring the codebase to make a one-line edit safer is over-engineered when a targeted tool exists."},{"id":"d","text":"Use Edit with the unique declaration line as the anchor text so only that line changes.","correct":true,"why":"Edit performs targeted modifications by matching unique text, leaving the rest of the file untouched."}],"explanation":"Read and Write are for full-file operations; Edit is for targeted modifications that match unique text. A one-line change in a large file with a unique anchor is exactly Edit's case, and rewriting the whole file risks silently dropping content.","tags":["edit","write","targeted-modification"]},{"id":"N-2.5-04","domain":"D2","task":"2.5","scenario":"S4","type":"multi","select":2,"stem":"The developer productivity agent attempts to change retries: 3 to retries: 5 in one service block of a deployment YAML file. Edit fails, reporting that retries: 3 appears in three places. The engineer needs only the payments service block updated; the other two services must keep their current value. Which TWO responses are consistent with the guidance on built-in tools? (Select TWO.)","options":[{"id":"a","text":"Read the full file, then Write the complete contents with only the payments block changed.","correct":true,"why":"Read followed by Write is the guide's fallback when Edit cannot find unique anchor text."},{"id":"b","text":"Retry the identical Edit call, because the failure is transient.","correct":false,"why":"A non-unique match is deterministic; the same call fails the same way every time."},{"id":"c","text":"Retry Edit with anchor text that includes surrounding unique lines, such as the payments service name together with its retries line.","correct":true,"why":"Edit works on unique text matching; widening the anchor so it is unique satisfies that requirement without rewriting the file."},{"id":"d","text":"Use Bash sed to replace every occurrence of retries: 3 with retries: 5.","correct":false,"why":"A global replacement changes all three services, violating the requirement."},{"id":"e","text":"Write a file containing only the corrected payments block.","correct":false,"why":"Write overwrites the whole file, so the other two services' configuration would be lost."},{"id":"f","text":"Use Glob to locate the file again before repeating the same Edit.","correct":false,"why":"The file's location is not the problem; the anchor text is not unique."}],"explanation":"Edit requires its anchor text to be unique in the file. When it is not, either make the anchor unique or fall back to Read plus Write of the complete modified file. Retrying blindly, replacing globally, or writing a fragment all fail the requirement.","tags":["edit","read-write-fallback","unique-anchor"]},{"id":"N-2.5-05","domain":"D2","task":"2.5","scenario":"S4","type":"single","select":1,"stem":"An engineer asks how an HTTP request to /orders flows from the handler to the database in an unfamiliar 400-file Python service. The developer productivity agent's current approach is to Glob for **/*.py and Read every match; sessions exhaust the context window around file 180 with no answer produced. Which approach does the guide recommend for building this understanding?","options":[{"id":"a","text":"Keep reading every file but ask the agent to summarize each one to save context.","correct":false,"why":"This is still reading the whole codebase upfront, and summaries discard the details needed to trace a specific flow."},{"id":"b","text":"Grep for the /orders route to find the handler, Read that file, then follow its imports with Read, expanding only along the request path.","correct":true,"why":"The guide's incremental pattern starts with Grep to find entry points and then Reads to follow imports and trace flows."},{"id":"c","text":"Glob for **/*controller*.py and **/*repository*.py and Read every match.","correct":false,"why":"Guessing by file name still bulk-reads many unrelated files and may miss the actual handler."},{"id":"d","text":"Use Bash to generate a full static call graph of the service before answering.","correct":false,"why":"Building whole-service tooling is heavyweight for a single trace question and not the guide's approach."}],"explanation":"Codebase understanding is built incrementally: use Grep to find the entry point, Read that file, and follow imports with further Reads along the path of interest. Reading all files upfront wastes context and rarely answers the question.","tags":["incremental-exploration","grep","read","trace-flow"]},{"id":"N-2.5-06","domain":"D2","task":"2.5","scenario":"S4","type":"single","select":1,"stem":"A shared module utils/index.ts re-exports 30 functions from six internal files. An engineer asks which of those functions are still used anywhere in the monorepo. The developer productivity agent Greps for \"utils/index\" and gets 212 importing files, but cannot tell which of the 30 functions each import actually uses. What is the most effective approach?","options":[{"id":"a","text":"Read all 212 importing files and note which functions each one uses.","correct":false,"why":"Reading every importer upfront is the expensive, context-exhausting approach the guide steers away from."},{"id":"b","text":"Remove the exports one at a time and run the build with Bash to see what breaks.","correct":false,"why":"Destructive trial-and-error is slow, risky, and misses dynamic usages the build does not check."},{"id":"c","text":"First identify all names exported by utils/index.ts, then Grep for each name across the codebase to find its usages.","correct":true,"why":"Tracing usage through a wrapper module means enumerating the exported names and then searching for each one."},{"id":"d","text":"Glob for **/utils/** to list the internal files and count them.","correct":false,"why":"A path listing shows which files exist, not which exported functions are referenced."}],"explanation":"When usage passes through a wrapper or re-export module, searching for the module path only finds importers. The guide's technique is to first identify every exported name, then Grep for each name across the codebase to see where it is actually used.","tags":["grep","wrapper-module","exports","usage-tracing"]},{"id":"N-3.1-01","domain":"D3","task":"3.1","scenario":"S2","type":"single","select":1,"stem":"Your team has used Claude Code for six months and has settled on strict conventions: conventional-commit messages, no default exports, and a required error-wrapping helper. Three senior engineers wrote these conventions into ~/.claude/CLAUDE.md on their own laptops. A new hire clones the repository, starts Claude Code, and finds that none of the conventions are applied, even though the repository already contains a .claude/commands/ directory with shared slash commands. What is the most likely cause?","options":[{"id":"a","text":"The conventions live in user-level configuration, which is not shared through version control; they belong in the project-level CLAUDE.md.","correct":true,"why":"~/.claude/CLAUDE.md applies only to that user and never reaches the repository, so a fresh clone carries none of it. Project-level CLAUDE.md (root or .claude/CLAUDE.md) is the shared location."},{"id":"b","text":"The new hire's own ~/.claude/CLAUDE.md is overriding the project's conventions and must be deleted.","correct":false,"why":"Nothing in the scenario shows the project has any conventions to override; the conventions were never placed at project level in the first place."},{"id":"c","text":"Slash commands in .claude/commands/ take precedence over CLAUDE.md, so the conventions must be moved into a command file.","correct":false,"why":"Commands are invoked on demand and do not replace always-loaded memory; the presence of a commands directory has no bearing on why memory instructions are missing."},{"id":"d","text":"The repository is missing a .claude/config.json that registers which CLAUDE.md files should be loaded.","correct":false,"why":"No such registration file exists in Claude Code; memory files are discovered from the documented hierarchy without a manifest."}],"explanation":"The configuration hierarchy has user-level, project-level, and directory-level memory. User-level instructions in ~/.claude/CLAUDE.md apply only to that user and are not version-controlled, so a teammate never receives them. Shared conventions must be placed in the project-level CLAUDE.md.","tags":["claude-md","hierarchy","user-vs-project","onboarding"]},{"id":"N-3.1-02","domain":"D3","task":"3.1","scenario":"S2","type":"multi","select":2,"stem":"Your platform team is writing an onboarding checklist for repositories adopting Claude Code. One checklist item says: put shared team instructions in a project-level memory file so that every clone receives them. A reviewer asks you to state exactly which file locations Claude Code treats as project-level memory in the configuration hierarchy described by the guide, so the checklist does not send people to the wrong place. Which TWO locations qualify? (Select TWO.)","options":[{"id":"a","text":"~/.claude/CLAUDE.md in each developer's home directory","correct":false,"why":"This is the user-level memory file; it applies only to that user and is not shared through version control."},{"id":"b","text":".claude/CLAUDE.md inside the repository","correct":true,"why":"The guide names .claude/CLAUDE.md as one of the two project-level locations in the hierarchy."},{"id":"c","text":"CLAUDE.md at the repository root","correct":true,"why":"A root CLAUDE.md is the other project-level location named in the hierarchy and is committed with the code."},{"id":"d","text":".claude/settings.json inside the repository","correct":false,"why":"settings.json is a real project file, but it holds settings and permissions rather than memory instructions."},{"id":"e","text":"~/.claude/commands/CLAUDE.md","correct":false,"why":"~/.claude/commands/ holds user-scoped slash commands; it is neither project-level nor a memory location."}],"explanation":"The CLAUDE.md hierarchy has three levels: user-level (~/.claude/CLAUDE.md), project-level (.claude/CLAUDE.md or a root CLAUDE.md), and directory-level files in subdirectories. Only the project-level locations travel with the repository, which is what a team checklist needs.","tags":["claude-md","hierarchy","project-level"]},{"id":"N-3.1-03","domain":"D3","task":"3.1","scenario":"S2","type":"single","select":1,"stem":"Your monorepo has packages/api, packages/web, and packages/infra, each with its own maintainers. Shared standards documents already exist under docs/standards/ (security.md, testing.md, terraform.md, react.md, rest-api.md). The web maintainers complain their sessions are loaded with Terraform and REST conventions they never use, while the infra maintainers say the React rules confuse Claude when it edits Terraform modules. What is the most maintainable way to give each package only the standards its maintainers consider relevant?","options":[{"id":"a","text":"Copy the text of the relevant standards into each package's CLAUDE.md so that each package is self-contained.","correct":false,"why":"Copies drift as soon as a standard is updated, and the same rule ends up maintained in several places."},{"id":"b","text":"Have each package's CLAUDE.md @import only the standards files relevant to that package, selected by its maintainers.","correct":true,"why":"@import keeps a single source of truth in docs/standards/ while letting the people who know each package choose which files apply to it."},{"id":"c","text":"Keep one root CLAUDE.md that lists every standard under package headings and asks Claude to apply only the relevant section.","correct":false,"why":"This loads everything in every session and relies on Claude inferring which section applies, which is exactly the confusion being reported."},{"id":"d","text":"Move each package's standards into ~/.claude/CLAUDE.md on its maintainers' machines.","correct":false,"why":"User-level memory is not shared through version control, so anyone else working in that package would get no standards at all."}],"explanation":"The @import syntax lets a CLAUDE.md reference external files, keeping configuration modular. Each package's CLAUDE.md can selectively import the standards that its maintainers know are relevant, so the standards exist once and each package loads only what it needs.","tags":["claude-md","import","monorepo","modular"]},{"id":"N-3.1-04","domain":"D3","task":"3.1","scenario":"S4","type":"single","select":1,"stem":"The root CLAUDE.md of your developer-tooling repository has grown to roughly 900 lines covering testing conventions, API conventions, deployment procedures, and logging rules. Pull requests that touch it now conflict weekly, and engineers say they can no longer find the section they need to update. All of the content is still needed as standing guidance for the repository. Which reorganization does the guide describe for this situation?","options":[{"id":"a","text":"Convert each section into a skill under .claude/skills/ so engineers invoke the relevant one on demand.","correct":false,"why":"Skills are on-demand task workflows; standing conventions that must always apply would silently stop applying unless someone remembers to invoke them."},{"id":"b","text":"Move the file to ~/.claude/CLAUDE.md on each engineer's machine so edits no longer conflict in the repository.","correct":false,"why":"User-level memory is not version-controlled, so the team would lose a shared source of truth and each copy would drift."},{"id":"c","text":"Split the content into focused topic files in .claude/rules/, such as testing.md, api-conventions.md, and deployment.md.","correct":true,"why":"The guide names .claude/rules/ as the alternative to a monolithic CLAUDE.md, organized as topic-specific files that remain shared through version control."},{"id":"d","text":"Split the content into one CLAUDE.md per subdirectory so each area of the repository carries its own copy of the shared rules.","correct":false,"why":"Directory-level files scope by location, not by topic; repository-wide rules would have to be duplicated into many directories."}],"explanation":"The .claude/rules/ directory exists to organize topic-specific rule files as an alternative to a monolithic CLAUDE.md. Splitting a large file into testing.md, api-conventions.md, deployment.md and similar keeps each topic small and independently editable while the content stays in the repository.","tags":["claude-md","rules-dir","modular"]},{"id":"N-3.1-05","domain":"D3","task":"3.1","scenario":"S2","type":"single","select":1,"stem":"Two engineers on the same team report different behavior from Claude Code in the same repository: on one machine Claude always adds JSDoc comments to exported functions, on the other it never does. Both have pulled the latest main, and the project CLAUDE.md says nothing about JSDoc. You suspect one machine is picking up an additional memory file from somewhere in the hierarchy. What is the best first step to diagnose this?","options":[{"id":"a","text":"Delete ~/.claude on both machines and re-clone the repository so both start from a clean state.","correct":false,"why":"This destroys personal configuration and may remove the difference without ever identifying it, so the problem can recur."},{"id":"b","text":"Inspect .claude/settings.json on both machines, since it determines which instructions are applied.","correct":false,"why":"settings.json is a real file, but it holds settings and permissions; it does not list or control which memory files are loaded."},{"id":"c","text":"Add an explicit instruction about JSDoc to the project CLAUDE.md so both machines behave the same way.","correct":false,"why":"This patches one symptom while leaving the unknown extra memory file in place to cause the next inconsistency."},{"id":"d","text":"Run the /memory command on each machine to see exactly which memory files are loaded, then compare the two lists.","correct":true,"why":"/memory shows which memory files are in effect, which is precisely the information needed to find the file one machine has and the other does not."}],"explanation":"When behavior differs across sessions or machines, the guide's diagnostic is the /memory command, which verifies which memory files are loaded. Comparing the lists identifies the extra or missing file rather than guessing.","tags":["memory-command","diagnosis","claude-md"]},{"id":"N-3.1-06","domain":"D3","task":"3.1","scenario":"S4","type":"multi","select":2,"stem":"An engineer on your productivity-tools team wants three kinds of instructions in place: a personal preference that Claude answer tersely and skip pleasantries; team-wide conventions for the whole repository; and a rule that applies only inside packages/legacy-parser/, whose code follows a different style than the rest of the codebase. The personal preference must not reach teammates, and the legacy rule should not load when working elsewhere in the repository. Which TWO placements are correct? (Select TWO.)","options":[{"id":"a","text":"Put the personal terseness preference in ~/.claude/CLAUDE.md.","correct":true,"why":"User-level memory applies only to that user and is not shared through version control, which is exactly what a personal preference needs."},{"id":"b","text":"Put the personal terseness preference in the root CLAUDE.md with a comment noting that it is personal.","correct":false,"why":"The root CLAUDE.md is project-level and committed, so the preference would apply to every teammate regardless of the comment."},{"id":"c","text":"Put the legacy-parser rule in a CLAUDE.md file inside packages/legacy-parser/.","correct":true,"why":"A directory-level CLAUDE.md scopes instructions to that subdirectory, so the rule applies there and not elsewhere."},{"id":"d","text":"Put the legacy-parser rule in ~/.claude/CLAUDE.md so it does not clutter the project file.","correct":false,"why":"This would apply the rule to every project on one machine and share it with nobody else on the team."},{"id":"e","text":"Put the team-wide conventions in ~/.claude/commands/conventions.md.","correct":false,"why":"That location holds a personal slash command, which is neither shared nor loaded automatically as memory."},{"id":"f","text":"Put the legacy-parser rule in .claude/commands/legacy.md so it loads automatically when files there are edited.","correct":false,"why":"Command files run only when invoked; they are not activated by which files are being edited."}],"explanation":"The hierarchy assigns each kind of instruction a home: user-level ~/.claude/CLAUDE.md for personal, unshared preferences; project-level CLAUDE.md for team conventions; and a directory-level CLAUDE.md inside a subdirectory for rules that apply only there.","tags":["claude-md","hierarchy","directory-level","user-level"]},{"id":"N-3.2-01","domain":"D3","task":"3.2","scenario":"S2","type":"single","select":1,"stem":"You have written a /standup slash command that reads your local git log, summarizes yesterday's commits in the format you personally prefer, and drafts a status message for your manager. It is useful to you, but it encodes personal habits your teammates would not want, and it must not appear in the repository when you push. Where should the command file live?","options":[{"id":"a","text":"In .claude/commands/standup.md, with the file added to .gitignore so it is never committed.","correct":false,"why":".claude/commands/ is the project-scoped location intended for sharing; hiding a file there with .gitignore fights the mechanism and breaks on the next clone."},{"id":"b","text":"In ~/.claude/commands/standup.md, the user-scoped location for personal commands.","correct":true,"why":"User-scoped commands in ~/.claude/commands/ are personal, available in every session for that user, and never enter version control."},{"id":"c","text":"In ~/.claude/CLAUDE.md under a heading named /standup.","correct":false,"why":"CLAUDE.md is always-loaded memory, not a command definition; a heading there does not create an invokable slash command."},{"id":"d","text":"In .claude/skills/standup/SKILL.md with a frontmatter entry `personal: true`.","correct":false,"why":"No such frontmatter key exists, and .claude/skills/ inside the repository is project-scoped and would be committed."}],"explanation":"Project-scoped commands live in .claude/commands/ and are shared via version control; user-scoped commands live in ~/.claude/commands/ and are personal. A command that reflects one person's habits belongs in the user-scoped directory.","tags":["slash-commands","user-scoped","commands-dir"]},{"id":"N-3.2-02","domain":"D3","task":"3.2","scenario":"S2","type":"single","select":1,"stem":"Your team built a /alternatives skill that, given a design problem, brainstorms four or five competing approaches, sketches pseudo-code for each, and argues their trade-offs. Developers like the output, but they report that after running it the main session keeps drifting back to rejected alternatives and mixing their pseudo-code into real implementation work. Which change addresses this most directly?","options":[{"id":"a","text":"Add `allowed-tools` to the skill's frontmatter so it can only read files while brainstorming.","correct":false,"why":"Restricting tools limits what the skill can do, but its exploratory text still lands in the main conversation and keeps influencing later turns."},{"id":"b","text":"Instruct developers to run /clear immediately after the skill finishes.","correct":false,"why":"/clear is a real command, but it discards the entire conversation, including the work the developer wanted to keep, and depends on people remembering to do it."},{"id":"c","text":"Add `context: fork` to the skill's SKILL.md frontmatter so the exploration runs in an isolated sub-agent context.","correct":true,"why":"context: fork keeps the exploratory context inside the sub-agent and returns only the result, so rejected alternatives never pollute the main session."},{"id":"d","text":"Move the skill to ~/.claude/skills/ so its output stays on the developer's machine.","correct":false,"why":"The location changes who can invoke the skill, not where its output goes; a personal skill still runs in the main conversation."}],"explanation":"The context: fork frontmatter option runs a skill in an isolated sub-agent context. The guide names brainstorming alternatives as a case where exploratory context should be kept out of the main session, alongside verbose outputs such as codebase analysis.","tags":["skills","context-fork","isolation"]},{"id":"N-3.2-03","domain":"D3","task":"3.2","scenario":"S4","type":"single","select":1,"stem":"You are packaging a /generate-fixtures skill that writes JSON fixture files into tests/fixtures/ from a schema. During a trial run the skill also executed a shell command that truncated a local database while cleaning up. You want the skill to be able to read the schema and write fixture files but never execute shell commands, regardless of what the skill body or the developer's prompt asks for. Which configuration achieves this?","options":[{"id":"a","text":"Set `allowed-tools` in the skill's SKILL.md frontmatter to the read and file-write tools only.","correct":true,"why":"allowed-tools restricts which tools are available during skill execution, so a shell tool that is not listed cannot be used no matter what the prompt says."},{"id":"b","text":"Add `context: fork` so any destructive command runs in an isolated sub-agent and cannot affect the main session.","correct":false,"why":"Forking isolates conversation context, not side effects; a truncated database is just as truncated when the command runs in a sub-agent."},{"id":"c","text":"Add a sentence to the skill body stating that shell commands are forbidden.","correct":false,"why":"A prompt instruction is probabilistic and is exactly what failed in the trial; it offers no guarantee against a destructive action."},{"id":"d","text":"Add a deny rule for the shell tool to each developer's ~/.claude/settings.json.","correct":false,"why":"This is a real mechanism, but it disables the shell for every session on that machine rather than during this skill, and it is not distributed with the skill."}],"explanation":"The allowed-tools frontmatter key in SKILL.md restricts tool access during skill execution. The guide's example is limiting a skill to file-write operations to prevent destructive actions, which is a deterministic restriction rather than a request in prose.","tags":["skills","allowed-tools","safety"]},{"id":"N-3.2-04","domain":"D3","task":"3.2","scenario":"S2","type":"single","select":1,"stem":"Your /release-notes skill generates notes for a given version tag by diffing it against the previous tag. Developers frequently type /release-notes with no arguments; the skill then guesses a tag and sometimes produces notes for the wrong release. You want Claude Code to prompt for the version tag whenever the skill is invoked without one. Which frontmatter change is appropriate?","options":[{"id":"a","text":"Add `context: fork` so the skill runs in a sub-agent that can ask for the tag.","correct":false,"why":"context: fork controls where the skill's context lives; it has nothing to do with prompting for missing parameters."},{"id":"b","text":"Add `allowed-tools` restricted to the shell tool so the skill can run git to discover the latest tag.","correct":false,"why":"This makes the guess more sophisticated but still guesses; the requirement is to ask the developer for the intended tag."},{"id":"c","text":"Add a section to the project CLAUDE.md stating that /release-notes requires a version tag.","correct":false,"why":"CLAUDE.md is guidance for Claude, not the interface developers see when invoking a skill; it does not prompt anyone for a parameter."},{"id":"d","text":"Add an `argument-hint` entry such as `<version-tag>` so developers are prompted for the required parameter.","correct":true,"why":"argument-hint exists precisely to prompt developers for required parameters when they invoke a skill without arguments."}],"explanation":"The argument-hint frontmatter key tells Claude Code what parameter a skill expects, so a developer who invokes it bare is prompted rather than leaving Claude to guess. The other frontmatter keys address isolation and tool restriction, not parameters.","tags":["skills","argument-hint","frontmatter"]},{"id":"N-3.2-05","domain":"D3","task":"3.2","scenario":"S2","type":"multi","select":2,"stem":"Your team is deciding where two kinds of guidance belong. The first is a twelve-step database migration workflow (generate the migration, run it against a scratch database, verify row counts, write the rollback) that engineers perform a few times per month. The second is a set of naming and error-handling conventions that must apply to every line of code Claude writes in the repository. Which TWO placements match the guide's distinction between skills and CLAUDE.md? (Select TWO.)","options":[{"id":"a","text":"Put the migration workflow in .claude/skills/db-migration/SKILL.md so it is invoked on demand.","correct":true,"why":"A task-specific workflow used occasionally is what skills are for: on-demand invocation without occupying context in every session."},{"id":"b","text":"Put the migration workflow in the project CLAUDE.md so Claude always knows the procedure.","correct":false,"why":"Twelve steps that matter a few times a month would be loaded into every session, costing context for work that never touches migrations."},{"id":"c","text":"Put the naming and error-handling conventions in the project CLAUDE.md so they are always loaded.","correct":true,"why":"Universal standards that must apply to all generated code belong in always-loaded CLAUDE.md."},{"id":"d","text":"Put the naming conventions in .claude/skills/conventions/SKILL.md and ask engineers to invoke it at the start of each session.","correct":false,"why":"Conventions that must always apply would silently lapse whenever someone forgets the invocation; skills are not the mechanism for universal standards."},{"id":"e","text":"Put the migration workflow in ~/.claude/skills/ on each engineer's machine so the repository stays uncluttered.","correct":false,"why":"A workflow the whole team performs should be shared through the project's .claude/skills/, not maintained as separate personal copies."}],"explanation":"The guide distinguishes skills, which are invoked on demand for task-specific workflows, from CLAUDE.md, which holds always-loaded universal standards. An occasional multi-step procedure is a skill; conventions that apply to every change are CLAUDE.md content.","tags":["skills","claude-md","skills-vs-memory"]},{"id":"N-3.2-06","domain":"D3","task":"3.2","scenario":"S2","type":"single","select":1,"stem":"The repository ships a team skill at .claude/skills/gen-tests/SKILL.md that generates Jest tests using the team's fixture helpers. One engineer is prototyping a Vitest migration on a branch and wants a version of the skill that emits Vitest syntax, without changing what any teammate sees when they invoke /gen-tests. What does the guide recommend?","options":[{"id":"a","text":"Create a personal skill under ~/.claude/skills/ with a different name, such as gen-tests-vitest, containing the modified instructions.","correct":true,"why":"Personal variants live in ~/.claude/skills/ under a distinct name, so the engineer gets the new behavior and teammates are untouched."},{"id":"b","text":"Edit .claude/skills/gen-tests/SKILL.md locally and leave the change uncommitted.","correct":false,"why":"An uncommitted edit to a shared file is fragile: it is overwritten on the next pull and is easy to commit by accident."},{"id":"c","text":"Add an instruction to the project CLAUDE.md saying that generated tests should use Vitest syntax.","correct":false,"why":"Project CLAUDE.md is shared, so every teammate's /gen-tests output would change."},{"id":"d","text":"Create ~/.claude/skills/gen-tests/SKILL.md with the same name so it replaces the team version for that engineer.","correct":false,"why":"The guide specifically calls for a different name for personal variants; reusing the team skill's name creates ambiguity about which one runs."}],"explanation":"Personal skill customization means creating a variant in ~/.claude/skills/ with a different name. That keeps the team's project-scoped skill intact for everyone else while giving one developer their own behavior.","tags":["skills","personal-variant","user-scoped"]},{"id":"N-3.2-07","domain":"D3","task":"3.2","scenario":"S4","type":"multi","select":3,"stem":"You are writing SKILL.md for a /trace-request skill under .claude/skills/trace-request/. The skill must run in an isolated sub-agent context because it dumps long call graphs; it must be limited to Read, Grep, and Glob so it can never modify files; and it must prompt the developer for a request ID when invoked with no arguments. Which THREE frontmatter entries implement these requirements? (Select THREE.)","options":[{"id":"a","text":"`context: fork`","correct":true,"why":"context: fork runs the skill in an isolated sub-agent context so the call-graph output does not pollute the main conversation."},{"id":"b","text":"`paths: [\"src/**/*.ts\"]`","correct":false,"why":"paths is the frontmatter key for .claude/rules/ files; it scopes rule activation to files and does none of the three things required here."},{"id":"c","text":"`allowed-tools: Read, Grep, Glob`","correct":true,"why":"allowed-tools restricts the tools available during skill execution to the read-only set listed."},{"id":"d","text":"`isolated: true`","correct":false,"why":"This key does not exist; isolation is configured with context: fork."},{"id":"e","text":"`argument-hint: <request-id>`","correct":true,"why":"argument-hint prompts the developer for the required parameter when the skill is invoked without arguments."},{"id":"f","text":"`required-args: true`","correct":false,"why":"This key does not exist; prompting for parameters is done with argument-hint."}],"explanation":"SKILL.md frontmatter supports context: fork for isolated execution, allowed-tools for restricting tool access, and argument-hint for prompting when required parameters are missing. Each requirement in the scenario maps to exactly one of these keys.","tags":["skills","frontmatter","context-fork","allowed-tools","argument-hint"]},{"id":"N-3.3-01","domain":"D3","task":"3.3","scenario":"S4","type":"single","select":1,"stem":"Your platform has nine services, each with SQL migration files under services/<name>/migrations/. All migrations must follow the same rules: idempotent DDL, explicit lock timeouts, and a paired down-migration. These rules are irrelevant to the TypeScript code that lives in the same services and should not be loaded while editing it. What is the most maintainable way to have Claude Code apply the migration rules automatically?","options":[{"id":"a","text":"Add a section to the root CLAUDE.md headed 'When editing SQL migrations' that contains the rules.","correct":false,"why":"The rules would load in every session and depend on Claude inferring when the heading applies, rather than on explicit matching."},{"id":"b","text":"Create .claude/rules/sql-migrations.md with YAML frontmatter `paths: [\"services/*/migrations/*.sql\"]` and put the rules in it.","correct":true,"why":"A path-scoped rule loads only when a matching migration file is being edited, applies across all nine services from one file, and stays out of TypeScript sessions."},{"id":"c","text":"Create a /sql-conventions skill that engineers invoke before editing a migration.","correct":false,"why":"A skill applies only when someone remembers to invoke it, which does not satisfy the need for automatic application."},{"id":"d","text":"Add a CLAUDE.md file to each of the nine migrations directories.","correct":false,"why":"Nine copies of the same rules drift over time and every new service requires another copy; a single glob-scoped rule covers them all."}],"explanation":"Files in .claude/rules/ carry YAML frontmatter with a paths field of glob patterns. The rule activates only when Claude edits a matching file, so conventions spanning many directories can be expressed once and cost no context elsewhere.","tags":["rules-dir","paths-glob","conditional-loading"]},{"id":"N-3.3-02","domain":"D3","task":"3.3","scenario":"S2","type":"single","select":1,"stem":"Your root CLAUDE.md includes roughly 400 lines of Terraform conventions covering module layout, variable naming, and state handling. Only two engineers ever touch terraform/, yet every session in the repository loads those lines, and frontend engineers have noticed Claude occasionally mentioning Terraform state while editing React components. You want the conventions to remain shared through version control but stop consuming context in unrelated sessions. What should you do?","options":[{"id":"a","text":"Move the conventions into docs/terraform.md and @import it from the root CLAUDE.md.","correct":false,"why":"@import improves organization, but an imported file is still part of the always-loaded memory and costs the same context in every session."},{"id":"b","text":"Move the conventions into ~/.claude/CLAUDE.md on the two infrastructure engineers' machines.","correct":false,"why":"User-level memory is not version-controlled, so the conventions would no longer be shared and would load in all of those engineers' projects."},{"id":"c","text":"Move the conventions into .claude/rules/terraform.md with frontmatter `paths: [\"terraform/**/*\"]` so they load only when matching files are edited.","correct":true,"why":"A path-scoped rule stays in the repository and is loaded only when a file under terraform/ is being edited, removing the cost from every other session."},{"id":"d","text":"Convert the conventions into a /terraform skill with `context: fork`.","correct":false,"why":"A skill must be invoked, so the conventions would not apply automatically; context: fork isolates output rather than scoping when guidance loads."}],"explanation":"Path-scoped rules load only when editing files that match their glob, which reduces irrelevant context and token usage. Content that matters only to one area of the repository should be a rule scoped to that area rather than part of always-loaded CLAUDE.md.","tags":["rules-dir","token-usage","paths-glob"]},{"id":"N-3.3-03","domain":"D3","task":"3.3","scenario":"S2","type":"single","select":1,"stem":"Your NestJS codebase places GraphQL resolvers next to the feature they serve: src/users/users.resolver.ts, src/billing/invoices.resolver.ts, src/admin/reports/audit.resolver.ts, and about forty more at varying depths. Every resolver must follow the same rules for authorization guards and error mapping. You are writing .claude/rules/resolvers.md. Which frontmatter value activates the rule for every resolver file, wherever it lives?","options":[{"id":"a","text":"`paths: [\"**/*.resolver.ts\"]`","correct":true,"why":"The ** wildcard matches any directory depth and the filename suffix identifies resolvers by type, so every resolver is covered regardless of location."},{"id":"b","text":"`paths: [\"src/resolvers/*.ts\"]`","correct":false,"why":"This matches only files in a single src/resolvers/ directory, which is not where the resolvers live."},{"id":"c","text":"`paths: [\"src/**/resolvers/*.ts\"]`","correct":false,"why":"This requires a directory named resolvers somewhere in the path; files such as src/users/users.resolver.ts would never match."},{"id":"d","text":"`paths: [\"src/*.resolver.ts\"]`","correct":false,"why":"A single * does not cross directory boundaries, so only resolver files directly inside src/ would match."}],"explanation":"Glob patterns in path-specific rules apply conventions by file type regardless of directory. The guide's example is **/*.test.tsx for all test files; the same shape, **/*.resolver.ts, covers files spread at any depth.","tags":["rules-dir","glob-patterns","file-type"]},{"id":"N-3.3-04","domain":"D3","task":"3.3","scenario":"S4","type":"multi","select":2,"stem":"Your team is debating how to enforce a shared convention for Storybook story files (*.stories.tsx), which sit beside their components in more than sixty directories across apps/ and packages/. One engineer proposes adding a CLAUDE.md to each directory; another proposes a single file in .claude/rules/ with a paths glob. Which TWO statements correctly describe why the guide favors the path-scoped rule in this situation? (Select TWO.)","options":[{"id":"a","text":"A single rule with a glob such as `**/*.stories.tsx` matches story files by type regardless of which directory they live in.","correct":true,"why":"This is the guide's stated advantage of glob-pattern rules over directory-level CLAUDE.md files for conventions that span many directories."},{"id":"b","text":"Directory-level CLAUDE.md files are not committed to version control, so they cannot be shared with the team.","correct":false,"why":"Subdirectory CLAUDE.md files live in the repository and are shared; the problem with them here is duplication across sixty directories, not sharing."},{"id":"c","text":"The rule's content is loaded only when a matching file is being edited, so unrelated sessions do not pay its token cost.","correct":true,"why":"Path-scoped rules activate on matching files only, which reduces irrelevant context compared with always-loaded guidance."},{"id":"d","text":"Rules files can restrict which tools Claude may use while editing matching files.","correct":false,"why":"Tool restriction is the allowed-tools key in skill frontmatter; rules files carry conventions, not tool permissions."},{"id":"e","text":"Rules files are loaded in every session like CLAUDE.md but are compressed, so they cost fewer tokens.","correct":false,"why":"Path-scoped rules are not loaded in every session at all; their saving comes from conditional activation, not compression."},{"id":"f","text":"A path-scoped rule overrides the user-level ~/.claude/CLAUDE.md, guaranteeing the convention is followed.","correct":false,"why":"The guide describes no such precedence; the rule's benefit is scoping and reach, not overriding personal memory."}],"explanation":"Two properties make path-scoped rules the right tool for conventions spread across a codebase: a glob matches files by type wherever they are, so one file replaces many directory-level copies, and the rule loads only when a matching file is edited, saving context elsewhere.","tags":["rules-dir","glob-patterns","token-usage","directory-level"]},{"id":"N-3.3-05","domain":"D3","task":"3.3","scenario":"S2","type":"multi","select":2,"stem":"A teammate opens a pull request that adds several files to .claude/rules/. The description claims each file loads only when Claude is editing matching files. You review the frontmatter of each file before approving. Based on how the guide describes rule scoping, which TWO files are correctly configured for path-scoped activation? (Select TWO.)","options":[{"id":"a","text":"security.md with frontmatter `allowed-tools: Read, Grep`","correct":false,"why":"allowed-tools is a SKILL.md key for restricting tools; it does not scope a rule to any files."},{"id":"b","text":"tests.md with frontmatter `paths: [\"**/*.test.ts\", \"**/*.spec.ts\"]`","correct":true,"why":"A paths field with glob patterns is the documented way to make a rule activate only for matching files, here every test file by type."},{"id":"c","text":"api.md with frontmatter `context: fork`","correct":false,"why":"context: fork is a skill frontmatter option for isolated execution and has no meaning for scoping rule files."},{"id":"d","text":"frontend.md with frontmatter `match: \"apps/web/**\"`","correct":false,"why":"The frontmatter field the guide names is paths; a differently named key does not scope the rule."},{"id":"e","text":"infra.md with frontmatter `paths: [\"terraform/**/*\"]`","correct":true,"why":"This is the guide's own example of path scoping: the rule loads only when editing files under terraform/."},{"id":"f","text":"deploy.md with no frontmatter and a first line reading `# applies to: deploy/**`","correct":false,"why":"A heading in the body is prose Claude may or may not honor; scoping requires the paths field in YAML frontmatter."}],"explanation":"Path-scoped activation in .claude/rules/ is configured through a YAML frontmatter paths field containing glob patterns. Keys borrowed from skills, alternative key names, and instructions written in the body do not scope a rule.","tags":["rules-dir","frontmatter","paths-glob","review"]},{"id":"N-3.3-06","domain":"D3","task":"3.3","scenario":"S4","type":"single","select":1,"stem":"An audit of your repository finds fourteen subdirectory CLAUDE.md files that each contain a copied section on structured logging (field names, log levels, no personal data). The copies have drifted; four now disagree about the name of the correlation-ID field. The convention is meant to apply to every service's source files, and new services are added monthly. What is the best way to consolidate?","options":[{"id":"a","text":"Keep the fourteen files but have each one @import a single shared logging.md so the text exists only once.","correct":false,"why":"This removes drift but still leaves fourteen directory-bound files to maintain, and every new service needs another one added by hand."},{"id":"b","text":"Move the logging section to ~/.claude/CLAUDE.md for each engineer so the subdirectory files stay small.","correct":false,"why":"User-level memory is not shared through the repository, so the team convention would depend on each engineer's local setup."},{"id":"c","text":"Replace the copies with one .claude/rules/logging.md whose frontmatter paths glob matches the service source files across the repository.","correct":true,"why":"One glob-scoped rule applies to every matching file in every current and future service, with a single copy of the convention to maintain."},{"id":"d","text":"Move the logging section into a /logging skill and ask engineers to invoke it when adding log statements.","correct":false,"why":"A convention that must always apply cannot depend on developers remembering to invoke a skill."}],"explanation":"When a convention must apply to files spread across the codebase, the guide prefers a path-specific rule over subdirectory CLAUDE.md files. A single rule with a glob replaces many directory-bound copies and automatically covers new directories that match.","tags":["rules-dir","directory-level","consolidation"]},{"id":"N-3.4-02","domain":"D3","task":"3.4","scenario":"S2","type":"single","select":1,"stem":"You used plan mode to investigate replacing your homegrown job queue with a managed queue service. The resulting plan identifies the seven modules to change, the order in which to change them, and the adapter interface, and you have reviewed and approved it. A junior engineer asks whether the implementation should also be carried out in plan mode to be safe. What does the guide recommend?","options":[{"id":"a","text":"Switch to direct execution and implement the approved plan, since the investigation and design are complete.","correct":true,"why":"The guide pairs plan mode for investigation with direct execution for implementation; once the approach is planned, executing it directly is the intended next step."},{"id":"b","text":"Stay in plan mode for implementation, because any multi-file change requires plan mode throughout.","correct":false,"why":"Plan mode is for exploration and design before committing to changes; it is not a requirement for carrying out an already-planned change."},{"id":"c","text":"Re-enter plan mode before each of the seven modules to re-derive the approach for that module.","correct":false,"why":"Re-planning work that the approved plan already covers adds overhead without adding safety."},{"id":"d","text":"Hand the implementation to the Explore subagent so its verbose output does not reach the main conversation.","correct":false,"why":"The Explore subagent is for discovery phases that produce verbose output, not for implementing planned changes."}],"explanation":"The guide describes combining the two modes: plan mode for investigation and design, then direct execution to carry out the planned approach. Once a migration plan is approved, implementation proceeds directly.","tags":["plan-mode","direct-execution","combined-workflow"]},{"id":"N-3.4-03","domain":"D3","task":"3.4","scenario":"S4","type":"single","select":1,"stem":"A support ticket reports that the booking form accepts an end date earlier than the start date. The handler is validateBooking() in src/bookings/validate.ts, the failing input is attached to the ticket, and the fix is a single conditional that returns a validation error when endDate precedes startDate. An engineer on your team asks whether to open plan mode first. Which approach fits?","options":[{"id":"a","text":"Enter plan mode, since any change to validation logic could have architectural implications.","correct":false,"why":"Plan mode is reserved for complex, multi-approach, or multi-file work; a single conditional in one known function has none of those properties."},{"id":"b","text":"Use direct execution: the change is a well-scoped, single-function addition with a clear reproduction.","correct":true,"why":"Adding a date validation conditional to one function is the guide's own example of a task suited to direct execution."},{"id":"c","text":"Run the Explore subagent first to map every caller of validateBooking() before touching the function.","correct":false,"why":"Discovery tooling is for verbose, multi-phase exploration; the file, function, and failing input are already known."},{"id":"d","text":"Create a /add-validation skill so the change can be reproduced for other forms.","correct":false,"why":"Building reusable tooling for a one-off, one-line fix adds work without addressing the ticket."}],"explanation":"Direct execution is appropriate for simple, well-scoped changes such as adding a single validation check to one function. Plan mode adds overhead without benefit when the scope, location, and fix are already clear.","tags":["direct-execution","well-scoped","validation"]},{"id":"N-3.4-04","domain":"D3","task":"3.4","scenario":"S4","type":"single","select":1,"stem":"Your productivity agent is helping an engineer understand a 300,000-line legacy monolith ahead of a refactor. The discovery phase involves listing directories, grepping for call sites, and reading dozens of files; by the time discovery ends, the main conversation is nearly out of context and the design and refactor phases have not started. Sessions have had to be restarted twice. What does the guide recommend for the discovery phase?","options":[{"id":"a","text":"Run /compact after every few tool calls to keep the main conversation small.","correct":false,"why":"Compaction is a real command, but it repeatedly summarizes material that should never have entered the main conversation in the first place."},{"id":"b","text":"Record the directory listings in the project CLAUDE.md so future sessions do not need to rediscover them.","correct":false,"why":"This would load the verbose output into every session permanently, making the context problem worse rather than better."},{"id":"c","text":"Use the Explore subagent for discovery so the verbose output stays in its own context and only a summary returns to the main conversation.","correct":true,"why":"The Explore subagent exists to isolate verbose discovery output and return summaries, preserving main-conversation context for later phases."},{"id":"d","text":"Split discovery into several `claude -p` invocations and paste their outputs into the main session.","correct":false,"why":"The -p flag is for non-interactive pipelines; pasting the outputs back reintroduces the same volume of text into the main conversation."}],"explanation":"The Explore subagent isolates verbose discovery output and returns a summary, preventing context window exhaustion during multi-phase tasks. The main conversation keeps only the conclusions it needs for design and implementation.","tags":["explore-subagent","context-window","discovery"]},{"id":"N-3.4-05","domain":"D3","task":"3.4","scenario":"S2","type":"multi","select":2,"stem":"Your team lead is writing a short internal guideline on when engineers should use plan mode in Claude Code rather than direct execution. She lists five tasks the team completed last sprint and asks you to mark the ones that should have started in plan mode according to the guide's criteria. Which TWO tasks warrant plan mode? (Select TWO.)","options":[{"id":"a","text":"Fixing a null dereference in one function, identified by a stack trace attached to the bug report.","correct":false,"why":"A single-file bug fix with a clear stack trace is the guide's example of a change suited to direct execution."},{"id":"b","text":"Restructuring the event-handling layer, which touches about 60 files and requires deciding where module boundaries fall.","correct":true,"why":"Large-scale, multi-file change with architectural decisions is the core case for plan mode."},{"id":"c","text":"Adding a conditional that rejects dates before 1970 in a single parsing function.","correct":false,"why":"Adding a date validation conditional is the guide's example of a well-scoped change for direct execution."},{"id":"d","text":"Choosing between a webhook-based and a polling-based integration with a payment provider, where each option needs different infrastructure.","correct":true,"why":"Multiple valid approaches with differing infrastructure requirements is a plan-mode criterion the guide names explicitly."},{"id":"e","text":"Renaming a misspelled variable in one file.","correct":false,"why":"A trivially scoped, single-file edit has no design question to explore and is direct execution."}],"explanation":"Plan mode suits complex work: large-scale or multi-file changes, architectural decisions, and choices between multiple valid approaches. Simple, well-scoped edits with a clear location and fix are direct execution.","tags":["plan-mode","direct-execution","task-selection"]},{"id":"N-3.4-06","domain":"D3","task":"3.4","scenario":"S4","type":"multi","select":2,"stem":"An engineer is about to split a legacy billing module into three services. The work has three phases: discover how the module is used across the codebase, design the split, and implement it. On a previous attempt the engineer began editing immediately, discovered a hidden dependency two days in, and had to revert 30 files. Which TWO practices from the guide address the problems seen in the previous attempt? (Select TWO.)","options":[{"id":"a","text":"Perform discovery in the main conversation so every file listing remains available during implementation.","correct":false,"why":"Keeping verbose discovery output in the main conversation is what exhausts context before design and implementation begin."},{"id":"b","text":"Use plan mode to explore the codebase and design the split before committing to changes, so hidden dependencies surface before any rework is needed.","correct":true,"why":"Plan mode enables safe exploration and design before changes are made, which is precisely what would have caught the dependency early."},{"id":"c","text":"Keep plan mode active through implementation so that no file is changed without a plan step.","correct":false,"why":"Once the design is settled, the guide pairs it with direct execution; staying in plan mode does not make implementation safer."},{"id":"d","text":"Use the Explore subagent for the discovery phase so its verbose output does not exhaust the main conversation before design and implementation.","correct":true,"why":"The Explore subagent isolates discovery output and returns summaries, preserving context for the later phases of a multi-phase task."},{"id":"e","text":"Run the whole task with `claude -p` so it cannot pause for interactive input.","correct":false,"why":"The -p flag is for automated pipelines; it does nothing to prevent rework or to manage context in an interactive multi-phase task."}],"explanation":"Two practices address a multi-phase restructuring: plan mode lets Claude explore and design before committing to changes, preventing costly rework, and the Explore subagent keeps verbose discovery output out of the main conversation so later phases still have context available.","tags":["plan-mode","explore-subagent","rework","multi-phase"]},{"id":"N-3.5-01","domain":"D3","task":"3.5","scenario":"S2","type":"single","select":1,"stem":"You are asking Claude Code to write a function that normalizes free-text warehouse locations into a canonical code. You have described the rules in prose twice (take the aisle letter, then the bay number padded to three digits, ignore the rack suffix unless it is a mezzanine), and each attempt handled the mezzanine case and lowercase input differently. What is the most effective next step?","options":[{"id":"a","text":"Rewrite the prose description a third time with more precise wording and numbered rules.","correct":false,"why":"Prose has already been interpreted inconsistently twice; a third description is still open to interpretation."},{"id":"b","text":"Provide two or three concrete input/output pairs, including a mezzanine and a lowercase example, and ask for an implementation that satisfies them.","correct":true,"why":"Concrete examples pin down exactly the cases that prose left ambiguous, which the guide identifies as the most effective way to communicate a transformation."},{"id":"c","text":"Enter plan mode so Claude can explore the codebase before implementing.","correct":false,"why":"The ambiguity is in the requirement, not the codebase; exploring files will not resolve how a mezzanine suffix should be handled."},{"id":"d","text":"Add the normalization rules to the project CLAUDE.md so they are always loaded.","correct":false,"why":"Moving the same ambiguous prose into memory changes where it is read, not how it is interpreted."}],"explanation":"When natural-language descriptions produce inconsistent results, the guide recommends providing two or three concrete input/output examples. Examples communicate a transformation precisely where prose is interpreted differently on each attempt.","tags":["io-examples","iterative-refinement","transformation"]},{"id":"N-3.5-02","domain":"D3","task":"3.5","scenario":"S4","type":"single","select":1,"stem":"Your team needs a token-bucket rate limiter for the internal API gateway. The expected behavior is fully known: burst allowance, refill rate, behavior at exactly the limit, clock-skew handling, and a requirement to decide 10,000 requests per second on a single core. A previous attempt produced code that looked correct but failed under load and mishandled the boundary case. How should you drive the next attempt?","options":[{"id":"a","text":"Ask Claude to implement the limiter first and then generate tests for it, so the tests match the implementation.","correct":false,"why":"Tests written after the fact tend to encode whatever the implementation does, including the boundary and load defects seen last time."},{"id":"b","text":"Have a second, independent Claude session review the previous implementation and list its defects.","correct":false,"why":"Independent review is a valid technique for evaluating changes, but it does not give the next implementation a specification to satisfy."},{"id":"c","text":"Describe the requirements in a longer, more detailed prose specification before asking for another attempt.","correct":false,"why":"More prose does not make the boundary case or the throughput target executable; failures would again be discovered only under load."},{"id":"d","text":"Write the test suite first, covering expected behavior, edge cases, and the throughput requirement, then iterate by sharing failing test output with Claude.","correct":true,"why":"When expected behavior is known, tests written first make every requirement checkable, and sharing failures guides each iteration precisely."}],"explanation":"Test-driven iteration means writing the test suite first, covering expected behavior, edge cases, and performance requirements, then iterating by sharing test failures. It turns a known specification into concrete pass/fail feedback for each attempt.","tags":["test-first","iterative-refinement","performance"]},{"id":"N-3.5-03","domain":"D3","task":"3.5","scenario":"S4","type":"single","select":1,"stem":"You are adding a read-through cache in front of a pricing service you have never worked with. You know the basic requirement, caching price lookups for a few minutes, but not the domain: which events should invalidate entries, what should happen when the pricing service is down, and whether stale prices are ever acceptable. You want these considerations surfaced before any code is written. Which technique does the guide describe for this?","options":[{"id":"a","text":"Use the interview pattern: ask Claude to question you about invalidation, failure modes, and staleness before implementing.","correct":true,"why":"The interview pattern has Claude ask questions that surface considerations the developer has not anticipated, which is the need in an unfamiliar domain."},{"id":"b","text":"Provide two or three input/output examples of cache hits and misses.","correct":false,"why":"Examples clarify a transformation you already understand; they cannot reveal invalidation events or failure modes you have not thought of."},{"id":"c","text":"Write the test suite first and let the failing tests reveal the missing requirements.","correct":false,"why":"Tests can only encode behavior you already know to expect; unknown considerations never become test cases."},{"id":"d","text":"Enter plan mode so Claude can read the pricing service's code and infer the requirements.","correct":false,"why":"Plan mode explores the codebase, but questions such as whether stale prices are acceptable are business decisions that code cannot answer."}],"explanation":"The interview pattern has Claude ask questions before implementing, surfacing design considerations such as cache invalidation strategies and failure modes. It is the technique for unfamiliar domains where the developer does not yet know what to specify.","tags":["interview-pattern","iterative-refinement","unfamiliar-domain"]},{"id":"N-3.5-04","domain":"D3","task":"3.5","scenario":"S2","type":"single","select":1,"stem":"A data-migration script that Claude generated copies customer rows into a new schema. It works on the sample data but crashes in staging on rows where legacy_phone or region is NULL. You have twice told Claude to handle nulls properly, and each revision still misses at least one case. What is the most effective way to fix the edge-case handling?","options":[{"id":"a","text":"Give Claude specific test cases: example input rows with NULL in each affected column and the exact expected output row for each.","correct":true,"why":"Specific cases with example input and expected output define precisely what handling nulls means for each column, removing the ambiguity that vague instructions left."},{"id":"b","text":"Ask Claude to interview you about the migration's goals before making another attempt.","correct":false,"why":"The interview pattern surfaces unknown considerations; here the failing cases are already known and just need to be stated precisely."},{"id":"c","text":"Add a standing instruction to the project CLAUDE.md to always handle NULL values defensively.","correct":false,"why":"This is the same vague instruction that already failed twice, moved into memory."},{"id":"d","text":"Re-run the request in plan mode so Claude can explore the schema before editing the script.","correct":false,"why":"The schema is not the unknown; the expected output for each null case is, and exploration does not supply it."}],"explanation":"For edge-case failures such as null values in migration scripts, the guide recommends providing specific test cases with example input and expected output. Concrete cases succeed where repeated general instructions do not.","tags":["test-cases","edge-cases","null-handling"]},{"id":"N-3.5-05","domain":"D3","task":"3.5","scenario":"S2","type":"multi","select":2,"stem":"Reviewing a report-generation module that Claude wrote, you find four defects: the paginator returns the wrong page when the page size changes; the sorter is applied after pagination instead of before it, so pages are ordered inconsistently; a docstring misspells the word threshold; and an unused import triggers a lint warning. The paginator and sorter fixes depend on each other, because correct output requires ordering before slicing. How should you feed these back to Claude? (Select TWO.)","options":[{"id":"a","text":"Fix the paginator first, wait for the result, then report the sorter problem in a follow-up message.","correct":false,"why":"Fixing interacting problems one at a time tends to reintroduce the earlier one, because each fix was made without knowing about the other."},{"id":"b","text":"Describe the paginator and sorter problems together in one detailed message, since their fixes interact.","correct":true,"why":"Interacting issues belong in a single message so Claude can design a fix that accounts for both at once."},{"id":"c","text":"Put all four defects in one message and let Claude choose the order, since a single message is always more efficient.","correct":false,"why":"The guide reserves batching for interacting issues; bundling unrelated cosmetic fixes with a coupled logic change muddles the iteration."},{"id":"d","text":"Address the docstring typo and the unused import in separate, sequential requests, since they are independent of everything else.","correct":true,"why":"Independent issues are handled sequentially, which keeps each change small and easy to verify."},{"id":"e","text":"Ask the same session to review its own module and find the defects itself.","correct":false,"why":"The defects are already identified; self-review by the generating session is also less effective than an independent instance."}],"explanation":"When fixes interact, all of the interacting issues go into a single detailed message; when issues are independent, they are addressed sequentially. The pagination and sorting defects are coupled, while the typo and unused import are not.","tags":["batch-vs-sequence","iterative-refinement","interacting-issues"]},{"id":"N-3.5-06","domain":"D3","task":"3.5","scenario":"S4","type":"multi","select":3,"stem":"You are writing an internal cheat sheet that maps common symptoms in Claude Code sessions to the refinement technique the guide recommends. Three engineers contributed symptoms: one keeps getting inconsistent implementations of a string transformation described in prose; one is implementing in an unfamiliar domain and worries about considerations she has not thought of; one knows the exact expected behavior and edge cases of a parser before implementation begins. Which THREE pairings are correct? (Select THREE.)","options":[{"id":"a","text":"Inconsistent transformation from a prose description: rewrite the description more carefully.","correct":false,"why":"The guide's remedy for inconsistently interpreted prose is examples, not more prose."},{"id":"b","text":"Inconsistent transformation from a prose description: provide two or three concrete input/output examples.","correct":true,"why":"Concrete input/output examples are the most effective way to communicate a transformation when prose is interpreted inconsistently."},{"id":"c","text":"Unfamiliar domain with unknown considerations: use the interview pattern so Claude asks questions before implementing.","correct":true,"why":"The interview pattern surfaces considerations the developer may not have anticipated before implementation."},{"id":"d","text":"Unfamiliar domain with unknown considerations: provide input/output examples of the desired result.","correct":false,"why":"Examples require knowing the desired result; they cannot reveal considerations the developer has not thought of."},{"id":"e","text":"Expected behavior and edge cases known up front: write the test suite first, then iterate by sharing failures.","correct":true,"why":"Test-driven iteration is the guide's technique when expected behavior is known before implementation."},{"id":"f","text":"Expected behavior known up front: collect every eventual defect into one message, since they will all interact.","correct":false,"why":"Batching is for issues whose fixes interact; it is not a default and says nothing about how to specify behavior up front."}],"explanation":"Each refinement technique matches a specific situation: input/output examples when prose is interpreted inconsistently, the interview pattern when the domain is unfamiliar and considerations are unknown, and writing tests first when expected behavior is already known.","tags":["io-examp
