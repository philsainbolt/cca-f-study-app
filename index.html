d carry a custom_id so that every response can be correlated back to the document it belongs to.","correct":true,"why":"The guide identifies custom_id as the mechanism for correlating batch request and response pairs."},{"id":"b","text":"Results are returned in the same order as submission, so correlation by position is sufficient.","correct":false,"why":"The design cannot rely on positional ordering; custom_id exists precisely to correlate responses with requests."},{"id":"c","text":"Processing can take up to 24 hours and there is no guaranteed latency SLA, so the morning report timing cannot be assumed.","correct":true,"why":"The guide states the batch window is up to 24 hours with no latency SLA, so the design must tolerate results arriving later than the morning run."},{"id":"d","text":"The 50% cost savings applies only when the batch contains at least 10,000 requests.","correct":false,"why":"The guide describes the savings as a property of the Batches API with no such volume threshold."},{"id":"e","text":"Requests may include tools and the batch will execute multi-turn tool calls before returning results.","correct":false,"why":"The Batches API does not support multi-turn tool calling within a single request."}],"explanation":"Two facts govern batch pipeline design: responses are correlated to requests through custom_id, not position, and processing can take up to 24 hours with no latency guarantee, so downstream steps must not assume results by a fixed time. The savings have no volume threshold and tools cannot be executed mid-request.","tags":["batch-api","custom-id","latency-sla"]},{"id":"N-4.6-01","domain":"D4","task":"4.6","scenario":"S5","type":"single","select":1,"stem":"Your CI workflow has Claude generate a data-migration script and then, in the same session, asks it to review the script it just wrote for defects. Over 40 runs, the self-review approved every script, including 7 that contained an off-by-one error in the batch loop and 3 that dropped rows on a null key. A reviewer given the same scripts cold found all 10. What is the most likely reason the self-review missed them?","options":[{"id":"a","text":"The review turn had too little context left after generation to re-read the script thoroughly.","correct":false,"why":"The scripts are short and the session was nowhere near its context limit; the issue is not capacity but perspective."},{"id":"b","text":"The model retained its reasoning context from generating the script, so it was unlikely to question the decisions it had already made.","correct":true,"why":"The guide identifies this self-review limitation: a model carrying its own generation reasoning tends to confirm rather than challenge its earlier choices."},{"id":"c","text":"The review instruction was phrased as a question rather than a command, so the model treated it as optional.","correct":false,"why":"Phrasing does not explain a 0-for-10 detection rate when an independent reviewer found every defect with the same code."},{"id":"d","text":"The defects are too subtle for any model to detect without running the script.","correct":false,"why":"A reviewer given the scripts without prior context found all ten, which shows the defects were detectable by review."}],"explanation":"Self-review inside the generating session is weakened by the reasoning context that produced the code: the model already believes its decisions were correct and is inclined to confirm them. An independent reviewer without that context evaluates the code on its own merits, which is why it catches what self-review misses.","tags":["self-review","reasoning-context","root-cause"]},{"id":"N-4.6-02","domain":"D4","task":"4.6","scenario":"S5","type":"single","select":1,"stem":"Your pipeline generates test cases and then asks the generating session to review them for gaps. In a seeded-defect experiment with 20 deliberately incomplete test suites, the self-review caught 4. Enabling extended thinking on the review turn raised that to 5, and adding \"be skeptical of your own work\" to the instruction raised it to 6. What change is most likely to produce a substantial improvement?","options":[{"id":"a","text":"Send the generated suites to a second, independent Claude instance that has none of the generator's reasoning context and ask it to find the gaps.","correct":true,"why":"The guide states that independent review instances without prior reasoning context are more effective at catching subtle issues than self-review instructions or extended thinking."},{"id":"b","text":"Have the generating session write the tests and the review criteria together so the criteria are tailored to each suite.","correct":false,"why":"Criteria written by the same session encode the same assumptions that produced the gaps, which makes the review even less independent."},{"id":"c","text":"Combine extended thinking with a longer, more detailed self-critique checklist in the same session.","correct":false,"why":"Both levers have already been tried and produced marginal gains; the generating session still carries the reasoning that led to the gaps."},{"id":"d","text":"Ask the generating session to review the suites a second time and report only the union of the two reviews.","correct":false,"why":"A second pass by the same session inherits the same context and the same blind spots, so it mostly repeats the first review."}],"explanation":"Instructions to be skeptical and extended thinking both operate inside the session that generated the output and cannot remove the generator's bias toward its own decisions. An independent instance reviewing the output without that context is the guide's recommended architecture for catching subtle issues.","tags":["independent-review","extended-thinking","self-review"]},{"id":"N-4.6-04","domain":"D4","task":"4.6","scenario":"S5","type":"single","select":1,"stem":"Your review pipeline now runs an independent verification instance over the generator's output. Product wants two lanes: findings the pipeline is sure about are posted directly as PR comments, while uncertain findings go to a human reviewer's queue rather than being posted or dropped. Today every finding is posted, and about a quarter of them are wrong. What should the verification pass be designed to produce so this routing is possible?","options":[{"id":"a","text":"Findings filtered to critical severity only, on the assumption that critical findings are the reliable ones.","correct":false,"why":"Severity measures impact, not certainty; a critical finding can be wrong and a minor one can be certain."},{"id":"b","text":"Three independent verification runs, posting only findings that all three agree on and discarding the rest.","correct":false,"why":"Consensus discards the uncertain findings instead of routing them to a human, and triples the cost of every review."},{"id":"c","text":"A self-reported confidence alongside each finding, so the pipeline can route high-confidence findings to the PR and lower-confidence ones to the human queue.","correct":true,"why":"The guide describes verification passes where the model self-reports confidence with each finding to enable calibrated review routing."},{"id":"d","text":"A single overall verdict of approve or request-changes for the whole PR, which decides whether any comments are posted.","correct":false,"why":"A PR-level verdict gives no per-finding signal, so the pipeline cannot separate confident findings from uncertain ones."}],"explanation":"Routing findings by certainty requires a per-finding certainty signal. A verification pass that self-reports confidence alongside each finding lets the pipeline post the confident ones automatically and send the rest to a human, which is what calibrated review routing means.","tags":["verification-pass","confidence","review-routing"]},{"id":"N-4.6-05","domain":"D4","task":"4.6","scenario":"S5","type":"multi","select":2,"stem":"You are presenting the CI reviewer architecture to an architecture review board. The design uses a separate Claude instance to review code produced by the generating instance, and splits reviews of large PRs into per-file passes plus a cross-file integration pass. A board member asks you to justify the added complexity over a single generate-then-self-review request. Which two justifications are supported by the guidance? (Select TWO.)","options":[{"id":"a","text":"A separate instance reviews without the generator's reasoning context, which makes it more likely to question decisions the generator would otherwise confirm.","correct":true,"why":"This is the guide's stated rationale for independent review instances over self-review in the same session."},{"id":"b","text":"Enabling extended thinking on the self-review turn achieves the same independence as a separate instance at lower cost.","correct":false,"why":"The guide ranks independent instances above both self-review instructions and extended thinking; thinking longer does not remove the generator's context."},{"id":"c","text":"Reviewing many files in one pass dilutes attention and produces contradictory findings, which focused per-file and integration passes avoid.","correct":true,"why":"Attention dilution and contradictory findings are the guide's stated reasons for multi-pass review of large changes."},{"id":"d","text":"Using a model with a larger context window for the single pass removes the need to split the review.","correct":false,"why":"Fitting all files in context does not solve attention dilution; the guide's remedy is splitting, not a larger window."},{"id":"e","text":"Self-review in the same session is reliable as long as the instruction explicitly asks the model to be skeptical of its own work.","correct":false,"why":"The guide identifies self-review instructions as less effective than independent instances because the generator's reasoning context persists."},{"id":"f","text":"Running the same review three times and keeping only findings that recur is what makes the multi-pass design reliable.","correct":false,"why":"The multi-pass design splits by file and by integration scope; repetition with majority voting is a different, and weaker, approach."}],"explanation":"Two independent principles justify the architecture. An independent instance lacks the generator's reasoning context and so is better at challenging its decisions than self-review instructions or extended thinking. Multi-pass review avoids the attention dilution and contradictory findings that come from processing many files in one pass, which larger context windows do not fix.","tags":["independent-review","multi-pass","architecture-justification"]},{"id":"N-4.6-06","domain":"D4","task":"4.6","scenario":"S5","type":"single","select":1,"stem":"After switching to per-file review passes, coverage is consistent and local defects are reliably caught. Last week, however, a PR changed a helper in utils/money.py to return amounts in cents instead of dollars, and three callers in other files still treated the value as dollars. Every per-file pass reported no issues, because each file was internally consistent. What should you add to the review architecture?","options":[{"id":"a","text":"Merge the per-file passes back into a single whole-PR pass so the model can see every file at once.","correct":false,"why":"Returning to one pass reintroduces the attention dilution that per-file passes fixed and does not focus on data flow specifically."},{"id":"b","text":"Give each per-file pass the full diff of every other file as background context so it can spot callers.","correct":false,"why":"This turns each per-file pass into a whole-PR pass, multiplying cost and reproducing the dilution problem in every pass."},{"id":"c","text":"Add a separate integration pass that traces cross-file data flow, such as how the changed return value is consumed by callers in other files.","correct":true,"why":"The guide's architecture pairs per-file passes with a distinct integration pass dedicated to cross-file data flow analysis, which is exactly where this defect lives."},{"id":"d","text":"Have a second independent instance repeat the per-file passes to catch what the first missed.","correct":false,"why":"The per-file passes did not miss anything within their scope; the defect exists only across files, which an independent repetition of the same scope cannot see."}],"explanation":"Per-file passes find local issues but by design cannot see how a change in one file affects consumers in others. The guide's multi-pass architecture complements them with a separate integration pass that analyzes cross-file data flow, which is where a changed unit or return type surfaces.","tags":["integration-pass","cross-file","data-flow"]},{"id":"N-5.1-01","domain":"D5","task":"5.1","scenario":"S1","type":"single","select":1,"stem":"Your support agent uses progressive summarization to keep 40-turn conversations within budget. Early in one session a customer reported a duplicate charge of $312.40 on order 55871 and said the refund had to post before the 15th. Twenty turns later the agent tells the customer the refund is \"being processed\" with no amount or date, and its process_refund call references a different order. The intermediate summaries show the detail was condensed to \"customer disputes a charge and wants a refund.\" What is the most effective fix?","options":[{"id":"a","text":"Raise the summarizer's token budget and instruct it to preserve all important details.","correct":false,"why":"The facts still live only inside a summary that is regenerated each cycle, so amounts, dates, and customer-stated expectations remain exposed to vague condensing."},{"id":"b","text":"Extract transactional facts (amounts, dates, order numbers, statuses) into a persistent case facts block that is included in every prompt, outside the summarized history.","correct":true,"why":"This is the guide's remedy: keep the critical facts in a dedicated block that summarization never touches, so every later turn sees the exact figures."},{"id":"c","text":"Switch to a model with a larger context window and pass the full transcript instead of summarizing.","correct":false,"why":"This postpones the problem rather than solving it; long multi-issue sessions with verbose tool results will still require compression, and the same risk returns."},{"id":"d","text":"Have the agent call lookup_order again before every refund to refresh the order details.","correct":false,"why":"An order lookup cannot recover the customer's stated deadline or which charge they disputed, and each call adds more tool output to the context."}],"explanation":"Progressive summarization tends to condense numerical values, dates, and customer-stated expectations into vague statements. The remedy is to pull transactional facts into a persistent case facts block carried in every prompt outside the summarized history, so the exact amount, order number, and deadline survive regardless of how the conversation is compressed.","tags":["case-facts","progressive-summarization","context-management"]},{"id":"N-5.1-02","domain":"D5","task":"5.1","scenario":"S1","type":"single","select":1,"stem":"A billing-dispute session covering three orders is hitting the context limit after only 14 turns. Token accounting shows that 71% of the context is occupied by lookup_order results: each call returns more than 40 fields, including warehouse codes, carrier metadata, and internal SKU attributes, while the agent only uses order status, item, amount, purchase date, and return window. The conversation text itself is small. What is the best first step?","options":[{"id":"a","text":"Trim each lookup_order result to the return-relevant fields before it is appended to the conversation.","correct":true,"why":"Tool results consume tokens out of proportion to their relevance; keeping only the five needed fields removes most of the bloat at its source."},{"id":"b","text":"Trigger progressive summarization at 50% context usage instead of 80%.","correct":false,"why":"Summarization compresses the conversation text, which is not the problem here, and it risks condensing the amounts and dates the dispute depends on."},{"id":"c","text":"Move order lookups into a subagent and return its full output to the main agent.","correct":false,"why":"If the subagent returns all 40+ fields, the same tokens land in the main agent's context; delegation only helps when the returned data is trimmed."},{"id":"d","text":"Ask the customer to open a separate session for each order.","correct":false,"why":"This pushes the system's problem onto the customer and breaks multi-issue handling instead of fixing what actually fills the context."}],"explanation":"Tool results accumulate in context and consume tokens disproportionately to their relevance. When each lookup returns 40+ fields and only five matter, the effective intervention is to trim the output to relevant fields before it accumulates, rather than compressing the conversation or relocating the same verbose payload.","tags":["tool-output-trimming","context-budget","lookup-order"]},{"id":"N-5.1-03","domain":"D5","task":"5.1","scenario":"S3","type":"multi","select":2,"stem":"Your synthesis subagent receives the concatenated outputs of nine document-analysis runs, about 60,000 tokens, in the order they completed. Across 25 evaluation topics, the final reports consistently incorporate findings from the first two and last two documents, while findings from documents four through six appear in fewer than 30% of reports even when they are the most relevant to the topic. Which two changes most directly address this? (Select TWO.)","options":[{"id":"a","text":"Increase max_tokens on the synthesis request so the model has room to address every document.","correct":false,"why":"The omissions are an input-attention effect, not an output-length limit; more room to write does not change what the model attends to."},{"id":"b","text":"Place a key-findings summary covering all nine documents at the beginning of the aggregated input.","correct":true,"why":"Models reliably process the start of long inputs, so a front-loaded summary ensures the middle documents' findings are seen where attention is strongest."},{"id":"c","text":"Switch to a model with a larger context window.","correct":false,"why":"The 60,000-token input already fits; the lost-in-the-middle effect is about position within the input, not capacity."},{"id":"d","text":"Instruct the synthesis agent that all nine documents are equally important and must each be cited.","correct":false,"why":"An instruction does not change positional attention; the guide's mitigation restructures the input rather than exhorting the model."},{"id":"e","text":"Organize the detailed results under explicit section headers, one per document or topic area.","correct":true,"why":"Explicit section headers make each document's findings a distinct, addressable block, which the guide pairs with a leading summary to mitigate position effects."},{"id":"f","text":"Have the analysis subagents return the full text of each document instead of extracted findings so nothing is lost.","correct":false,"why":"This makes the middle of the input far larger and worsens the very effect being fixed."}],"explanation":"The lost-in-the-middle effect means models reliably process the beginning and end of long inputs but may omit middle sections. The guide's mitigation is structural: place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers. Capacity or instruction changes do not address positional attention.","tags":["lost-in-the-middle","synthesis","input-ordering"]},{"id":"N-5.1-04","domain":"D5","task":"5.1","scenario":"S3","type":"single","select":1,"stem":"The report-generation subagent has a much smaller context budget than the document-analysis subagents that feed it. Each analysis subagent returns 15,000 to 20,000 tokens of narrative: its full reasoning chain about relevance, extended quotations, and a prose summary. With eight analyses per topic, the coordinator has to truncate the input, and the report silently drops the last three analyses. Which change is most effective?","options":[{"id":"a","text":"Have the report subagent summarize each analysis first and then write the report from its own summaries.","correct":false,"why":"The input must fit before it can be summarized, so the truncated analyses are still lost, and this adds a lossy step downstream of the real problem."},{"id":"b","text":"Split report generation into three passes over subsets of the analyses and concatenate the outputs.","correct":false,"why":"Each pass sees only a subset, so cross-source synthesis is lost; the guide's fix is to reduce upstream verbosity, not to fragment the report."},{"id":"c","text":"Give the report subagent the coordinator's context through automatic inheritance so it can see every analysis.","correct":false,"why":"Subagents do not automatically inherit the coordinator's context, and this would add tokens rather than reduce them."},{"id":"d","text":"Modify the analysis subagents to return structured data (key facts, citations, relevance scores) instead of reasoning chains and verbose content.","correct":true,"why":"When a downstream agent has a limited budget, the guide's remedy is to change what upstream agents return so the essential facts arrive in a compact structured form."}],"explanation":"When downstream agents have limited context budgets, the fix belongs upstream: modify the producing agents to return structured data such as key facts, citations, and relevance scores rather than verbose content and reasoning chains. Summarizing or splitting after the fact cannot recover what was already truncated.","tags":["structured-output","context-budget","upstream-agents"]},{"id":"N-5.1-05","domain":"D5","task":"5.1","scenario":"S1","type":"single","select":1,"stem":"Your agent answers a customer's first message correctly, but on later turns it behaves as if the conversation just started: it asks again for the order number it already received and ignores the return reason stated two turns earlier. Context usage is under 10%, no summarization is configured, and tool results are small. Inspecting the request payloads shows that each API call contains the system prompt and only the customer's newest message. What is the most likely root cause?","options":[{"id":"a","text":"The lost-in-the-middle effect is causing the earlier turns to be overlooked.","correct":false,"why":"That effect concerns long inputs where middle content is present but underweighted; here the earlier turns are not in the request at all."},{"id":"b","text":"The application is not passing the complete conversation history (prior user, assistant, and tool messages) in each subsequent API request.","correct":true,"why":"The payload shows only the newest message, so the model has no access to earlier turns; conversational coherence requires resending the full history each request."},{"id":"c","text":"Verbose tool outputs are crowding the conversation out of the context window.","correct":false,"why":"Context usage is under 10% and tool results are small, so nothing is being crowded out."},{"id":"d","text":"Progressive summarization is condensing the return reason into a vague summary.","correct":false,"why":"No summarization is configured, and the symptom is total absence of earlier turns rather than a vague version of them."}],"explanation":"The API is stateless: conversational coherence depends on passing the complete conversation history in each subsequent request. When payloads carry only the newest user message, the model cannot remember what was said earlier, regardless of context capacity or summarization settings.","tags":["conversation-history","root-cause","api-requests"]},{"id":"N-5.2-02","domain":"D5","task":"5.2","scenario":"S1","type":"single","select":1,"stem":"A customer writes: \"This is the third time I've had to contact you about this. I'm sick of dealing with bots.\" The agent calls lookup_order and sees that the replacement item shipped this morning with a tracking number. The customer has not asked to be transferred to a person. Which response best follows the recommended pattern?","options":[{"id":"a","text":"Escalate to a human immediately, since \"sick of dealing with bots\" signals that the customer wants a person.","correct":false,"why":"Frustration is not an explicit request for a human, and the issue is within the agent's capability; the guide reserves immediate escalation for explicit requests."},{"id":"b","text":"Ask the customer whether they would prefer a human before looking into the shipment.","correct":false,"why":"This delays a resolution the agent already has in hand; the pattern is to offer the resolution first and escalate only if the customer reiterates a preference."},{"id":"c","text":"Acknowledge the frustration, explain that the replacement shipped this morning and share the tracking number, and escalate if the customer then says they still want a human.","correct":true,"why":"This is the guide's pattern: acknowledge, offer resolution when it is within capability, and escalate only if the customer reiterates their preference."},{"id":"d","text":"Escalate immediately and tag the case with a strongly negative sentiment score so the human team can prioritize it.","correct":false,"why":"Sentiment-based escalation is an unreliable proxy for complexity, and this case is straightforward to resolve."}],"explanation":"When a customer is frustrated but has not explicitly asked for a human and the issue is within the agent's capability, the agent should acknowledge the frustration and offer the resolution, escalating only if the customer reiterates a preference for a person. Escalating on tone alone hands off cases the agent could have resolved.","tags":["frustration","offer-resolution","reiterated-preference"]},{"id":"N-5.2-03","domain":"D5","task":"5.2","scenario":"S1","type":"single","select":1,"stem":"Transcript review shows that when a customer opens with an explicit demand such as \"I need to talk to a real person about this charge,\" the agent calls get_customer and lookup_order, proposes a resolution, and only then offers a transfer. In 38% of these conversations the customer repeats the demand in stronger terms before the transfer happens, and post-contact satisfaction for this group is the lowest of any segment. What change should you make?","options":[{"id":"a","text":"Limit the pre-transfer investigation to a single get_customer call so the handoff includes a verified identity.","correct":false,"why":"Any investigation before honoring an explicit request still delays what the customer asked for; verification can happen after the handoff."},{"id":"b","text":"Escalate on the second explicit request, treating the first as an expression of frustration.","correct":false,"why":"The reiterate-then-escalate pattern applies to frustrated customers who have not asked for a human; an explicit demand should be honored the first time."},{"id":"c","text":"Add a sentiment threshold so strongly worded demands are escalated before investigation.","correct":false,"why":"The trigger is the explicit request itself, not its tone; a calm request for a human deserves the same immediate handoff."},{"id":"d","text":"Instruct the agent to call escalate_to_human immediately when a customer explicitly requests a human, before any investigation or proposed resolution.","correct":true,"why":"The guide directs agents to honor explicit requests for a human immediately without first attempting investigation."}],"explanation":"An explicit customer request for a human is a first-class escalation trigger that should be honored immediately, without first investigating or proposing a resolution. Attempting to resolve first, or waiting for the request to be repeated, misapplies patterns meant for customers who are merely frustrated.","tags":["explicit-human-request","immediate-escalation","escalate-to-human"]},{"id":"N-5.2-04","domain":"D5","task":"5.2","scenario":"S1","type":"single","select":1,"stem":"A customer says: \"Hi, this is Daniel Kim, I want to return the headphones I bought last month.\" get_customer returns three accounts named Daniel Kim. The agent picks the account with the most recent headphone purchase, initiates the return, and emails the return label to the wrong customer. This has happened in about 4% of sessions where the customer identifies by name only. What instruction should be added to the system prompt?","options":[{"id":"a","text":"When a lookup returns multiple matches, ask the customer for an additional identifier such as the order number, account email, or phone number before proceeding.","correct":true,"why":"The guide requires clarification with additional identifiers when tool results return multiple matches, rather than choosing among them."},{"id":"b","text":"When multiple accounts match, choose the one whose recent order contains the item the customer described.","correct":false,"why":"This is heuristic selection, the exact behavior that produced the misdirected return label."},{"id":"c","text":"Modify get_customer to return only the single most recently active matching account so the agent never sees multiple matches.","correct":false,"why":"This hides the ambiguity inside the tool and silently picks an account on a heuristic the agent cannot even see."},{"id":"d","text":"Escalate to a human whenever a lookup returns more than one match.","correct":false,"why":"Ambiguous identity is resolved by asking for another identifier, which the agent can do itself; escalating here needlessly lowers first-contact resolution."}],"explanation":"Multiple customer matches require clarification, not heuristic selection. The agent should ask for an additional identifier that uniquely resolves the account before taking any action. Choosing by recency or item match, or having the tool pre-select, both risk acting on the wrong account.","tags":["multiple-matches","clarification","identifiers"]},{"id":"N-5.2-05","domain":"D5","task":"5.2","scenario":"S1","type":"single","select":1,"stem":"Three weeks ago your team added a rule: escalate whenever a sentiment classifier scores the customer's message below -0.4. Escalations rose from 12% to 34% of conversations, but first-contact resolution did not improve. An audit of escalated cases finds that 80% were routine tracking or address-change requests from customers who were merely irritated, while several policy-exception requests from calm customers were still resolved autonomously and later reversed. What is the most likely root cause?","options":[{"id":"a","text":"The threshold is too lenient; tightening it to -0.7 would restore the balance.","correct":false,"why":"A stricter threshold still keys escalation to tone, so irritated routine cases continue to leak through and calm policy exceptions are still missed."},{"id":"b","text":"Sentiment does not correlate with case complexity, so the rule escalates the wrong cases; escalation should key on explicit human requests, policy gaps, and inability to make progress.","correct":true,"why":"The audit shows precisely the mismatch the guide warns about: tone flags routine cases while the genuinely escalation-worthy policy exceptions come from calm customers."},{"id":"c","text":"The classifier is miscalibrated for this customer base and needs retraining on support transcripts.","correct":false,"why":"A more accurate sentiment score would still measure the wrong thing; the problem is the choice of signal, not its precision."},{"id":"d","text":"The rule needs a second signal: also require the agent's self-reported confidence to be below 6 out of 10.","correct":false,"why":"Self-reported confidence is also an unreliable proxy; the agent was confident while approving the policy exceptions it should have escalated."}],"explanation":"Sentiment-based escalation and self-reported confidence are unreliable proxies for case complexity. Frustrated customers often have routine issues, and calm customers can present policy exceptions. Escalation should be driven by explicit triggers: requests for a human, policy gaps, and inability to make meaningful progress.","tags":["sentiment-escalation","root-cause","unreliable-proxies"]},{"id":"N-5.3-01","domain":"D5","task":"5.3","scenario":"S3","type":"single","select":1,"stem":"The document-analysis subagent queries an academic archive. When the archive times out, the subagent catches the exception and returns {\"findings\": []}, which is the same payload it returns when a query legitimately matches no papers. The coordinator treats every empty payload as \"no literature exists,\" and in 18% of reports it states that no studies were found on topics for which the archive holds dozens of papers. What is the most effective fix?","options":[{"id":"a","text":"Have the coordinator retry any subtask that returns an empty result up to three times before accepting it.","correct":false,"why":"This retries genuinely empty results at extra cost and still leaves the coordinator unable to tell an outage from a real absence of matches."},{"id":"b","text":"Return a generic \"archive unavailable\" status for both cases so the coordinator knows to skip that topic.","correct":false,"why":"A generic status hides what actually happened and mislabels valid empty results as outages, so the coordinator cannot make an informed decision."},{"id":"c","text":"Have the subagent report access failures with the failure type and the attempted query, distinctly from successful queries that simply returned no matches.","correct":true,"why":"Distinguishing an access failure from a valid empty result lets the coordinator retry or reroute only when the source was actually unreachable."},{"id":"d","text":"Raise the archive client's timeout from 10 seconds to 60 seconds.","correct":false,"why":"A longer timeout may reduce how often failures occur but does nothing to tell the coordinator what happened when one does."}],"explanation":"Access failures such as timeouts need retry decisions, while valid empty results are successful queries with no matches. Reporting both as an empty success silently suppresses the failure. The subagent must distinguish the two in its error reporting, including the failure type and attempted query, so the coordinator can decide appropriately.","tags":["access-failure","empty-result","error-reporting"]},{"id":"N-5.3-03","domain":"D5","task":"5.3","scenario":"S3","type":"single","select":1,"stem":"A research run comparing four regulatory jurisdictions completes, but the document-analysis subagent reported that every source for one jurisdiction sat behind a paywall it could not access. The coordinator correctly proceeded with the other three. The final report, however, is written as a comprehensive four-jurisdiction comparison, and a reader made a compliance decision about the unsourced jurisdiction based on it. How should the synthesis output be structured to prevent this?","options":[{"id":"a","text":"Annotate the synthesis with coverage: mark which findings are well-supported and state explicitly that the fourth jurisdiction has a gap because its sources were unavailable.","correct":true,"why":"Coverage annotations tell the reader exactly which conclusions rest on evidence and which topic areas could not be researched."},{"id":"b","text":"Stop report generation whenever any jurisdiction's sources are unavailable and return an error to the requester.","correct":false,"why":"This terminates the workflow over one failure and discards three complete, well-supported analyses."},{"id":"c","text":"Omit the unsourced jurisdiction from the report entirely so that nothing unsupported appears.","correct":false,"why":"Silently dropping the topic leaves the reader assuming the comparison was comprehensive; the gap itself is information the reader needs."},{"id":"d","text":"Add a standard disclaimer to every report stating that some sources may have been unavailable.","correct":false,"why":"A generic disclaimer does not identify which findings are affected, so the reader still cannot tell which jurisdiction lacks support."}],"explanation":"When the coordinator proceeds with partial results, the synthesis output must carry coverage annotations indicating which findings are well-supported and which topic areas have gaps due to unavailable sources. Neither terminating the run nor silently omitting the gap serves the reader.","tags":["coverage-annotations","synthesis","partial-results"]},{"id":"N-5.3-04","domain":"D5","task":"5.3","scenario":"S3","type":"multi","select":3,"stem":"Your coordinator receives the string \"search unavailable\" from the web-search subagent in about 7% of assignments. With only that status it cannot decide whether to reformulate the query, route the question to the document-analysis subagent, or proceed with what has already been gathered, so it currently re-runs the identical search, which fails again 90% of the time. You are redefining the subagent's error payload. Which three elements should it contain? (Select THREE.)","options":[{"id":"a","text":"The failure type, distinguishing a timeout from an authentication failure from a rate limit.","correct":true,"why":"The failure type determines whether a retry, a credential fix, or a different source is the right recovery."},{"id":"b","text":"The subagent's complete transcript, including its reasoning, so the coordinator has full visibility.","correct":false,"why":"Verbose reasoning floods the coordinator's context; the coordinator needs structured facts, not the whole conversation."},{"id":"c","text":"The query that was being attempted when the failure occurred.","correct":true,"why":"Knowing the attempted query lets the coordinator reformulate it or hand it to another subagent."},{"id":"d","text":"The HTTP client's stack trace at the point of failure.","correct":false,"why":"A stack trace is implementation detail that does not inform a recovery decision and adds noise to the coordinator's context."},{"id":"e","text":"Any partial results gathered before the failure.","correct":true,"why":"Partial results let the coordinator proceed with what was found instead of discarding completed work."},{"id":"f","text":"The subagent's self-reported confidence that a retry will succeed.","correct":false,"why":"Self-reported confidence is an unreliable signal; the coordinator should decide from the failure type and what was attempted."}],"explanation":"Generic error statuses hide valuable context. Structured error context, including the failure type, the attempted query, partial results, and alternative approaches, is what enables intelligent coordinator recovery decisions. Transcripts and stack traces add volume without helping the decision.","tags":["structured-error-context","generic-status","coordinator-recovery"]},{"id":"N-5.4-01","domain":"D5","task":"5.4","scenario":"S4","type":"single","select":1,"stem":"An engineer has spent 90 minutes using the productivity agent to understand a legacy payments monolith. Early in the session the agent read PaymentRetryPolicy and reported that it retries three times with a fixed 30-second delay. Asked the same question now, it answers that \"services like this typically use exponential backoff\" and names no class. Its answers about other components have also drifted from what it found earlier. What is the most effective way to counteract this?","options":[{"id":"a","text":"Add the payment framework's documentation to CLAUDE.md so the agent has authoritative reference material.","correct":false,"why":"The specifics were already discovered from the code; the problem is retaining session findings, which CLAUDE.md, meant for durable project conventions, does not address."},{"id":"b","text":"Have the agent maintain a scratchpad file recording key findings as it discovers them, and reference that file when answering subsequent questions.","correct":true,"why":"A scratchpad persists concrete findings across context boundaries so later answers cite what was actually found rather than typical patterns."},{"id":"c","text":"Start a fresh session and have the agent re-read every file it explored.","correct":false,"why":"This discards 90 minutes of work, and the new session will degrade the same way once it fills with exploration output."},{"id":"d","text":"Increase max_tokens so the agent can produce more detailed answers.","correct":false,"why":"Output length has nothing to do with the agent losing track of earlier findings."}],"explanation":"In extended exploration sessions, context degradation shows up as inconsistent answers that cite typical patterns instead of the specific classes discovered earlier. The guide's remedy is a scratchpad file that records key findings and is referenced for subsequent questions.","tags":["scratchpad","context-degradation","codebase-exploration"]},{"id":"N-5.4-02","domain":"D5","task":"5.4","scenario":"S2","type":"single","select":1,"stem":"Two hours into a Claude Code session exploring an unfamiliar service, the context is at 85%. Most of it is raw Grep and Read output from the discovery phase, and the conclusions from that phase have already been recorded in a NOTES.md scratchpad. The developer wants to keep working in the same session on the next set of questions about the service. What is the best next step?","options":[{"id":"a","text":"Start a new session and use --resume to reload the current one whenever the earlier findings are needed.","correct":false,"why":"Resuming restores the entire session, verbose output included, and splitting the work across sessions breaks the working thread."},{"id":"b","text":"Use /memory to move the discovery output into CLAUDE.md.","correct":false,"why":"CLAUDE.md holds durable project instructions; loading raw discovery output into it bloats every future session."},{"id":"c","text":"Use fork_session to branch the conversation before continuing.","correct":false,"why":"A fork copies the full context, so the branch starts at the same 85% usage."},{"id":"d","text":"Run /compact to condense the verbose discovery output, then continue in the same session, consulting NOTES.md for specifics.","correct":true,"why":"/compact is the guide's tool for reducing context usage during extended exploration once it fills with verbose discovery output."}],"explanation":"When an extended exploration session's context fills with verbose discovery output, /compact reduces context usage so work can continue in the same session. Because compaction is lossy, keeping key findings in a scratchpad first preserves the specifics.","tags":["compact","context-usage","claude-code"]},{"id":"N-5.4-03","domain":"D5","task":"5.4","scenario":"S4","type":"multi","select":2,"stem":"You are designing a three-phase exploration workflow for legacy codebases: map the module structure, trace the refund flow's dependencies, then find test coverage for the modules touched. In the prototype, the main agent runs all three phases itself; by phase two its context is dominated by thousands of lines of Grep output, and by phase three it can no longer recall which modules phase one identified. Which two design changes address this? (Select TWO.)","options":[{"id":"a","text":"Give each phase-two and phase-three subagent the main agent's entire phase-one transcript as its prompt.","correct":false,"why":"This copies the verbose output into every subagent, reproducing the bloat instead of isolating it."},{"id":"b","text":"Rely on subagents automatically inheriting the main agent's context so they know what earlier phases found.","correct":false,"why":"Subagents do not inherit the parent's context; findings must be passed explicitly."},{"id":"c","text":"Delegate each specific question, such as \"find all test files for these modules\" or \"trace refund flow dependencies,\" to a subagent whose verbose tool output stays in its own context while the main agent coordinates.","correct":true,"why":"Subagent delegation isolates verbose exploration output so the main agent keeps only high-level understanding."},{"id":"d","text":"Run the whole workflow in the main agent with a model that has a larger context window.","correct":false,"why":"More capacity delays but does not prevent degradation, and verbose output still displaces the phase-one findings."},{"id":"e","text":"Summarize the key findings at the end of each phase and inject that summary into the initial context of the next phase's subagents.","correct":true,"why":"Phase summaries carry forward what matters in compact form, so later subagents start with the modules already identified."},{"id":"f","text":"Have each subagent return its full Read and Grep output to the main agent so nothing is lost.","correct":false,"why":"Returning raw output moves the verbose content straight back into the main agent's context."}],"explanation":"Verbose exploration output should be isolated in subagents that investigate specific questions while the main agent preserves high-level coordination, and key findings from one phase should be summarized and injected into the initial context of the next phase's subagents. Copying transcripts or expecting automatic inheritance does neither.","tags":["subagent-delegation","phase-summaries","exploration-workflow"]},{"id":"N-5.4-04","domain":"D5","task":"5.4","scenario":"S4","type":"single","select":1,"stem":"Your exploration coordinator spawns seven subagents, each taking five to ten minutes. When the host process crashed after four had finished, the restarted coordinator had no record of their results and re-ran all seven, wasting 40 minutes. Each subagent already writes its findings to a scratchpad file, but the coordinator does not know which subagents completed or where their outputs live. Which design provides crash recovery?","options":[{"id":"a","text":"Have each agent export structured state to a known location, and have the coordinator load a manifest on resume and inject the recovered state into the prompts of the remaining agents.","correct":true,"why":"This is the guide's crash-recovery pattern: known state locations plus a manifest the coordinator loads to resume from where the work stopped."},{"id":"b","text":"Resume the coordinator's session by name so its conversation history is restored.","correct":false,"why":"Session resumption restores the coordinator's own transcript but carries no structured record of which subagents completed or where their outputs are."},{"id":"c","text":"Make every subagent idempotent so that re-running all seven after a crash is always safe.","correct":false,"why":"Safety is not the problem; re-running completed work is exactly the 40 minutes being wasted."},{"id":"d","text":"Keep every subagent's results in the coordinator's in-memory context so they are available after restart.","correct":false,"why":"In-memory state is lost in the crash, which is the situation being designed for."}],"explanation":"Structured state persistence for crash recovery means each agent exports its state to a known location and the coordinator loads a manifest on resume, injecting the recovered state into agent prompts. Session resumption alone restores a transcript, not the completion state of the delegated work.","tags":["crash-recovery","manifest","state-persistence"]},{"id":"N-5.4-05","domain":"D5","task":"5.4","scenario":"S4","type":"single","select":1,"stem":"An engineer asks the productivity agent to trace every dependency of the refund flow in a 400-module codebase. The main agent performs the trace itself with Grep and Read; after roughly 35 tool calls its context is 70% consumed by file contents, and its follow-up answers about the overall architecture become vague. You want the trace done thoroughly without degrading the main conversation. Which approach is recommended?","options":[{"id":"a","text":"Instruct the main agent to use Grep with tighter patterns instead of Read so that less content enters its context.","correct":false,"why":"Narrower searches reduce the volume somewhat, but the exploration output still accumulates in the main agent's context."},{"id":"b","text":"Run /compact after every ten tool calls during the trace.","correct":false,"why":"Repeated mid-trace compaction can drop dependencies already found and does nothing to keep the next batch of verbose output out of the main context."},{"id":"c","text":"Spawn an Explore-style subagent to perform the trace and return a concise summary of the dependencies, while the main agent continues coordinating the session.","correct":true,"why":"Subagent delegation keeps the verbose exploration output in the subagent's context and hands the main agent only the high-level result."},{"id":"d","text":"Ask the engineer to narrow the request to one module at a time.","correct":false,"why":"This pushes the work onto the engineer and still lands every module's output in the main agent's context over time."}],"explanation":"Verbose exploration such as a dependency trace should be delegated to a subagent, which isolates the tool output in its own context and returns a concise summary. The main agent keeps its context for high-level coordination instead of filling it with file contents.","tags":["explore-subagent","verbose-output","delegation"]},{"id":"N-5.5-01","domain":"D5","task":"5.5","scenario":"S6","type":"single","select":1,"stem":"Your extraction pipeline reports 97.4% field accuracy on last month's 12,000 documents, above the 95% target, and leadership wants to stop human review for extractions scored above 0.9. The corpus is 70% typed invoices, 20% scanned purchase orders, and 10% handwritten delivery receipts. The accounts-payable team mentions that roughly one in six receipt totals it receives is wrong. What should you do before reducing review?","options":[{"id":"a","text":"Approve the change; 97.4% exceeds the target and the receipts complaint is anecdotal.","correct":false,"why":"An aggregate dominated by invoices can sit above target while a minority segment fails badly; the complaint is exactly the signal the aggregate hides."},{"id":"b","text":"Raise the automation threshold to 0.95 and re-check that aggregate accuracy reaches 99%.","correct":false,"why":"A higher aggregate is still an aggregate; it does not reveal which document types or fields are weak."},{"id":"c","text":"Route handwritten receipts to a larger model, then automate all high-confidence extractions.","correct":false,"why":"This acts on one guess before measuring; other document types or specific fields may also be underperforming."},{"id":"d","text":"Break accuracy down by document type and by field, and automate only for the segments that individually meet the target.","correct":true,"why":"The guide requires validating accuracy by document type and field before automating high-confidence extractions, because aggregates mask weak segments."}],"explanation":"Aggregate accuracy can mask poor performance on specific document types or fields. Before reducing human review, accuracy must be analyzed by document type and field, and automation applied only where each segment meets the target. Raising the aggregate or fixing one guessed segment does not establish that.","tags":["aggregate-accuracy","segment-analysis","human-review"]},{"id":"N-5.5-02","domain":"D5","task":"5.5","scenario":"S6","type":"single","select":1,"stem":"You automated high-confidence extractions three months ago and now review only extractions below the threshold. A supplier then changed its invoice template so that the \"amount due\" and \"amount paid\" columns swapped positions; the model kept extracting with high confidence, and the wrong totals flowed into accounting for five weeks before an auditor noticed. Which practice would have detected this earlier?","options":[{"id":"a","text":"Alerting when the average confidence score across each day's batch drops.","correct":false,"why":"The model stayed confident while being wrong, so a novel error pattern of this kind never appears as confidence drift."},{"id":"b","text":"Stratified random sampling of high-confidence extractions across document types and suppliers for ongoing human review, measuring the error rate and surfacing new patterns.","correct":true,"why":"Sampling the automated tier is how the guide detects error rate changes and novel error patterns that confidence scores miss."},{"id":"c","text":"Reviewing the lowest-confidence 5% of extractions more thoroughly.","correct":false,"why":"The low-confidence tier was already being reviewed; the failure was entirely inside the high-confidence tier."},{"id":"d","text":"Extracting each document twice and flagging documents where the two extractions disagree.","correct":false,"why":"Both extractions read the same swapped layout and would agree with each other, so the error stays invisible."}],"explanation":"Once high-confidence extractions are automated, stratified random sampling of that tier is required for ongoing error rate measurement and for detecting novel error patterns. Confidence-based signals cannot catch cases where the model is confidently wrong on a new layout.","tags":["stratified-sampling","novel-error-patterns","automation"]},{"id":"N-5.5-03","domain":"D5","task":"5.5","scenario":"S6","type":"multi","select":2,"stem":"Your pipeline outputs a single confidence number per document, and the review threshold of 0.8 was chosen by intuition. Reviewers report that most of their time is spent confirming extractions that were already correct, while a lease contract scored 0.93 went unreviewed and its termination_date field was wrong. Which two changes should you make? (Select TWO.)","options":[{"id":"a","text":"Have the model output a confidence score for each field rather than a single score per document.","correct":true,"why":"Field-level confidence lets review attention land on the specific field in doubt instead of the whole document."},{"id":"b","text":"Raise the document-level threshold to 0.95 so more documents reach the reviewers.","correct":false,"why":"This sends even more already-correct documents to review and still cannot single out the one wrong field."},{"id":"c","text":"Route documents to review by page count, since longer documents contain more errors.","correct":false,"why":"Page count is a heuristic unrelated to whether a given field was extracted correctly."},{"id":"d","text":"Calibrate the review thresholds against a labeled validation set so that a given score corresponds to a measured accuracy.","correct":true,"why":"Thresholds chosen by intuition have no known relationship to accuracy; calibration on labeled data makes the routing decision evidence-based."},{"id":"e","text":"Extract each document twice and review only the documents where the two extractions disagree.","correct":false,"why":"Agreement between two runs does not establish correctness and provides no calibrated threshold for routing."}],"explanation":"Effective review routing depends on field-level confidence scores calibrated using labeled validation sets. Document-level scores cannot direct attention to the field in doubt, and thresholds chosen by intuition or replaced by heuristics such as page count or run agreement have no measured relationship to accuracy.","tags":["field-level-confidence","calibration","validation-set"]},{"id":"N-5.5-04","domain":"D5","task":"5.5","scenario":"S6","type":"multi","select":2,"stem":"Your pipeline processes 2,000 documents a day and the review team can examine about 300 of them. Field-level confidence scores are already calibrated on a labeled validation set. Which two categories of extraction should be prioritized for the limited review capacity? (Select TWO.)","options":[{"id":"a","text":"Extractions where a required field was returned as null, since null indicates the model was unsure.","correct":false,"why":"A null means the information was absent from the source, which is the intended behavior rather than a sign of uncertainty."},{"id":"b","text":"Extractions with low calibrated confidence on their required fields.","correct":true,"why":"Low field-level confidence is the primary routing signal the guide names for directing scarce reviewer attention."},{"id":"c","text":"All extractions from the largest-volume supplier, since errors there have the greatest financial impact.","correct":false,"why":"Volume says nothing about error likelihood and would consume the entire review budget on mostly correct documents."},{"id":"d","text":"Extractions that passed JSON schema validation, since validation cannot detect semantic errors.","correct":false,"why":"Nearly every extraction passes schema validation, so this is not a prioritization at all."},{"id":"e","text":"Extractions from source documents that are themselves ambiguous or contain contradictory values, such as two different totals.","correct":true,"why":"The guide routes ambiguous or contradictory source documents to human review alongside low-confidence extractions."}],"explanation":"With limited reviewer capacity, review should be prioritized for extractions with low model confidence and for documents whose source content is ambiguous or contradictory. Nulls, supplier volume, and schema-validation status are not indicators of extraction error.","tags":["review-routing","reviewer-capacity","ambiguous-sources"]},{"id":"N-5.5-05","domain":"D5","task":"5.5","scenario":"S6","type":"single","select":1,"stem":"On a labeled validation set of 1,500 documents, extractions the model scores between 0.90 and 0.95 are 98% accurate for invoices but only 79% accurate for lease contracts, and the effective_date field is the weakest at every score level. Your current rule automates any field scored above 0.9 regardless of document type. How should the review thresholds be set?","options":[{"id":"a","text":"Keep a single global threshold but raise it to 0.97.","correct":false,"why":"A single threshold over-reviews invoices and may still under-review contracts, because the same score maps to different accuracies in different segments."},{"id":"b","text":"Prompt the model to score contracts more conservatively.","correct":false,"why":"This adjusts the model's self-reported number without measuring anything; calibration must come from labeled data."},{"id":"c","text":"Calibrate thresholds per document type and per field using the labeled set, automating only where the measured accuracy at that score meets the target.","correct":true,"why":"Calibration against labeled data per segment turns a raw score into a known accuracy, which is what an automation decision needs."},{"id":"d","text":"Treat the model's score as the accuracy and automate anything scored above 0.95.","correct":false,"why":"The validation set shows the score is not the accuracy; contracts scored above 0.9 are only 79% accurate."}],"explanation":"Confidence scores are only useful for routing after they are calibrated against labeled validation sets, and calibration must be checked by document type and field because the same score can correspond to very different accuracies. Thresholds should therefore be set per segment from measured accuracy.","tags":["calibration","per-segment-thresholds","confidence-scores"]},{"id":"N-5.6-01","domain":"D5","task":"5.6","scenario":"S3","type":"multi","select":2,"stem":"Your final reports cite a source for only about 40% of their factual claims, even though the web-search subagent records a URL for every page it reads. The document-analysis subagent returns a prose summary per document, and the synthesis subagent merges those summaries into a narrative before the report is written. Reviewers cannot tell which document supports which claim. Which two changes are needed to preserve provenance end to end? (Select TWO.)","options":[{"id":"a","text":"Instruct the synthesis subagent to always cite a source for every claim it writes.","correct":false,"why":"By the time synthesis runs, the claim-to-source mapping has already been lost in the prose summaries, so the instruction cannot be satisfied reliably."},{"id":"b","text":"Require the document-analysis subagent to output structured claim-source mappings: each claim with its source URL or document name and the relevant excerpt.","correct":true,"why":"Attribution has to be captured as structured data at the point of analysis; a prose summary discards it before anyone downstream can use it."},{"id":"c","text":"Append a bibliography of every source consulted at the end of each report.","correct":false,"why":"A bibliography lists sources but does not connect any specific claim to the document that supports it."},{"id":"d","text":"Have the synthesis subagent run a web search for each unsourced claim after drafting the report.","correct":false,"why":"Post-hoc searching may attach a different source than the one that actually supported the claim and adds cost to recover information that was already available."},{"id":"e","text":"Require the synthesis subagent to preserve and merge the claim-source mappings when it combines findings, rather than re-summarizing them into unattributed narrative.","correct":true,"why":"Provenance is lost at every compression step that drops the mapping, so synthesis must carry the mappings through rather than flatten them."},{"id":"f","text":"Have the web-search subagent include the page URL inside its prose summary of each page.","correct":false,"why":"A URL embedded in prose is still unstructured and is the first thing dropped when the summary is compressed; the mapping must be a structured field per claim."}],"explanation":"Source attribution is lost when findings are compressed into summaries without preserving claim-source mappings. Subagents must output structured claim-source mappings with URLs, document names, and excerpts, and the synthesis agent must preserve and merge those mappings when combining findings instead of re-summarizing into unattributed prose.","tags":["claim-source-mapping","provenance","synthesis-merge"]},{"id":"N-5.6-02","domain":"D5","task":"5.6","scenario":"S3","type":"multi","select":2,"stem":"A delivered report states that a market grew 12% last year. An audit finds that the document-analysis subagent had read two credible industry reports, one giving 12% and one giving 19%, selected the value from the source it judged more authoritative, and passed only that value forward; the synthesis then presented the figure as settled. Which two changes should you make? (Select TWO.)","options":[{"id":"a","text":"Have the analysis subagent complete its output with both values included and explicitly annotated with source attribution, leaving reconciliation to the coordinator before synthesis.","correct":true,"why":"The guide has the analysis step preserve conflicting values with attribution so the coordinator, not the subagent, decides how to reconcile them."},{"id":"b","text":"Have the analysis subagent select the value from the more recently published report and note the choice.","correct":false,"why":"Recency is another arbitrary selection rule; the conflict itself is information the report should carry."},{"id":"c","text":"Have the analysis subagent average the two values and report the range in a footnote.","correct":false,"why":"Averaging produces a number neither source reported and buries the disagreement."},{"id":"d","text":"Structure the report with explicit sections separating well-established findings from contested ones, preserving each source's original characterization and methodological context.","correct":true,"why":"Readers need to see which findings are settled and which are disputed, with the sources' own framing intact."},{"id":"e","text":"Have the synthesis subagent omit any statistic on which the sources disagree.","correct":false,"why":"Dropping contested figures suppresses useful information instead of presenting the uncertainty."}],"explanation":"Conflicting statistics from credible sources should be annotated with source attribution rather than resolved by arbitrary selection. The analysis step passes both values forward for the coordinator to reconcile, and the report is structured to distinguish well-established from contested findings while preserving original characterizations.","tags":["conflicting-sources","contested-findings","coordinator-reconciliation"]},{"id":"N-5.6-03","domain":"D5","task":"5.6","scenario":"S3","type":"single","select":1,"stem":"Your synthesis subagent flagged a contradiction in a draft report: one source states that 22% of hospitals use a technology and another states 47%. On inspection, the first figure comes from a 2019 survey and the second from a 2024 survey, and both are accurate. The analysis subagent's structured output carries the claim, the source, and an excerpt, but no dates. Which change prevents this misinterpretation?","options":[{"id":"a","text":"Instruct the synthesis subagent to prefer the figure drawn from the larger sample.","correct":false,"why":"Sample size does not explain the difference; the figures describe different years and both belong in the report."},{"id":"b","text":"Have the coordinator keep only the most recent value whenever two sources disagree.","correct":false,"why":"The coordinator cannot know which value is more recent without dates, and discarding the older figure erases a real trend."},{"id":"c","text":"Instruct the synthesis subagent to resolve contradictions by reasoning about which source is more credible.","correct":false,"why":"There is no contradiction to resolve, and credibility judgments cannot reveal that the surveys were five years apart."},{"id":"d","text":"Require the analysis subagent to include publication or data-collection dates in its structured output so synthesis can interpret the two figures as change over time.","correct":true,"why":"Dates in the structured output are what let downstream agents distinguish a temporal difference from a genuine disagreement."}],"explanation":"Temporal differences are misread as contradictions when structured outputs lack dates. Requiring subagents to include publication or data-collection dates lets synthesis interpret differing figures correctly, as a change over time rather than a conflict to be resolved.","tags":["temporal-data","publication-dates","false-contradiction"]},{"id":"N-5.6-04","domain":"D5","task":"5.6","scenario":"S3","type":"single","select":1,"stem":"The report-generation subagent converts every finding into bulleted lists. Stakeholders complain that a five-year revenue comparison across four companies is unreadable as bullets, that the background narrative on a regulatory change reads as disconnected fragments, and that the API compatibility findings are the only section they like. How should the report subagent be instructed to render content?","options":[{"id":"a","text":"Render content by type: financial comparisons as tables, news and background narrative as prose, and technical findings as structured lists.","correct":true,"why":"The guide calls for rendering each content type appropriately rather than forcing everything into one format."},{"id":"b","text":"Render everything as prose so the report reads as a continuous narrative.","correct":false,"why":"Prose makes the multi-company revenue comparison hard to scan and loses the structure that works well for the technical findings."},{"id":"c","text":"Render everything as tables for consistency across sections.","correct":false,"why":"Narrative context does not fit a tabular format, and a uniform format is the mistake being corrected."},{"id":"d","text":"Choose one format per report based on whichever content type is most common in that report.","correct":false,"why":"A majority rule still forces the minority content types into an unsuitable format within the same report."}],"explanation":"Synthesis outputs should render different content types appropriately: financial data as tables, news as prose, and technical findings as structured lists. Converting everything to a single uniform format degrades whichever content types do not fit it.","tags":["rendering","content-types","report-format"]}],"retired":[],"blueprint":{"domains":{"D1":{"name":"Agentic Architecture & Orchestration","weight":27},"D2":{"name":"Tool Design & MCP Integration","weight":18},"D3":{"name":"Claude Code Configuration & Workflows","weight":20},"D4":{"name":"Prompt Engineering & Structured Output","weight":20},"D5":{"name":"Context Management & Reliability","weight":15}},"tasks":[{"id":"1.1","domain":"D1","title":"Design and implement agentic loops for autonomous task execution"},{"id":"1.2","domain":"D1","title":"Orchestrate multi-agent systems with coordinator-subagent patterns"},{"id":"1.3","domain":"D1","title":"Configure subagent invocation, context passing, and spawning"},{"id":"1.4","domain":"D1","title":"Implement multi-step workflows with enforcement and handoff patterns"},{"id":"1.5","domain":"D1","title":"Apply Agent SDK hooks for tool call interception and data normalization"},{"id":"1.6","domain":"D1","title":"Design task decomposition strategies for complex workflows"},{"id":"1.7","domain":"D1","title":"Manage session state, resumption, and forking"},{"id":"2.1","domain":"D2","title":"Design effective tool interfaces with clear descriptions and boundaries"},{"id":"2.2","domain":"D2","title":"Implement structured error responses for MCP tools"},{"id":"2.3","domain":"D2","title":"Distribute tools appropriately across agents and configure tool choice"},{"id":"2.4","domain":"D2","title":"Integrate MCP servers into Claude Code and agent workflows"},{"id":"2.5","domain":"D2","title":"Select and apply built-in tools (Read, Write, Edit, Bash, Grep, Glob) effectively"},{"id":"3.1","domain":"D3","title":"Configure CLAUDE.md files with appropriate hierarchy, scoping, and modular organization"},{"id":"3.2","domain":"D3","title":"Create and configure custom slash commands and s let storageOK = true;

/* study days: local YYYY-MM-DD keys, one per day with any answered item */
function dayKey(t){ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function seedDays(){ // data saved before days were tracked: recover what the last-answered times and mock dates prove
  const set = new Set(); Object.values(S.q).forEach(r=>{ if(r && r.last) set.add(dayKey(r.last)); }); S.mocks.forEach(m=>set.add(dayKey(m.t)));
  return [...set].sort();
}
function markDay(){ const k=dayKey(Date.now()); if(!S.days.includes(k)){ S.days.push(k); S.days.sort(); if(S.days.length>400) S.days=S.days.slice(-400); } }
function studyStreak(){
  const set = new Set(S.days); const d = new Date(); const today = set.has(dayKey(d));
  if(!today) d.setDate(d.getDate()-1);
  let n=0; while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return { n, today };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); S = Object.assign(blank(), o); S.settings = Object.assign(blank().settings, o.settings||{}); if(!o.days) S.days = seedDays(); } }
  catch(e){ storageOK = false; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOK = false; } }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pct(n,d){ return d ? Math.round(100*n/d) : null; }
function fmtPct(p){ return p==null ? '—' : p+'%'; }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
function fmtDate(t){ return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function weightedCounts(total){
  const raw = DORDER.map(d => ({ d, x: total*BP.domains[d].weight/100 }));
  const out = {}; let used = 0;
  raw.forEach(r => { out[r.d] = Math.floor(r.x); used += out[r.d]; });
  raw.map(r => ({ d:r.d, f:r.x-Math.floor(r.x) })).sort((a,b)=>b.f-a.f).slice(0, total-used).forEach(r => out[r.d]++);
  return out;
}
function rec(id){ return S.q[id] || { seen:0, correct:0, wrong:0, box:0, due:0, last:0, streak:0, ms:0 }; }
function isRetired(id){ return id.startsWith('R-'); }
function barClass(p){ return p==null ? '' : p<60 ? 'low' : p<80 ? 'mid' : ''; }
function domName(d){ return BP.domains[d].name; }
let toastT = null;
function toast(t){ const el=document.getElementById('toast'); if(!el) return; el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ el.hidden=true; }, 3000); }
function announce(t){ const l=document.getElementById('live'); if(l){ l.textContent=''; setTimeout(()=>l.textContent=t,30); } }

/* ---------- scoring ---------- */
function grade(q, chosen){
  const chosenSet = new Set(chosen||[]);
  const correctIds = q.options.filter(o=>o.correct).map(o=>o.id);
  const hits = correctIds.filter(id=>chosenSet.has(id)).length;
  const wrongPicks = [...chosenSet].filter(id=>!correctIds.includes(id)).length;
  const exact = hits===correctIds.length && wrongPicks===0 && chosenSet.size===correctIds.length;
  let score = exact ? 1 : 0;
  if(!exact && q.type==='multi' && S.settings.partial) score = hits/correctIds.length;
  return { exact, score, hits, wrongPicks, correctIds };
}
function record(q, chosen, ms, mode){
  const g = grade(q, chosen);
  const r = rec(q.id); const prevBox = r.box||0;
  r.seen++; r.last = Date.now(); markDay(); r.ms = (r.ms||0)+(ms||0);
  if(g.exact){ r.correct++; r.streak=(r.streak||0)+1; r.box = Math.min(5, (r.box||0)+1); }
  else { r.wrong++; r.streak=0; r.box=0; }
  r.due = r.box>=5 ? Infinity : Date.now() + INTERVALS[r.box]*DAY;
  if(r.due===Infinity) r.due = 8640000000000000;
  S.q[q.id] = r;
  g.mastered = !isRetired(q.id) && prevBox<5 && r.box>=5;
  return g;
}
function stats(ids){
  let seen=0, correct=0, n=0;
  ids.forEach(id => { const r=S.q[id]; n++; if(r && r.seen){ seen++; if((r.streak||0)>0) correct++; } });
  return { n, seen, correct, acc: pct(correct, seen) };
}
function accByLatest(ids){ // accuracy counting last attempt only
  let seen=0, ok=0; ids.forEach(id=>{ const r=S.q[id]; if(r&&r.seen){ seen++; if(r.streak>0) ok++; } }); return { seen, ok, acc:pct(ok,seen) };
}
function dueIds(){ const now=Date.now(); return BANK.filter(q=>{ const r=S.q[q.id]; return r && r.seen && r.box<5 && r.due<=now; }).map(q=>q.id); }
function masteredCount(){ return BANK.filter(q=>(S.q[q.id]||{}).box>=5).length; }
function pacing(){ let ms=0,n=0; BANK.forEach(q=>{ const r=S.q[q.id]; if(r&&r.seen){ ms+=r.ms||0; n+=r.seen; } }); return n? Math.round(ms/n/1000) : null; }

/* ---------- mock composition ---------- */
function buildMock(total, minutes){
  const scen = shuffle(BP.scenarios.map(s=>s.id)).slice(0,4);
  const counts = weightedCounts(total);
  const picked = []; let backfilled = 0;
  DORDER.forEach(d => {
    const n = counts[d];
    const inScen = BANK.filter(q=>q.domain===d && scen.includes(q.scenario));
    const outScen = BANK.filter(q=>q.domain===d && !scen.includes(q.scenario));
    const key = q => ((S.q[q.id]||{}).seen||0) + Math.random()*0.5;   // least-seen first, random tiebreak
    const wantMulti = Math.round(n/3);
    const sortedIn = inScen.slice().sort((a,b)=>key(a)-key(b));
    const multi = sortedIn.filter(q=>q.type==='multi').slice(0,wantMulti);
    const single = sortedIn.filter(q=>q.type==='single');
    let chosen = multi.concat(single).slice(0,n);
    if(chosen.length<n){ const extra = outScen.slice().sort((a,b)=>key(a)-key(b)).slice(0, n-chosen.length); backfilled += extra.length; chosen = chosen.concat(extra); }
    picked.push(...chosen);
  });
  // group by scenario in the drawn order; shuffle within scenario
  const ids = [];
  const groups = scen.concat(DORDER.length ? [] : []);
  const byScen = {}; picked.forEach(q => (byScen[q.scenario] = byScen[q.scenario]||[]).push(q.id));
  const scenOrder = scen.concat(Object.keys(byScen).filter(s=>!scen.includes(s)));
  scenOrder.forEach(s => { if(byScen[s]) ids.push(...shuffle(byScen[s])); });
  newSession('mock', ids, { deadline: Date.now()+minutes*60000, scen, note: backfilled ? backfilled+' item(s) were drawn from scenarios outside the four presented because the bank ran short in their domain.' : '' });
}

/* ---------- timer ---------- */
function startTimer(){ stopTimer(); tick = setInterval(renderTimer, 500); renderTimer(); }
function stopTimer(){ if(tick){ clearInterval(tick); tick=null; } const t=document.getElementById('timer'); if(t) t.hidden=true; }
function renderTimer(){
  const t=document.getElementById('timer'); if(!t) return;
  if(!sess || sess.mode!=='mock' || sess.submitted || !sess.deadline){ t.hidden=true; return; }
  const left = sess.deadline-Date.now(); t.hidden=false; t.textContent = fmtTime(left);
  t.className = 'timer' + (left<5*60000 ? ' crit' : left<15*60000 ? ' low' : '');

function submitMock(auto){
  if(!sess || sess.mode!=='mock' || sess.submitted) return;
  if(!sess.reviewing) leaveItem();
  const byDomain = {}; let score=0; const perItem = {}; let mastered=0;
  sess.items.forEach(id => {
    const q = QBY[id]; const g = record(q, sess.answers[id]||[], (sess.spent||{})[id]||0, 'mock');
    perItem[id] = g; score += g.score; if(g.mastered) mastered++;
    const b = byDomain[q.domain] = byDomain[q.domain]||{n:0,c:0}; b.n++; b.c += g.score;
  });
  const secs = Math.round((Date.now()-sess.startedAt)/1000);
  sess.submitted = true; sess.results = { score, n: sess.items.length, pct: Math.round(100*score/sess.items.length), byDomain, secs, perItem, auto:!!auto, filter:'all', mastered, bestRun: sess.bestRun||0 };
  const prev = S.mocks[S.mocks.length-1];
  if(prev){ sess.results.prev = { pct: prev.pct, n: prev.n, byDomain: prev.byDomain, best: Math.max(...S.mocks.map(m=>m.pct)) }; }
  S.mocks.push({ t:Date.now(), n:sess.items.length, pct:sess.results.pct, byDomain, secs });

}

/* ---------- drill / review / retired setup ---------- */
function drillPool(f){
  let pool = (f.retired ? RETIRED : BANK).slice();
  if(f.domain && f.domain!=='all') pool = pool.filter(q=>q.domain===f.domain);
  if(f.task && f.task!=='all') pool = pool.filter(q=>q.task===f.task);
  if(f.type && f.type!=='all') pool = pool.filter(q=>q.type===f.type);
  if(f.scenario && f.scenario!=='all') pool = pool.filter(q=>q.scenario===f.scenario);
  if(f.only==='wrong') pool = pool.filter(q=>{ const r=S.q[q.id]; return r && r.seen && !(r.streak>0); });
  if(f.only==='unseen') pool = pool.filter(q=>!(S.q[q.id]||{}).seen);
  const key = q => ((S.q[q.id]||{}).seen||0) + Math.random()*0.5;
  pool.sort((a,b)=>key(a)-key(b));
  return pool;
}
