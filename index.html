<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free, unofficial practice app for the Claude Certified Architect – Foundations exam. Original questions, drills, timed mock exams and spaced review. Not affiliated with Anthropic.">
<style>[hidden]{display:none!important}</style>
<title>CCA-F Study App</title>
<meta charset="utf-8">
<style>
  :root{
    --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E9ECF2; --ink:#1A2130; --ink2:#525C6E; --faint:#8A93A4;
    --line:#D9DEE7; --line2:#E6EAF0;
    --accent:#2A4BD7; --accent-ink:#1F3AA8; --accent-soft:#E6EBFB; --accent-line:#B9C6F2;
    --good:#1E7F55; --good-soft:#E3F3EA; --good-line:#A9D9BF;
    --warn:#9A6B08; --warn-soft:#FBF1D9; --warn-line:#E7CF8C;
    --bad:#B93A3A; --bad-soft:#FBE7E7; --bad-line:#EBB3B3;
    --multi:#6D3FC7; --multi-soft:#EFE8FB;
    --retired:#7A6F5A; --retired-soft:#F1EDE4;
    --btn-bg:#1A2130; --btn-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(20,28,48,.06), 0 10px 28px -20px rgba(20,28,48,.35);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151C; --surface:#1A1E27; --surface2:#232833; --ink:#E7E9EF; --ink2:#A4ACBB; --faint:#7C8596;
      --line:#2E3440; --line2:#272C37;
      --accent:#8FA6FF; --accent-ink:#B3C3FF; --accent-soft:#1F2740; --accent-line:#33427A;
      --good:#5CC48E; --good-soft:#16302A; --good-line:#2B5A45;
      --warn:#E2B85C; --warn-soft:#332B16; --warn-line:#5E4C22;
      --bad:#F07C7C; --bad-soft:#3A1E1E; --bad-line:#6A3535;
      --multi:#B79BFF; --multi-soft:#2A2340;
      --retired:#B8AD98; --retired-soft:#2A2723;
      --btn-bg:#E7E9EF; --btn-ink:#12151C;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151C; --surface:#1A1E27; --surface2:#232833; --ink:#E7E9EF; --ink2:#A4ACBB; --faint:#7C8596;
    --line:#2E3440; --line2:#272C37;
    --accent:#8FA6FF; --accent-ink:#B3C3FF; --accent-soft:#1F2740; --accent-line:#33427A;
    --good:#5CC48E; --good-soft:#16302A; --good-line:#2B5A45;
    --warn:#E2B85C; --warn-soft:#332B16; --warn-line:#5E4C22;
    --bad:#F07C7C; --bad-soft:#3A1E1E; --bad-line:#6A3535;
    --multi:#B79BFF; --multi-soft:#2A2340;
    --retired:#B8AD98; --retired-soft:#2A2723;
    --btn-bg:#E7E9EF; --btn-ink:#12151C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  code,kbd,.mono{font-family:var(--mono);font-size:.9em}
  code{background:var(--surface2);padding:1px 5px;border-radius:4px;word-break:break-word}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.78em;color:var(--ink2);background:var(--surface)}
  a{color:var(--accent)}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:880px;margin:0 auto;padding-block:0 80px;padding-inline:18px}

  /* top bar */
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar{max-width:880px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .brand span{color:var(--faint);font-size:12px}
  .topright{margin-left:auto;display:flex;align-items:center;gap:8px}
  .timer{font-family:var(--mono);font-size:15px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--surface2);color:var(--ink);font-variant-numeric:tabular-nums}
  .timer.low{background:var(--warn-soft);color:var(--warn)}
  .timer.crit{background:var(--bad-soft);color:var(--bad)}
  nav.tabs{max-width:880px;margin:0 auto;padding:8px 18px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
  nav.tabs button:hover{color:var(--ink);background:var(--surface2)}
  nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  nav.tabs button .n{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:5px}
  .ghostbtn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.4;white-space:nowrap}
  .ghostbtn:hover{background:var(--surface2);color:var(--ink)}

  /* generic */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
  .card.flat{box-shadow:none}
  h1{font-size:24px;margin:26px 0 4px;letter-spacing:-.02em;text-wrap:balance}
  h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
  h3{font-size:15px;margin:0 0 8px}
  p{margin:0}
  .lede{color:var(--ink2);font-size:14px;max-width:62ch}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .btn{background:var(--btn-bg);color:var(--btn-ink);border:0;border-radius:8px;padding:10px 16px;font-size:14.5px;cursor:pointer;font-weight:600}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.secondary:hover{background:var(--surface2);opacity:1}
  .btn.accent{background:var(--accent);color:#fff}
  .btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--bad-line)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
  .chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
  .chip.multi{background:var(--multi-soft);color:var(--multi)}
  .chip.good{background:var(--good-soft);color:var(--good)}
  .chip.bad{background:var(--bad-soft);color:var(--bad)}
  .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .chip.retired{background:var(--retired-soft);color:var(--retired)}
  .chip.mono{font-family:var(--mono);font-weight:500}
  .muted{color:var(--ink2)}
  .faint{color:var(--faint)}
  .small{font-size:13px}
  .warnbox{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);border-radius:8px;padding:10px 13px;font-size:13.5px;margin-top:14px}
  .notebox{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-ink);border-radius:8px;padding:10px 13px;font-size:13.5px;margin-top:14px}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);font-weight:500;min-width:0}
  select,input[type=number]{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);max-width:100%}
  .toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
  .toggle input{width:16px;height:16px;accent-color:var(--accent)}
  hr.sep{border:0;border-top:1px solid var(--line2);margin:16px 0}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:4px}
  .stat{background:var(--surface2);border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat span{font-size:12px;color:var(--ink2)}
  table.dom{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  table.dom th{text-align:left;font-weight:600;color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
  table.dom td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.dom tr:last-child td{border-bottom:0}
  .bar{position:relative;height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;min-width:90px}
  .bar span{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:5px}
  .bar span.low{background:var(--bad)} .bar span.mid{background:var(--warn)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
  .heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:10px}
  .cell{border-radius:8px;padding:8px 9px;border:1px solid var(--line2);background:var(--surface2);cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
  .cell:hover{border-color:var(--accent-line)}
  .cell .id{font-family:var(--mono);font-size:12px;font-weight:600}
  .cell .t{font-size:11.5px;color:var(--ink2);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cell .m{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .cell.g{background:var(--good-soft);border-color:var(--good-line)} .cell.y{background:var(--warn-soft);border-color:var(--warn-line)} .cell.r{background:var(--bad-soft);border-color:var(--bad-line)}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:13.5px}
  .facts div b{display:block;font-weight:600}
  .facts div span{color:var(--ink2)}

  /* quiz */
  .qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .qhead .prog{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-left:auto;font-variant-numeric:tabular-nums}
  .scen{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
  .scen b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:3px}
  .scen p{color:var(--ink2)}
  .stem{font-size:17px;line-height:1.6;margin:0 0 16px}
  .selectnote{font-size:13px;font-weight:600;color:var(--multi);margin:-8px 0 12px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.5;cursor:pointer;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--accent-line);background:var(--surface2)}
  .opt:disabled{cursor:default}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink2);margin-top:1px}
  .opt.multi .k{border-radius:6px}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.correct{border-color:var(--good-line);background:var(--good-soft)}
  .opt.correct .k{background:var(--good);border-color:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
  .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.missed{border-color:var(--good-line);border-style:dashed}
  .opt .why{display:block;margin-top:6px;font-size:13.5px;color:var(--ink2)}
  .opt .why b{color:var(--ink)}
  .verdict{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600;font-size:15px}
  .verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.part{background:var(--warn-soft);color:var(--warn)}
  .expl{margin-top:12px;font-size:14.5px;color:var(--ink);line-height:1.6}
  .expl .ref{display:block;margin-top:8px;font-size:12.5px;color:var(--faint)}
  .qfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
  .qfoot .spacer{flex:1}
  .hint{font-size:12px;color:var(--faint)}
  .hidden-opts{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink2);font-size:14px}

  /* review grid */
  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:12px}
  .rcell{border:1px solid var(--line);border-radius:7px;padding:6px 4px;text-align:center;font-family:var(--mono);font-size:12px;cursor:pointer;background:var(--surface);color:var(--ink)}
  .rcell.a{background:var(--accent-soft);border-color:var(--accent-line)}
  .rcell.f{box-shadow:inset 0 0 0 2px var(--warn)}
  .rcell.ok{background:var(--good-soft);border-color:var(--good-line)} .rcell.no{background:var(--bad-soft);border-color:var(--bad-line)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
  .score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .score b{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .score .pass{font-weight:600}
  details.item{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;margin-top:8px;background:var(--surface)}
  details.item summary{cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center;list-style:none}
  details.item summary::-webkit-details-marker{display:none}
  details.item summary .st{font-size:14px;flex:1;min-width:0}
  details.item[open] summary{margin-bottom:10px}

  /* blueprint */
  details.task{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;margin-top:8px;background:var(--surface);scroll-margin-top:120px}
  details.task summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none;font-size:15px}
  details.task summary::-webkit-details-marker{display:none}
  details.task summary .id{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:13px}
  details.task summary .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
  details.task summary .mbar{display:inline-block;width:56px;min-width:0;height:6px;vertical-align:middle;margin-right:6px}
  details.task h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:12px 0 6px}
  details.task ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink);line-height:1.55}
  details.task li{margin:4px 0}
  .checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;cursor:pointer}
  .checklist label:last-child{border-bottom:0}
  .checklist input{margin-top:4px;accent-color:var(--good);width:16px;height:16px;flex:none}
  .checklist label.done{color:var(--faint);text-decoration:line-through}
  ul.plain{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.55}
  textarea{width:100%;font-family:var(--mono);font-size:12px;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px}
  .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  @media (max-width:600px){ .stem{font-size:16px} .card{padding:16px} .score b{font-size:36px} }
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--good-soft);color:var(--good);border:1px solid var(--good-line);box-shadow:var(--shadow);font-weight:600;font-size:14px;z-index:50}
  @media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} .toast{animation:toastIn .25s ease-out} @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}} }
  a.btn{text-decoration:none;display:inline-flex;align-items:center}
  div.task{border:1px solid var(--line2);border-radius:10px;padding:10px 14px;margin-top:8px;background:var(--surface);scroll-margin-top:120px}
  div.task:focus{outline:2px solid var(--accent);outline-offset:2px}
  div.task .tsum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
  div.task .id{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:13px}
  div.task .tt{flex:1;min-width:12em}
  div.task .cnt{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
  .disclaim{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--ink);border-radius:8px;padding:10px 13px;font-size:13.5px;margin-top:16px}
  .disclaim b{color:var(--warn)}
  footer.foot{max-width:880px;margin:0 auto;padding-block:0 40px;padding-inline:18px;font-size:12.5px;color:var(--faint);line-height:1.5}
  .armed{color:var(--bad);font-size:13px}
</style>
<script>
  (function(){try{var s=JSON.parse(localStorage.getItem('cca-f-study-public')||'{}');var t=s.settings&&s.settings.theme;if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>
<header class="top">
  <div class="topbar">
    <div class="brand"><b>CCA-F Prep</b><span>Unofficial study app · not affiliated with Anthropic</span></div>
    <div class="topright">
      <span id="timer" class="timer" hidden>120:00</span>
      <button class="ghostbtn" id="themeBtn" aria-pressed="false">Theme</button>
    </div>
  </div>
  <nav class="tabs" id="nav" aria-label="Sections">
    <button data-view="home">Dashboard</button>
    <button data-view="mock">Mock exam</button>
    <button data-view="drill">Drill</button>
    <button data-view="review">Spaced review<span class="n" id="dueBadge"></span></button>
    <button data-view="blueprint">Blueprint</button>
    <button data-view="settings">Settings</button>
  </nav>
</header>
<main class="wrap" id="app"></main>
<div class="sr" aria-live="polite" id="live"></div>
<div class="toast" id="toast" aria-hidden="true" hidden></div>
<footer class="foot">Unofficial study material. Not affiliated with, endorsed by, or connected to Anthropic. Every practice question is original and none is real exam content. Your progress is stored only in this browser.</footer>

<script>
/* ====================== DATA (injected by build.py) ====================== */
const DATA = {"bank":[{"id":"N-1.1-01","domain":"D1","task":"1.1","scenario":"S1","type":"single","select":1,"stem":"Your support agent's loop decides whether to call the model again by scanning the last assistant text for the string \"DONE\". In production, 9% of conversations spin until the max_turns safety guard fires: the agent has already told the customer \"Let me know if there is anything else I can help with,\" but never wrote \"DONE\", so the loop keeps sending empty follow-up requests. What is the most effective fix?","options":[{"id":"a","text":"Branch on the response's stop_reason: continue only when it is \"tool_use\" and return to the customer when it is \"end_turn\".","correct":true,"why":"The API already reports whether the model wants tools executed or has finished; stop_reason is the guide's control-flow signal and needs no string matching."},{"id":"b","text":"Add a system prompt instruction that the agent must always finish its final message with the exact token DONE.","correct":false,"why":"This keeps loop termination dependent on a natural-language signal the model may omit; it is the anti-pattern the guide names, not a fix."},{"id":"c","text":"Lower max_turns from 20 to 5 so runaway conversations end sooner.","correct":false,"why":"A tighter iteration cap only shortens the runaway; it makes an arbitrary cap the primary stopping mechanism, another named anti-pattern."},{"id":"d","text":"Terminate the loop whenever the assistant response contains any text block, since a finished answer is always text.","correct":false,"why":"Claude often narrates before a tool_use block in the same response; keying on text content would stop the loop with tools still pending."}],"explanation":"Agentic loop control flow should be driven by stop_reason: \"tool_use\" means execute the requested tools and iterate, \"end_turn\" means the turn is complete. Parsing natural-language signals, using an iteration cap as the main stop, or treating text content as completion are all anti-patterns the guide calls out.","tags":["agentic-loop","stop-reason","anti-pattern"]},{"id":"N-1.1-02","domain":"D1","task":"1.1","scenario":"S4","type":"single","select":1,"stem":"Your developer-productivity agent is asked \"where is retry logic implemented?\" Traces show it calls Grep for \"retry\", your loop runs the Grep, and on the next request the model calls the identical Grep again, then a third time, before giving a vague answer. Inspecting the request payloads, each new iteration contains the assistant's tool_use block followed by a fresh user message that says only \"continue\". What is the most likely root cause?","options":[{"id":"a","text":"The Grep tool's description is too vague, so the model cannot tell whether its query already ran.","correct":false,"why":"The model repeats the call because it never sees the output, not because it misunderstands the tool; a better description would not supply the missing results."},{"id":"b","text":"Sampling temperature is too high, causing the model to forget its earlier tool call.","correct":false,"why":"The tool_use block is present in history; what is missing is the corresponding result, which temperature does not affect."},{"id":"c","text":"max_tokens is too low, truncating the Grep output before the model can read it.","correct":false,"why":"max_tokens bounds the model's generated response, not tool output; and the payloads show no result was sent at all."},{"id":"d","text":"The loop executes the tool but never appends a tool_result block for that tool_use to the conversation, so the model has no output to reason from.","correct":true,"why":"Tool results must be added to conversation history between iterations; without them the model only sees that it asked, not what came back, and asks again."}],"explanation":"Each iteration of the agentic loop must return the executed tool's output as a tool_result in the conversation history before the next request. If the result is dropped and replaced with a generic prompt, the model cannot incorporate the new information and will re-request the same tool.","tags":["agentic-loop","tool-result","conversation-history"]},{"id":"N-1.1-03","domain":"D1","task":"1.1","scenario":"S1","type":"multi","select":2,"stem":"You are reviewing a pull request that implements the agentic loop for the support agent around get_customer, lookup_order, process_refund, and escalate_to_human. The current code sends a request, prints whatever text comes back, and exits. You need to turn this into a working loop. Which two changes are required for the loop to function as the guide describes? (Select TWO.)","options":[{"id":"a","text":"After executing each requested tool, append a tool_result block tied to that tool_use id to the message history before the next request.","correct":true,"why":"Returning results into context is what lets the model incorporate tool output into its next decision; without it the loop cannot progress."},{"id":"b","text":"Keep issuing requests while stop_reason is \"tool_use\", and stop when it is \"end_turn\".","correct":true,"why":"stop_reason is the signal that distinguishes 'I need tools executed' from 'I am finished'; the loop's continuation condition should be built on it."},{"id":"c","text":"Stop the loop as soon as the assistant's text mentions that the issue is resolved.","correct":false,"why":"Parsing natural-language phrases for termination is an explicit anti-pattern; the model may say 'resolved' and still request a tool."},{"id":"d","text":"Inject each tool's output into the system prompt for the following request instead of into the message list.","correct":false,"why":"Tool output belongs in the conversation as a tool_result paired with the tool_use; rewriting the system prompt breaks the request/response pairing the model expects."},{"id":"e","text":"Fix the loop at exactly eight iterations, since a support conversation should never need more than that.","correct":false,"why":"A fixed iteration count as the main stop condition is a named anti-pattern; it truncates long legitimate tasks and cannot detect early completion."}],"explanation":"A minimal correct agentic loop has two essentials: inspect stop_reason to decide whether to continue, and feed executed tool results back into the conversation as tool_result blocks. Termination heuristics based on text content or hard caps are the anti-patterns to avoid.","tags":["agentic-loop","stop-reason","tool-result"]},{"id":"N-1.1-04","domain":"D1","task":"1.1","scenario":"S3","type":"single","select":1,"stem":"The coordinator loop in your research system hard-stops after 8 model calls. Short factual queries complete fine, but broad topics such as \"state of grid-scale battery storage\" are cut off mid-run: logs show the last response had stop_reason \"tool_use\" with pending Task calls, and the delivered report is missing two of five planned sections. What is the best change?","options":[{"id":"a","text":"Raise the limit from 8 to 30 iterations so broad topics have enough room.","correct":false,"why":"A larger cap is still an arbitrary cap as the primary stopping mechanism; some topics will exceed it and short ones gain nothing."},{"id":"b","text":"Instruct the coordinator to write RESEARCH_COMPLETE as its final line and stop when that text appears.","correct":false,"why":"This swaps one anti-pattern for another: parsing a natural-language signal instead of using the stop_reason the API already provides."},{"id":"c","text":"Split each broad topic across more subagents so the coordinator needs fewer iterations.","correct":false,"why":"This may reduce iterations for some topics but leaves the loop's termination logic wrong; the truncation will recur on any sufficiently large task."},{"id":"d","text":"Let stop_reason \"end_turn\" terminate the loop and keep a much higher iteration limit only as a runaway safety backstop.","correct":true,"why":"The model signals completion through stop_reason; the cap should be a last-resort guard, not the mechanism that normally ends the loop."}],"explanation":"The guide names setting an arbitrary iteration cap as the primary stopping mechanism as an anti-pattern. The loop should continue on \"tool_use\" and end on \"end_turn\"; a generous cap can remain as protection against runaway loops but should not be what normally terminates work.","tags":["agentic-loop","iteration-cap","anti-pattern"]},{"id":"N-1.1-05","domain":"D1","task":"1.1","scenario":"S4","type":"single","select":1,"stem":"To make your codebase-exploration agent \"predictable,\" a teammate wrote a keyword router: questions containing \"where\" trigger Glob then Grep, questions containing \"how\" trigger Read on the matched file, and everything else goes straight to the model with no tools. Engineers report that about 20% of questions get the wrong tool path, for example \"how many callers does parseConfig have?\" ends up reading a single file instead of searching. What is the architectural problem?","options":[{"id":"a","text":"The keyword table is incomplete and needs entries for phrasings like \"how many\" and \"which files\".","correct":false,"why":"Extending the table treats the symptom; every new phrasing will need another rule, and the model still cannot adapt to what the tools return."},{"id":"b","text":"Tool selection has been moved into a pre-configured decision tree, when it should be model-driven: give the model Read, Grep, Glob, and Bash with clear descriptions and let it choose based on the question and prior results.","correct":true,"why":"The guide distinguishes model-driven decision-making from fixed tool sequences; the model can reason about which tool fits and revise after seeing results, which a keyword router cannot."},{"id":"c","text":"A small classifier model should replace the keyword matcher to route questions more accurately.","correct":false,"why":"This is more infrastructure for the same wrong design: the routing decision is still made before the model can reason about context or intermediate results."},{"id":"d","text":"tool_choice should be forced to Grep for every request so searching always happens first.","correct":false,"why":"Forcing one tool on every turn is another fixed sequence; it ignores questions where Read or Glob is the right first step."}],"explanation":"In an agentic loop the model decides which tool to call next based on the conversation and the results so far. Pre-configured decision trees or fixed tool sequences remove that adaptability and fail on any request the rules did not anticipate.","tags":["model-driven","decision-tree","tool-selection"]},{"id":"N-1.1-06","domain":"D1","task":"1.1","scenario":"S1","type":"single","select":1,"stem":"Customers report the support agent sends three or four near-identical closing messages such as \"Is there anything else I can help you with?\" at the end of every chat. Reviewing the loop, you find that when a response comes back with stop_reason \"end_turn\", the code appends a user message reading \"continue\" and calls the model again until a turn budget is exhausted. What is the best first step?","options":[{"id":"a","text":"Add a prompt instruction telling the agent to say goodbye only once per conversation.","correct":false,"why":"The model is being re-prompted after it has finished; asking it to be quieter does not stop the loop from issuing pointless requests."},{"id":"b","text":"Deduplicate consecutive assistant messages in the chat UI before showing them to the customer.","correct":false,"why":"This hides the symptom while still spending model calls; the loop logic remains wrong."},{"id":"c","text":"Treat stop_reason \"end_turn\" as the termination condition and return the final response to the customer instead of re-prompting.","correct":true,"why":"\"end_turn\" means the model has completed its turn; the loop should stop there rather than forcing more iterations."},{"id":"d","text":"Reduce the turn budget so only one extra \"continue\" request is sent.","correct":false,"why":"Tuning the cap still relies on an arbitrary iteration limit rather than on the completion signal the API provides."}],"explanation":"The agentic loop terminates when stop_reason is \"end_turn\". Re-prompting a finished model produces filler responses and wastes calls; the loop must honor the completion signal rather than pushing until a budget runs out.","tags":["agentic-loop","end-turn","termination"]},{"id":"N-1.1-07","domain":"D1","task":"1.1","scenario":"S4","type":"multi","select":3,"stem":"During an architecture review of several internal agents built on the Agent SDK, you collect the loop-termination strategy each one uses. Which three of the following implementations exhibit anti-patterns that the guide explicitly warns against? (Select THREE.)","options":[{"id":"a","text":"The loop stops when the assistant's reply contains the phrase \"final answer\".","correct":true,"why":"Parsing natural-language signals for loop termination is a named anti-pattern; the phrase is unreliable and the model may still be requesting tools."},{"id":"b","text":"The loop continues while stop_reason is \"tool_use\" and stops when it is \"end_turn\".","correct":false,"why":"This is the recommended control flow, not an anti-pattern."},{"id":"c","text":"The loop always exits after six iterations regardless of what the sixth response contains.","correct":true,"why":"Using an arbitrary iteration cap as the primary stopping mechanism is a named anti-pattern; it cuts off legitimate work and does not detect early completion."},{"id":"d","text":"The loop stops as soon as any assistant message includes a text block, on the theory that tools never come with prose.","correct":true,"why":"Checking for assistant text as a completion indicator is a named anti-pattern; Claude commonly explains its plan in the same response as a tool_use block."},{"id":"e","text":"The loop is driven by stop_reason and also has a high iteration limit of 50 purely as a runaway guard.","correct":false,"why":"A safety backstop that is not the normal stopping mechanism is acceptable; termination is still driven by stop_reason."},{"id":"f","text":"After each tool executes, the loop appends a tool_result block and sends the updated history back to the model.","correct":false,"why":"Returning tool results into context between iterations is required behavior, not an anti-pattern."}],"explanation":"The guide lists three loop anti-patterns: parsing natural-language signals to decide termination, relying on arbitrary iteration caps as the primary stop, and treating assistant text content as a completion indicator. Correct loops use stop_reason and feed tool results back into history.","tags":["anti-pattern","agentic-loop","termination"]},{"id":"N-1.2-01","domain":"D1","task":"1.2","scenario":"S3","type":"single","select":1,"stem":"In your research system the coordinator spends several turns with the user clarifying scope, then delegates with the prompt \"Analyze the documents we discussed, applying the constraints above.\" In 30% of runs the document analysis subagent responds by asking which documents it should analyze, and in most others it invents constraints that were never agreed. What is the most likely root cause?","options":[{"id":"a","text":"Subagents run with isolated context and do not inherit the coordinator's conversation history, so the delegation prompt must carry the documents and constraints explicitly.","correct":true,"why":"A subagent starts from the prompt it is given; references to 'the documents we discussed' point at history it never received."},{"id":"b","text":"The subagent's system prompt is too short to establish its role as a document analyst.","correct":false,"why":"Role clarity would not tell the subagent which documents or constraints exist; that information lives only in the coordinator's conversation."},{"id":"c","text":"The coordinator's context window is full, so the delegation prompt is being truncated before it reaches the subagent.","correct":false,"why":"The prompt arrives intact; it simply references material the subagent cannot see because context is not shared automatically."},{"id":"d","text":"Shared memory between agents is disabled and needs to be enabled in the AgentDefinition.","correct":false,"why":"There is no automatic shared-memory setting to enable; subagents do not share memory between invocations, which is why explicit passing is required."}],"explanation":"Subagents operate with isolated context. The coordinator must include the relevant documents, findings, and constraints in the delegation prompt itself rather than referring to earlier parts of its own conversation.","tags":["isolated-context","coordinator","delegation"]},{"id":"N-1.2-02","domain":"D1","task":"1.2","scenario":"S3","type":"multi","select":2,"stem":"After one pass through search, document analysis, and synthesis, your report on \"EU battery recycling regulation\" reads well but omits the 2024 amendments entirely. Your coordinator currently returns whatever the synthesis subagent produces. You want to add the iterative refinement loop the guide describes. Which two behaviors should the coordinator implement? (Select TWO.)","options":[{"id":"a","text":"Evaluate the synthesis output for coverage gaps and re-delegate targeted queries (for example, \"2024 amendments to the EU Battery Regulation\") to the search and document analysis subagents.","correct":true,"why":"The coordinator is responsible for judging coverage and dispatching narrow follow-up work to fill identified gaps."},{"id":"b","text":"Re-invoke the synthesis subagent with the original findings plus the new targeted results, repeating until coverage is sufficient.","correct":true,"why":"Refinement is a loop: after gap-filling research, synthesis runs again on the augmented findings rather than the gap being patched by hand."},{"id":"c","text":"Have the synthesis subagent call the web search subagent directly whenever it notices something missing.","correct":false,"why":"Subagent-to-subagent calls bypass the coordinator, losing observability and consistent error handling that the hub-and-spoke design provides."},{"id":"d","text":"Increase the initial number of search queries from 5 to 50 so the first pass is unlikely to miss anything.","correct":false,"why":"Bulk querying up front does not evaluate what the synthesis actually lacks; it adds cost without a mechanism for identifying gaps."},{"id":"e","text":"Run exactly five refinement iterations on every topic regardless of the output.","correct":false,"why":"The loop should end when coverage is judged sufficient; a fixed count both over-runs simple topics and may under-run complex ones."}],"explanation":"In the iterative refinement pattern the coordinator evaluates synthesis output for gaps, re-delegates targeted queries to the search and analysis subagents, and re-invokes synthesis with the enriched findings until coverage is sufficient.","tags":["iterative-refinement","coverage-gap","coordinator"]},{"id":"N-1.2-03","domain":"D1","task":"1.2","scenario":"S3","type":"single","select":1,"stem":"To save latency, an engineer wired the web search subagent to write results into a shared file that the document analysis subagent reads, and document analysis to hand its output straight to synthesis. Last week document analysis crashed on a corrupt PDF; synthesis ran on an empty file and produced a confident, unsourced report that reached a customer. No log shows which stage failed. Which architectural change best prevents this class of failure?","options":[{"id":"a","text":"Add a check in the synthesis subagent that refuses to run when its input file is empty.","correct":false,"why":"This patches one symptom; other partial failures (truncated output, wrong file) would still flow through undetected, and the coordinator still has no visibility."},{"id":"b","text":"Have the document analysis subagent retry the crashed document three times before writing its file.","correct":false,"why":"Retries help with transient errors but do nothing about errors that persist, and the downstream stage still consumes whatever appears in the file."},{"id":"c","text":"Give the synthesis subagent the document analysis tools so it can redo the analysis itself when the input looks wrong.","correct":false,"why":"This blurs subagent responsibilities and still leaves failures invisible to the coordinator that owns the overall task."},{"id":"d","text":"Route every subagent's output and error back through the coordinator, which decides whether to proceed, retry, or annotate the report with a coverage gap.","correct":true,"why":"Hub-and-spoke routing gives the coordinator observability and a single place for consistent error handling and controlled information flow."}],"explanation":"In a hub-and-spoke architecture the coordinator manages all inter-subagent communication. Routing results and errors through it provides observability, consistent error handling, and controlled information flow that direct subagent-to-subagent handoffs cannot.","tags":["hub-and-spoke","error-handling","observability"]},{"id":"N-1.2-04","domain":"D1","task":"1.2","scenario":"S3","type":"single","select":1,"stem":"After a latency initiative, your coordinator was changed to always run only the web search and report subagents, skipping document analysis. Simple questions are now fast, but questions like \"what does the attached 80-page audit conclude about vendor risk?\" get shallow answers built from web snippets, and the audit itself is never opened. What design does the guide recommend?","options":[{"id":"a","text":"Restore the original behavior of always running all four subagents in sequence for every query.","correct":false,"why":"Always running the full pipeline is the opposite failure: it wastes time on narrow queries and does not reflect the query's actual requirements."},{"id":"b","text":"Have the coordinator analyze each query's requirements and dynamically select which subagents to invoke, including document analysis when source documents are involved.","correct":true,"why":"The coordinator's job is to decide which subagents a query needs based on its complexity and inputs rather than following a fixed pipeline."},{"id":"c","text":"Let the user pick a \"fast\" or \"thorough\" mode at submission time that selects the pipeline.","correct":false,"why":"This shifts the coordinator's decomposition responsibility to the user and still forces every query into one of two fixed paths."},{"id":"d","text":"Add document reading tools to the web search subagent so it can cover attached files.","correct":false,"why":"This overloads one subagent with another's role instead of letting the coordinator route work to the specialized subagent that exists for it."}],"explanation":"The coordinator should analyze query requirements and dynamically select which subagents to invoke, rather than always routing through a fixed subset or the full pipeline.","tags":["dynamic-selection","coordinator","query-complexity"]},{"id":"N-1.2-05","domain":"D1","task":"1.2","scenario":"S3","type":"multi","select":2,"stem":"For the broad topic \"global semiconductor supply chain,\" your coordinator spawns three web search subagents with the same instruction: \"find the most relevant sources.\" Roughly 60% of the returned URLs are duplicates, and synthesis receives triplicate findings. Which two partitioning strategies would the coordinator use to minimize duplication? (Select TWO.)","options":[{"id":"a","text":"Assign each subagent a distinct subtopic, such as fabrication capacity, export controls, and raw-material sourcing.","correct":true,"why":"Partitioning by subtopic gives each subagent non-overlapping scope so their results complement rather than repeat one another."},{"id":"b","text":"Assign each subagent a distinct source type, such as news coverage, academic papers, and government filings.","correct":true,"why":"Partitioning by source type is the guide's other named strategy; it produces different evidence bases even for the same subject."},{"id":"c","text":"Give all three subagents the identical query and have the synthesis subagent deduplicate URLs afterward.","correct":false,"why":"Post-hoc deduplication recovers nothing of the wasted search budget and leaves coverage narrow, since all three explored the same space."},{"id":"d","text":"Run the three subagents one after another, each receiving the previous subagent's findings so it can avoid them.","correct":false,"why":"This sacrifices parallelism and still leaves scope undefined; the coordinator should partition scope up front rather than chain searches."},{"id":"e","text":"Raise each subagent's result limit from 10 to 40 so more unique sources surface among the duplicates.","correct":false,"why":"More results from the same undifferentiated query mainly produce more overlap; it does not address how scope is divided."}],"explanation":"The coordinator minimizes duplication by partitioning research scope across subagents, assigning distinct subtopics or distinct source types to each, rather than issuing identical broad instructions.","tags":["scope-partitioning","duplication","coordinator"]},{"id":"N-1.2-06","domain":"D1","task":"1.2","scenario":"S3","type":"single","select":1,"stem":"Post-mortems on three recent reports found the same pattern: a broad topic such as \"remote work and productivity\" was decomposed by the coordinator into subtasks that all sat in one corner of the subject (software teams only), and every subagent executed its narrow assignment correctly. You are redesigning the coordinator to reduce this risk on future topics. Which change addresses the root cause?","options":[{"id":"a","text":"Instruct the web search subagent to broaden its own queries beyond the subtopic it was assigned when the topic seems bigger.","correct":false,"why":"Subagents working outside their assignment undermine the coordinator's control of scope; decomposition is the coordinator's responsibility."},{"id":"b","text":"Cap decomposition at three subtasks so reports stay focused and finish faster.","correct":false,"why":"A fixed small subtask count makes narrow coverage more likely on broad topics, not less."},{"id":"c","text":"Rely on the synthesis subagent to notice missing areas and search for them itself.","correct":false,"why":"Synthesis lacks the coordinator's view of the whole topic and would need to bypass the hub to search; gap detection belongs in the coordinator's refinement loop."},{"id":"d","text":"Have the coordinator first enumerate the major dimensions of the topic, assign subtasks spanning them, and evaluate the synthesis output for coverage gaps before finalizing.","correct":true,"why":"Overly narrow decomposition is a coordinator-level risk; mapping the topic's breadth up front and checking coverage afterward directly targets it."}],"explanation":"Overly narrow task decomposition by the coordinator leads to incomplete coverage of broad topics even when every subagent succeeds. The remedy sits in the coordinator: decompose against the full breadth of the topic and verify coverage in a refinement pass.","tags":["task-decomposition","coverage","coordinator"]},{"id":"N-1.2-07","domain":"D1","task":"1.2","scenario":"S3","type":"multi","select":3,"stem":"You are writing the design document for the coordinator agent in a hub-and-spoke research system with web search, document analysis, synthesis, and report subagents. A reviewer asks you to list precisely which responsibilities the coordinator owns. Which three responsibilities belong to the coordinator in this pattern? (Select THREE.)","options":[{"id":"a","text":"Decomposing the user's query into subtasks and delegating each to the appropriate subagent.","correct":true,"why":"Task decomposition and delegation are core coordinator roles in the pattern."},{"id":"b","text":"Maintaining a single shared conversation history that all subagents read from and write to.","correct":false,"why":"Subagents run with isolated context; the coordinator passes what each needs explicitly rather than exposing a shared transcript."},{"id":"c","text":"Aggregating subagent results and deciding what to do next, including whether more subagents are needed.","correct":true,"why":"Result aggregation and deciding which subagents to invoke based on query complexity are named coordinator responsibilities."},{"id":"d","text":"Letting subagents message one another directly to cut round-trip latency.","correct":false,"why":"Direct subagent-to-subagent communication breaks the hub-and-spoke pattern and removes the coordinator's observability and error handling."},{"id":"e","text":"Receiving errors from subagents and handling them consistently, such as retrying, rerouting, or proceeding with partial results.","correct":true,"why":"The coordinator manages error handling and information routing for all inter-subagent communication."},{"id":"f","text":"Performing the web searches itself when the search subagent is slow.","correct":false,"why":"The coordinator orchestrates; taking over a subagent's work bypasses the specialization and tool restrictions the design depends on."}],"explanation":"In a hub-and-spoke architecture the coordinator decomposes tasks, delegates, aggregates results, decides which subagents to invoke, and manages error handling and routing. It does not share its history with subagents or let them communicate directly.","tags":["coordinator-role","hub-and-spoke","aggregation"]},{"id":"N-1.3-01","domain":"D1","task":"1.3","scenario":"S3","type":"single","select":1,"stem":"Your coordinator's system prompt says to delegate searching to the web-search subagent, and its AgentDefinition entries for all four subagents are registered. Yet every run ends with the coordinator writing \"I will now delegate to the web search subagent\" and then answering from its own knowledge; no subagent ever starts. The coordinator is configured with allowedTools: [\"Read\", \"WebSearch\"]. What is the fix?","options":[{"id":"a","text":"Add the subagent names (\"web-search\", \"document-analysis\") to the coordinator's allowedTools so it can call them.","correct":false,"why":"Subagents are not invoked by name as tools; spawning goes through the Task tool, which is what is missing."},{"id":"b","text":"Set tool_choice to \"any\" so the coordinator is forced to call a tool instead of answering in text.","correct":false,"why":"Forcing tool use cannot make an unavailable tool available; the coordinator has no Task tool to choose."},{"id":"c","text":"Add \"Task\" to the coordinator's allowedTools, since subagents are spawned through the Task tool.","correct":true,"why":"The Task tool is the mechanism for spawning subagents, and a coordinator can only invoke it if allowedTools includes \"Task\"."},{"id":"d","text":"Move the delegation instruction from the system prompt into the first user message so it is closer to the model's attention.","correct":false,"why":"The coordinator already intends to delegate; the failure is a capability gap, not an instruction-placement problem."}],"explanation":"Subagent spawning happens through the Task tool. A coordinator whose allowedTools omits \"Task\" cannot spawn subagents no matter how clearly its prompt instructs it to delegate.","tags":["task-tool","allowedTools","spawning"]},{"id":"N-1.3-02","domain":"D1","task":"1.3","scenario":"S3","type":"single","select":1,"stem":"A trace of a typical research run shows the coordinator emitting one Task call for the web search subagent, waiting about 90 seconds for it to finish, and only then emitting a Task call for the document analysis subagent on a set of uploaded PDFs that does not depend on the search results. End-to-end latency is roughly the sum of the two. Which change gives the largest latency improvement?","options":[{"id":"a","text":"Design the coordinator to emit both Task calls in a single response so the two subagents run in parallel.","correct":true,"why":"Parallel subagent execution comes from issuing multiple Task tool calls in one coordinator response rather than one per turn."},{"id":"b","text":"Have the web search subagent spawn the document analysis subagent itself as soon as it starts.","correct":false,"why":"This bypasses the coordinator and makes the search subagent responsible for orchestration; it also does not match the guide's mechanism for parallelism."},{"id":"c","text":"Run a second coordinator instance dedicated to document analysis.","correct":false,"why":"Duplicating the coordinator adds infrastructure and a new aggregation problem when the existing coordinator can simply issue both calls at once."},{"id":"d","text":"Reduce max_tokens on the web search subagent so it returns sooner.","correct":false,"why":"This may shorten one subagent's output but keeps the two stages serialized, and risks truncating useful findings."}],"explanation":"Independent subagents run in parallel when the coordinator emits multiple Task tool calls within a single response. Issuing them across separate turns serializes the work.","tags":["parallel-subagents","task-tool","latency"]},{"id":"N-1.3-03","domain":"D1","task":"1.3","scenario":"S3","type":"multi","select":2,"stem":"The synthesis subagent's reports contain statistics that appear nowhere in the search or analysis outputs, and cite sources only as \"the research findings.\" The coordinator's Task prompt to it reads, in full: \"Synthesize the research findings gathered so far into a cohesive report with citations.\" Which two changes to how the coordinator invokes the synthesis subagent would fix this? (Select TWO.)","options":[{"id":"a","text":"Include the complete web search results and document analysis outputs directly in the synthesis Task prompt.","correct":true,"why":"Subagents only see what is in their prompt; complete prior findings must be passed in rather than referenced."},{"id":"b","text":"Increase the synthesis subagent's context limit so it can see the coordinator's earlier conversation.","correct":false,"why":"No context limit exposes the parent's history; subagents do not inherit it regardless of size."},{"id":"c","text":"Pass the findings as structured records that separate each claim from its source URL, document name, and page number.","correct":true,"why":"Structured content-versus-metadata formatting preserves attribution so citations survive synthesis."},{"id":"d","text":"Write the findings to a shared memory that subagents read automatically at the start of each invocation.","correct":false,"why":"Subagents do not share memory between invocations; there is no automatic read of a shared store to rely on."},{"id":"e","text":"Add the phrase \"refer to the findings earlier in this conversation\" to the Task prompt.","correct":false,"why":"There is no earlier conversation from the subagent's point of view; the phrasing just points at context that was never provided."},{"id":"f","text":"Give the synthesis subagent the web search tool so it can regenerate the findings itself.","correct":false,"why":"This duplicates the search subagent's work and still does not deliver the document analysis outputs; it also expands the subagent's tool surface unnecessarily."}],"explanation":"Subagent context must be provided explicitly in the prompt. The coordinator should pass complete findings from prior agents into the synthesis prompt, structured so that content and source metadata stay linked.","tags":["explicit-context","synthesis","attribution"]},{"id":"N-1.3-04","domain":"D1","task":"1.3","scenario":"S3","type":"single","select":1,"stem":"Logs show the document analysis subagent occasionally running web searches and writing files; last week it overwrote the report subagent's draft. The coordinator's prompt to it clearly says \"only analyze the provided documents.\" You want a configuration-level guarantee that this subagent stays within its role. Where should the change be made?","options":[{"id":"a","text":"In the document analysis subagent's AgentDefinition: restrict its tools to document reading and analysis tools and give it a focused description and system prompt.","correct":true,"why":"AgentDefinition is where each subagent type's description, system prompt, and tool restrictions are configured; removing tools is a hard boundary."},{"id":"b","text":"Remove WebSearch and Write from the coordinator's allowedTools.","correct":false,"why":"The coordinator's tool list does not govern the subagent's; the subagent has its own definition."},{"id":"c","text":"Repeat the \"only analyze the provided documents\" instruction in the coordinator's Task prompt in capital letters.","correct":false,"why":"Prompt emphasis is still probabilistic; the subagent already had that instruction and ignored it."},{"id":"d","text":"Add a PostToolUse hook that reverts any file the document analysis subagent writes.","correct":false,"why":"PostToolUse transforms results after the fact; it is the wrong mechanism when the goal is to prevent the subagent from having the tool at all."}],"explanation":"Each subagent type is configured through its AgentDefinition, which includes its description, system prompt, and tool restrictions. Tool restrictions in the definition are the reliable way to keep a subagent within its role.","tags":["AgentDefinition","tool-restrictions","subagent"]},{"id":"N-1.3-05","domain":"D1","task":"1.3","scenario":"S3","type":"single","select":1,"stem":"You are writing the delegation prompt the coordinator sends to the web search subagent. Topics vary from niche academic subjects to breaking news, and past prompts have produced poor coverage on unusual topics. Which prompt style does the guide recommend for the coordinator to use?","options":[{"id":"a","text":"\"Run these three queries in order, open the top three results of each, and stop after nine pages.\"","correct":false,"why":"Step-by-step procedural instructions leave the subagent no room to adapt when the fixed queries miss the topic."},{"id":"b","text":"\"Keep searching until you have collected at least twenty links.\"","correct":false,"why":"A quantity target without goals or quality criteria rewards volume over relevance and credibility."},{"id":"c","text":"\"Search the web for information about the topic.\"","correct":false,"why":"This states no research goal or quality bar, so the subagent cannot judge what counts as done or good."},{"id":"d","text":"\"Goal: identify the most credible sources on this topic published since 2023, preferring peer-reviewed work or primary data. For each, return the claim, an evidence excerpt, the URL, and the publication date.\"","correct":true,"why":"Specifying goals and quality criteria, plus the output shape, lets the subagent choose its own search strategy per topic."}],"explanation":"Coordinator prompts should specify research goals and quality criteria rather than step-by-step procedures. Goal-oriented prompts let subagents adapt their approach to each topic.","tags":["coordinator-prompt","quality-criteria","adaptability"]},{"id":"N-1.3-06","domain":"D1","task":"1.3","scenario":"S3","type":"multi","select":3,"stem":"Reviewers found that 18% of citations in generated reports point to the wrong source: the claim is real, but attributed to a different paper than the one it came from. The coordinator currently concatenates all subagent findings into a single prose paragraph before invoking synthesis. Which three practices would preserve attribution through synthesis? (Select THREE.)","options":[{"id":"a","text":"Pass each finding as a structured record with a content field separate from its metadata fields.","correct":true,"why":"Separating content from metadata keeps each claim bound to its own source rather than floating in prose."},{"id":"b","text":"Strip URLs and page numbers before synthesis to save tokens, then add a bibliography at the end.","correct":false,"why":"Once the link between claim and source is removed, synthesis cannot restore it; an appended bibliography does not say which claim came from where."},{"id":"c","text":"Include the source URL or document name and page number in each finding's metadata.","correct":true,"why":"Those are the specific metadata fields the guide names for preserving attribution when passing context between agents."},{"id":"d","text":"Instruct the synthesis subagent to carry each finding's source fields through into the report's citations.","correct":true,"why":"Preserving attribution requires the consuming agent to keep the metadata attached when it combines findings."},{"id":"e","text":"Keep the source list only in the coordinator and let synthesis cite by sequential number.","correct":false,"why":"Synthesis cannot see the coordinator's list, so numbers become arbitrary; attribution must travel with the content."},{"id":"f","text":"Have the synthesis subagent re-search each claim to determine its true source.","correct":false,"why":"Re-deriving provenance is expensive and unreliable when the original source was already known at the time of extraction."}],"explanation":"Structured formats that separate content from metadata such as source URLs, document names, and page numbers let attribution survive as findings move between agents, provided the receiving agent preserves those fields.","tags":["structured-findings","attribution","metadata"]},{"id":"N-1.3-07","domain":"D1","task":"1.3","scenario":"S4","type":"single","select":1,"stem":"Your productivity agent just spent 40 minutes mapping a legacy order-management module: call graph, data model, and known hazards are all in the session. Two engineers now want to try different boilerplate generation approaches for a new adapter, a code-generation approach and a template-expansion approach, and compare the results without either attempt influencing the other. What is the most efficient way to set this up?","options":[{"id":"a","text":"Run both approaches sequentially in the same session, asking the agent to ignore the first when doing the second.","correct":false,"why":"The second attempt's context still contains the first, so its decisions are contaminated; the comparison is not independent."},{"id":"b","text":"Fork the session into two branches from the completed analysis and pursue one approach in each.","correct":true,"why":"Fork-based session management creates independent branches from a shared analysis baseline, which is exactly the divergent-approach use case."},{"id":"c","text":"Start two fresh sessions and let each re-run the 40-minute analysis before generating code.","correct":false,"why":"This discards a valid baseline and doubles the exploration cost for no isolation benefit that forking does not already provide."},{"id":"d","text":"Have the agent spawn two subagents from the current session, one per approach, without passing the analysis.","correct":false,"why":"Subagents do not inherit the parent context, so neither would have the analysis; and this is not the mechanism for branching a session."}],"explanation":"Fork-based session management lets multiple independent branches start from the same analysis baseline, so divergent approaches can be explored and compared without re-exploration or cross-contamination.","tags":["fork-session","divergent-approaches","baseline"]},{"id":"N-1.4-02","domain":"D1","task":"1.4","scenario":"S1","type":"single","select":1,"stem":"A customer writes: \"The blender arrived cracked, I was charged twice, and the email on my account is misspelled.\" Your agent correctly splits this into three items, but then handles them one at a time in three isolated passes: each pass calls get_customer again, each produces its own reply, and the customer receives three disconnected messages 40 seconds apart. Handle time is triple that of single-issue chats. What is the best improvement?","options":[{"id":"a","text":"Investigate the three items in parallel using the shared customer and order context already fetched, then synthesize one unified resolution message.","correct":true,"why":"The guide's pattern is decompose, investigate each concern in parallel with shared context, then synthesize a single resolution."},{"id":"b","text":"Ask the customer to open a separate ticket for each concern so each can be handled cleanly.","correct":false,"why":"This pushes the decomposition burden onto the customer and works against first-contact resolution."},{"id":"c","text":"Resolve only the first concern and escalate the remaining two to a human.","correct":false,"why":"Escalating routine items the agent can handle lowers resolution rate; the problem is orchestration, not capability."},{"id":"d","text":"Route each concern to a fresh agent session so the three investigations cannot interfere with each other.","correct":false,"why":"Fresh sessions discard the shared context, force repeated get_customer calls, and still yield disconnected replies."}],"explanation":"Multi-concern requests should be decomposed into distinct items, investigated in parallel using shared context, and then synthesized into one unified resolution rather than handled as separate serialized conversations.","tags":["multi-concern","parallel-investigation","synthesis"]},{"id":"N-1.4-03","domain":"D1","task":"1.4","scenario":"S1","type":"single","select":1,"stem":"Your agent determined that a customer's duplicate charge was caused by a retried payment webhook, computed a $64.20 refund, then hit a policy limit and called escalate_to_human with the payload {\"reason\": \"billing issue, please assist\"}. Human agents cannot see the chat transcript and spent 18 minutes re-investigating from scratch. Which change most directly reduces the post-handoff resolution time?","options":[{"id":"a","text":"Have the agent hold the conversation open and keep trying alternatives instead of escalating mid-process.","correct":false,"why":"The escalation was correct given the policy limit; the failure is in what was handed over, not in escalating."},{"id":"b","text":"Attach the raw JSON of every tool call the agent made so the human has all the data.","correct":false,"why":"Raw tool output shifts analysis onto the human; it is not the structured summary the guide describes and still requires re-investigation."},{"id":"c","text":"Grant human agents read access to the full conversation transcript.","correct":false,"why":"Even with transcript access, humans would have to reconstruct the analysis; the guide's handoff protocol compiles it for them."},{"id":"d","text":"Have escalate_to_human carry a structured summary: verified customer ID, root cause (retried payment webhook), the computed refund amount, and a recommended action.","correct":true,"why":"A structured handoff with customer details, root cause analysis, and recommended actions lets a human who lacks the transcript act immediately."}],"explanation":"Mid-process escalation should use a structured handoff protocol that includes customer details, root cause analysis, and recommended actions, because the receiving human lacks the conversation transcript and should not repeat the investigation.","tags":["handoff","escalation","structured-summary"]},{"id":"N-1.4-04","domain":"D1","task":"1.4","scenario":"S1","type":"single","select":1,"stem":"You have decided that process_refund must never execute unless get_customer has returned a verified customer ID earlier in the same session. Your MCP tools are already defined and the agentic loop is in place. Where should this prerequisite be implemented so that it holds regardless of what the model decides?","options":[{"id":"a","text":"In the process_refund tool description, state that a verified customer ID from get_customer is required.","correct":false,"why":"Descriptions inform the model's choices but cannot stop a call; this remains prompt-level guidance."},{"id":"b","text":"Order the tool list so get_customer appears before process_refund, since the model tends to call tools in listed order.","correct":false,"why":"Tool ordering in the definitions has no enforcement effect; the model chooses based on context, not list position."},{"id":"c","text":"Set tool_choice to force get_customer on every request so verification always happens.","correct":false,"why":"Forcing one tool on every turn would break the conversation and still would not block a later refund on an unverified account."},{"id":"d","text":"In the tool-execution path of the loop, check session state for a verified customer ID and reject process_refund calls that lack one.","correct":true,"why":"A programmatic gate in the loop blocks the downstream call until the prerequisite step has completed, independent of the model's judgment."}],"explanation":"Programmatic prerequisites live in the code that executes tool calls: they block downstream operations such as process_refund until the prerequisite step, get_customer with a verified ID, has completed. Descriptions, ordering, and forced tool choice do not enforce sequencing.","tags":["prerequisite-gate","process-refund","enforcement"]},{"id":"N-1.4-05","domain":"D1","task":"1.4","scenario":"S1","type":"single","select":1,"stem":"Your support agent must follow two ordering rules. Rule 1: identity must be verified via get_customer before process_refund runs. Rule 2: when a customer mentions a delivery problem, it is usually better to check lookup_order before offering a replacement, though exceptions are fine. A teammate proposes handling both the same way. How should each rule be implemented?","options":[{"id":"a","text":"Both rules as numbered steps in the system prompt, since the model follows explicit sequences well.","correct":false,"why":"Rule 1 has financial consequences and requires deterministic compliance, which prompt guidance cannot guarantee."},{"id":"b","text":"Rule 1 as a programmatic gate blocking process_refund until verification; Rule 2 as prompt guidance the model can weigh in context.","correct":true,"why":"Programmatic enforcement suits rules that must never fail; prompt guidance suits soft preferences that benefit from judgment."},{"id":"c","text":"Rule 2 as a programmatic gate and Rule 1 as prompt guidance, since delivery checks are more frequent.","correct":false,"why":"This inverts the criterion: frequency is not what decides enforcement, consequence of failure is."},{"id":"d","text":"Replace both with a fixed tool sequence of get_customer, lookup_order, then process_refund on every conversation.","correct":false,"why":"A hard-coded sequence removes model-driven decision-making and runs unnecessary steps for conversations that need none of them."}],"explanation":"The guide distinguishes programmatic enforcement (hooks and prerequisite gates) for steps that require deterministic compliance from prompt-based guidance for ordering preferences where the model's judgment is acceptable.","tags":["enforcement-vs-guidance","workflow-ordering","hooks"]},{"id":"N-1.4-06","domain":"D1","task":"1.4","scenario":"S1","type":"multi","select":3,"stem":"You are defining the schema for the escalate_to_human tool's payload. Human agents work in a separate ticketing system with no access to the agent conversation, and they need to act on the ticket without re-running the investigation. Which three elements should the structured handoff summary include? (Select THREE.)","options":[{"id":"a","text":"The verified customer ID and the order or account identifiers involved.","correct":true,"why":"Customer details are the first element of the handoff so the human can locate the right account immediately."},{"id":"b","text":"The agent's full reasoning trace for every turn of the conversation.","correct":false,"why":"A raw trace is not a structured summary; it forces the human to read and reconstruct rather than act."},{"id":"c","text":"The root cause the agent determined, such as a retried webhook producing a duplicate charge.","correct":true,"why":"Root cause analysis is a named component; it is the investigative work the human should not have to repeat."},{"id":"d","text":"The system prompt and tool definitions the agent was running with.","correct":false,"why":"Configuration details do not help a human resolve the customer's issue."},{"id":"e","text":"The refund amount computed and a recommended action for the human to take or approve.","correct":true,"why":"Recommended actions and the specific amount let the human approve or adjust rather than start over."},{"id":"f","text":"A request that the customer restate the problem to the human agent from the beginning.","correct":false,"why":"Making the customer repeat themselves is the outcome a structured handoff exists to prevent."}],"explanation":"A structured handoff summary for a human without transcript access should carry the customer ID, the root cause, the refund amount, and a recommended action, so the human can act rather than re-investigate.","tags":["handoff-schema","escalate-to-human","structured-summary"]},{"id":"N-1.4-07","domain":"D1","task":"1.4","scenario":"S1","type":"multi","select":2,"stem":"A product manager, worried about unverified refunds, proposes replacing the model-driven support flow with a scripted sequence that always runs get_customer, then lookup_order, then process_refund, arguing it is the only way to guarantee ordering. You want to keep the agent's ability to choose tools while still guaranteeing that refunds never precede verification. Which two statements support your position? (Select TWO.)","options":[{"id":"a","text":"A prerequisite gate on process_refund provides the same deterministic guarantee as a fixed script without dictating the rest of the tool sequence.","correct":true,"why":"Programmatic gates enforce the one ordering that matters while leaving other tool decisions to the model."},{"id":"b","text":"A fixed script would run lookup_order and process_refund on conversations that need neither, removing the model's ability to adapt to the request.","correct":true,"why":"Pre-configured sequences sacrifice model-driven decision-making, which the guide contrasts with programmatic enforcement of specific prerequisites."},{"id":"c","text":"A strongly worded system prompt is sufficient to guarantee the ordering, so no script or gate is needed.","correct":false,"why":"Prompt instructions have a non-zero failure rate and cannot provide a guarantee for a financial operation."},{"id":"d","text":"Hooks and gates cannot observe which tools ran earlier in a session, so only a script can enforce ordering.","correct":false,"why":"Programmatic prerequisites are specifically about checking that prior steps completed before allowing a downstream call."},{"id":"e","text":"The refund tool should be removed entirely and all refunds routed to humans to avoid the ordering problem.","correct":false,"why":"This abandons the resolution target instead of solving the ordering requirement, which a gate handles cleanly."}],"explanation":"Programmatic prerequisites give deterministic guarantees for specific ordering rules while preserving model-driven tool selection for everything else. A fully scripted tool sequence trades away adaptability, and prompt instructions alone cannot guarantee compliance.","tags":["prerequisite-gate","model-driven","enforcement"]},{"id":"N-1.5-01","domain":"D1","task":"1.5","scenario":"S1","type":"single","select":1,"stem":"Your agent told a customer their order would arrive on \"January 1, 1970\" and that its status was \"3\". Investigation shows lookup_order returns ship dates as Unix timestamps and status as a numeric code, get_customer returns ISO 8601 dates, and a third vendor-managed shipping MCP server returns yet another format. You cannot change two of the three servers. What is the most effective fix?","options":[{"id":"a","text":"Implement a PostToolUse hook that converts all timestamps to one date format and maps numeric status codes to named statuses before the results reach the model.","correct":true,"why":"PostToolUse hooks intercept tool results for transformation before the model processes them, which is the guide's mechanism for normalizing heterogeneous formats."},{"id":"b","text":"Document each tool's date and status encoding in its description and instruct the agent to convert values before replying.","correct":false,"why":"This leaves conversion to probabilistic model behavior on every turn; the misreads will recur at some rate."},{"id":"c","text":"Add a convert_format tool the agent can call whenever it receives an unfamiliar value.","correct":false,"why":"This adds a round-trip per value and still depends on the model noticing the format problem, which is what failed."},{"id":"d","text":"Rewrite all three MCP servers to return a common schema.","correct":false,"why":"Two of the servers are outside your control; normalization in the hook layer works regardless of who owns the tools."}],"explanation":"PostToolUse hooks intercept tool results and can normalize heterogeneous data such as Unix timestamps, ISO 8601 dates, and numeric status codes into a consistent form before the agent reasons about them, without depending on model-side conversion.","tags":["PostToolUse","normalization","heterogeneous-formats"]},{"id":"N-1.5-02","domain":"D1","task":"1.5","scenario":"S1","type":"single","select":1,"stem":"You added a tool-call interception hook that blocks any process_refund call above $500. It works: no over-limit refund has executed since. But the hook simply returns \"denied,\" and in these cases the agent tells the customer \"I am unable to process that\" and ends the chat. Churn on high-value disputes has risen. What should the hook do instead?","options":[{"id":"a","text":"Silently reduce the refund amount to $500 and allow the call to proceed.","correct":false,"why":"Altering the financial action without the customer's or a human's knowledge is a worse policy violation than the one being blocked."},{"id":"b","text":"Allow the refund when the customer explicitly confirms the amount a second time.","correct":false,"why":"Customer insistence is not a policy criterion; the threshold exists precisely to require a human decision."},{"id":"c","text":"Block the process_refund call and redirect the agent into the human escalation workflow, returning context that explains the threshold and directs it to escalate_to_human.","correct":true,"why":"Interception hooks should block the violating action and redirect to an alternative workflow, so the case is resolved by a human rather than abandoned."},{"id":"d","text":"Raise an exception that terminates the session so the violation is logged for review.","correct":false,"why":"Terminating the conversation guarantees a poor customer outcome and does not route the case to anyone who can resolve it."}],"explanation":"Tool-call interception hooks that enforce policy should both block the violating action and redirect to an alternative path, such as human escalation, rather than leaving the agent with a dead end.","tags":["interception-hook","refund-threshold","escalation-redirect"]},{"id":"N-1.5-03","domain":"D1","task":"1.5","scenario":"S1","type":"multi","select":2,"stem":"During design review for the support agent, a colleague asks what Agent SDK hooks are actually for, since the team has been using prompt instructions for everything. Which two use cases are hook patterns the guide describes? (Select TWO.)","options":[{"id":"a","text":"A PostToolUse hook that transforms a tool's result, for example normalizing date formats, before the model processes it.","correct":true,"why":"Intercepting tool results for transformation before the model sees them is one of the two hook patterns the guide names."},{"id":"b","text":"A hook that intercepts an outgoing tool call and blocks it when it violates a compliance rule, such as a refund over a threshold.","correct":true,"why":"Intercepting outgoing tool calls to enforce compliance rules is the other named hook pattern."},{"id":"c","text":"A hook that rewrites the model's stop_reason from \"end_turn\" to \"tool_use\" when m
